# Multi-cluster dispatch pool (item 4) — TEMPLATE.
#
# Copy this to conf/cluster_pool.yaml (gitignored) and fill in your real ssh
# aliases / usernames / repo paths. The real file is local-only because it
# carries the private cluster CONNECTION (ssh host/user, repo path) — same
# reason scripts/ and cluster_files/ are gitignored.
#
# SENSITIVITY SPLIT (item 3): this file holds ONLY the private connection + the
# ordered list + pins. Each cluster's PUBLIC server config, QOS limits, sbatch
# wrapper, and `budget` live in the committed conf/clusters/<name>.yaml, keyed by
# the `name` below. `dispatch.py` merges the two.
#
# Order = preference: fill the first cluster's server budget, overflow the rest
# to the next. Each cluster runs its own single-cluster orchestrator natively
# (submitted via its conf/clusters/<name>.yaml `sbatch` wrapper over ssh).

clusters:
  - name: aicr        # must match conf/clusters/aicr.yaml
    ssh: aicr         # ssh alias in ~/.ssh/config
    repo: ~/projects/imaging_text_attacks_for_llm_jailbreaking
  - name: nurc        # conda; use name: nurc_uv (conf/clusters/nurc_uv.yaml) for the uv env
    ssh: <neu-id>@login.explorer.northeastern.edu
    repo: ~/projects/imaging_text_attacks_for_llm_jailbreaking

# Optional: pin a model (by model_id) onto a specific cluster, overriding the
# automatic AICR-first packing. Every task needing that model is forced onto the
# named cluster. Use to keep a large judge served ONCE (on the big-GPU cluster)
# instead of duplicated across a split.
pins: {}
  # llama_guard_3_8b: aicr
