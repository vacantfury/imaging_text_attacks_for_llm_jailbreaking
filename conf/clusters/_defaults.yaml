# Cluster-AGNOSTIC vLLM server defaults — shared by every cluster in conf/clusters/.
# Per-cluster files (nurc.yaml, aicr.yaml, …) overlay only what DIFFERS; per-model
# conf/llm/<model>.yaml::cluster blocks overlay LAST (they win). Merged by
# config.load_cluster_profile() and Experiment._load_cluster_config().
# (Item 3, 2026-07-14: replaces the old conf/llm/default.yaml `cluster:` block —
# NURC and AICR are now peers over this, no more NURC-as-base asymmetry.)
cluster:
  # request / sizing (per-model overrides common: num_gpus, mem_gb, quantization, …)
  num_gpus: 1
  num_instances: 1
  cpus_per_task: 4
  mem_gb: 32
  port: 8000
  gpu_memory_utilization: 0.9
  max_model_len: 20480   # covers ~17.5k code_attack ir_plain overflows; residual
                         # overflows are excluded via is_correctly_processed.
  dtype: null
  chat_template: null
  trust_remote_code: false
  gpu_types_excluded: []
  # GPU request directive: "gres" -> `--gres=gpu:N` (NURC); "gpus" -> `--gpus=N`
  # (AICR, homogeneous partitions). Per-cluster overrides.
  gpu_request_style: gres
  # HF offline exports in the generated vLLM sbatch. NURC keeps the historical
  # true (unchanged); AICR sets false (compute-node internet). Per-cluster overrides.
  hf_offline: true
  # timeouts / polling (cluster-agnostic)
  server_start_timeout: 3600
  endpoint_wait_timeout: 30
  cluster_server_endpoint_timeout: 10000
  monitor_poll_interval: 10
  health_check_timeout: 5
  slurm_cmd_timeout: 15
  health_recheck_interval: 60
  # --- server-lifecycle hygiene (llm_utils v5.1.0, family cluster-job standard §5) ---
  # Nest each run's vLLM server logs under logs/run_<run_id>/ instead of letting
  # concurrent runs interleave in flat logs/. This account is shared and runs
  # concurrently, which is why --clean-logs became opt-in (owner 2026-07-16);
  # this fixes the interleaving at the source. Safe: nothing in this repo reads
  # vllm_*.out/.err — the check-experiment-results skill reads logs/mj_*, the
  # ORCHESTRATOR's own sbatch log, which is unaffected (its path is set by
  # #SBATCH --output in the wrappers, not by this key).
  run_scoped_logs: true
  # Job ledgers (logs/slurm_jobs_<run_id>.json) stay in the BASE logs/ dir either
  # way, so a later run can still find a dead run's ledger and reap its servers.
  # NOTE: our orchestrator is an sbatch job on whatever node SLURM picks, so a
  # later run usually sees a foreign-host ledger and REPORTS a ready-to-paste
  # `scancel <ids>` rather than reaping automatically. Leave true: reporting is
  # the whole value here (invisible orphans become one loud log line).
  reap_orphans: true
  # Evict a pool endpoint only after this many CONSECUTIVE health-check failures
  # (pre-v5.1.0 behavior was 1 = a single failed ping evicted permanently).
  # Tuning path: the structured `EVICTION` log lines llm_utils emits at the
  # threshold are the data stream; raise if healthy servers still get evicted
  # under load, lower if dead servers linger. Upstream default is 3.
  eviction_failure_threshold: 3
