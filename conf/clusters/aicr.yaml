# AICR (Massachusetts AI Compute Resource) — uv env, RTX PRO 6000 (~96GB), multi-GPU.
# Peer of nurc.yaml over conf/clusters/_defaults.yaml. Loaded when CLUSTER_PROFILE=aicr
# (scripts/run_experiment_aicr.sbatch). Full facts: cluster_files/aicr_cluster_properties.md.
cluster:
  # --- dispatch / limits ---
  sbatch: scripts/run_experiment_aicr.sbatch
  budget: 7                                 # concurrent vLLM servers (multi_cluster placement)
  # GPU quota, measured 2026-07-25: rtx-batch QOS allows MaxTRESPU=gres/gpu=32
  # per user and sets NO per-user job cap — far looser than NURC. 12 leaves a
  # wide margin under the 32 ceiling while still letting a 4-server round start
  # alongside an unrelated 5-server run (the exact case that the old
  # `max_submit - all_jobs` arithmetic wrongly reduced to a single server).
  max_gpu_jobs: 12
  max_submit: 8
  max_slurm_time_limit: "24:00:00"          # AICR batch allows 24h (raises the old NURC-derived 8h clamp)
  # --- AICR-specific server params (rest inherit _defaults.yaml) ---
  partition: rtx-batch                      # use b200-batch for the biggest models
  gpu_request_style: gpus                   # homogeneous partitions -> `--gpus=N`
  excluded_nodes: []
  time_limit: "24:00:00"                    # default vLLM server wall = AICR's 24h cap (raised 2026-07-21:
                                            # big multi-target rounds with SemanticSmooth's 5x overhead on
                                            # 10k-draw cells exceed 8h per target; servers auto-shut when their
                                            # cells finish, so 24h is a ceiling not a floor).
  cuda_module: "cuda/13.1.1"
  hf_home: /scratch/zhang_haoyu6_neu/huggingface_cache
  hf_offline: false                         # AICR compute nodes have internet
  # Big multi-cell rounds share 1 server/target; a cell waits (exclusive-ish acquire)
  # for its turn. The _defaults 10000s (2.7h) endpoint-wait was too short — cells queued
  # behind others on a busy server timed out and FAILED (job 173095, 2026-07-21). Raise
  # to 72000s (20h, under the 24h walls) so a queued cell waits for its slot instead of failing.
  cluster_server_endpoint_timeout: 72000
  # uv-venv activation REPLACES the conda default. Multi-GPU tensor-parallel (num_gpus>1)
  # is set PER-MODEL in conf/llm/<model>.yaml; gpu_request_style: gpus makes `--gpus=N` work.
  env_setup:
    - "module load cuda/13.1.1"
    - "source $HOME/venvs/imaging_aicr/bin/activate"   # venv OUTSIDE the repo (sync-proof; 2026-07-18)
