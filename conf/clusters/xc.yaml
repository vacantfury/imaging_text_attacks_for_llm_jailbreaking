# xc cluster — single-node SLURM (installed 2026-07-18, box owner approved), 8×A100-SXM4-80GB.
# Peer of nurc.yaml / aicr.yaml over conf/clusters/_defaults.yaml. Loaded when
# CLUSTER_PROFILE=xc (scripts/run_experiment_xc.sbatch). Full facts + runbook:
# cluster_files/xc_cluster_properties.md (gitignored; connection details stay private).
#
# Roles for this cluster (owner routing policy 2026-07-18):
#   API-first — AWS Bedrock via the box's AWS profile (no GPU, no server jobs).
#   GPU THIRD tier — vLLM serving on the A100s once AICR+NURC are capped, degraded, or
#   lack the model. THIRD resort, NOT "last resort": routing here is a normal move, not an
#   emergency one (owner correction 2026-07-29).
cluster:
  # --- routing capabilities (multi_cluster.plan_split; owner routing policy 2026-07-18) ---
  # OWNER RULE (2026-07-18): on xc we run ONLY Bedrock API models (self-served on xc's own
  # arise-beta creds) + GPU-served open models. We do NOT run any OTHER API model here
  # (OpenAI/Anthropic/Google/DeepSeek/… — incl. the gpt-5-mini judge); those run ONLY on
  # aicr/nurc. So the op service-account token / general API keys are deliberately NOT
  # installed on xc (also avoids exposing the dev vault on xc's shared `ubuntu` account).
  # Enforced by the flags below: `api_keys: false` makes plan_split route every non-Bedrock
  # API task to an api_keys cluster (aicr/nurc), and flag a Bedrock+other-API task as
  # needing a decoupled stage. The HF token for model DOWNLOADS is injected transiently via
  # op (not persisted) — that is not "running an API model", so it does not change this.
  bedrock: true                             # ONLY cluster that can invoke AWS Bedrock
  api_keys: false                           # NO general API keys here → non-Bedrock API → aicr/nurc
  # --- dispatch / limits ---
  sbatch: scripts/run_experiment_xc.sbatch
  budget: 6                                 # concurrent vLLM servers; 8 GPUs total but leave
                                            # 2 for the box owner's direct (non-SLURM) use —
                                            # SLURM can't see his processes, so stay polite.
  max_submit: 8                             # no QOS on the box; match the code cap
  max_slurm_time_limit: "24:00:00"
  # --- xc-specific server params (rest inherit _defaults.yaml) ---
  partition: main                           # the single partition of the single node
  gpu_request_style: gres                   # slurm.conf uses GresTypes=gpu (gpu:a100:8)
  excluded_nodes: []
  # DEFAULT vLLM SERVER WALL — 24h on xc, not the 8h used elsewhere (2026-07-30).
  # A vLLM server must OUTLIVE the whole orchestrator run, judge included; when it
  # doesn't, the round does not fail loudly — the endpoint vanishes mid-round and
  # the remaining tasks hang on acquire_endpoint() until something times out. That
  # is how the NURC round silently burned ~9h (job 8819870).
  # 8h was calibrated for AICR/NURC, where a shared queue makes a long wall
  # antisocial and rounds are correspondingly small. xc is a single dedicated box
  # whose partition has NO time limit of its own, so the only real cost of a long
  # wall is that a HUNG server squats its GPU longer before someone scancels it.
  # P6's per-target presets run 5-14h each at 10,000 draws, which 8h does not cover.
  # 24h matches max_slurm_time_limit above; a round expected to exceed that must be
  # SPLIT into more submissions rather than have this raised further.
  time_limit: "24:00:00"                    # default vLLM server wall
  # PORT BASE — xc-specific and load-bearing (2026-07-28). Everywhere else each vLLM
  # server owns its own NODE, so the 8000 default in _defaults.yaml never collides.
  # xc is ONE node SHARED with the box owner, whose own service holds :8000 — our
  # server died with `OSError: [Errno 98] Address already in use` before serving a
  # single request, and the run reported "Successful: 0" (job 43). Ports are assigned
  # contiguously from this base across models (experiment.py::_assign_ports), so this
  # reserves 8400+ for us. Surveyed in use on the box: 22, 53, 6666, 6817-8, 8000,
  # 16000 — 8400+ is clear. Re-check with `ss -ltn` if a server ever fails to bind.
  port: 8400
  hf_home: /home/thomas/huggingface_cache   # dedicated `thomas` user home (isolated; 2026-07-19)
  hf_offline: false                         # box has internet
  # uv venv activation REPLACES the module/conda default (no `module` command on the box).
  # VLLM_USE_FLASHINFER_SAMPLER=0 is LOAD-BEARING on xc: the box has the GPU driver
  # but NO CUDA dev toolkit (no nvcc), and vLLM 0.25.0's default FlashInfer sampler
  # JIT-compiles a kernel at engine init → "Could not find nvcc" → EngineCore dies.
  # Disabling it makes vLLM fall back to the prebuilt FLASH_ATTN attention backend
  # (shipped in the wheel, no compile) — verified serving Qwen on an A100 2026-07-18.
  # NURC/AICR don't need this (they `module load cuda/...`, so nvcc is present).
  env_setup:
    - "export VLLM_USE_FLASHINFER_SAMPLER=0"
    - "source $HOME/venvs/imaging_xc/bin/activate"   # venv OUTSIDE the repo (sync-proof; 2026-07-18)
    - "test -f $HOME/.xc_env && source $HOME/.xc_env || true"   # gated-HF token (HUGGINGFACE_TOKEN) into SERVER jobs; op-sourced, chmod 600 (2026-07-21) — needed for WildGuard/LlamaGuard gated downloads
