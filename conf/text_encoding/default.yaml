# ============================================================
# Default text encoding parameters — all encoders inherit these.
# ============================================================

encoder_type: non_llm_baseline

# LLM parameters (for LLM-based encoders)
model: gpt_4o               # default processing model
temperature: null            # null = use service default
max_tokens: null             # null = use service default
use_few_shot: true           # include few-shot demonstrations

# Non-LLM parameters
num_parts: 6                 # for split-reassemble encoders
num_symbols: 10              # for symbol injection encoder
