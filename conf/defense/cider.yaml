# CIDER — Cross-modality Information DEtectoR.
# Xu, Qi, Qin & Wang, Findings of EMNLP 2024 (2024.findings-emnlp.803). ESTABLISHED
# LITERATURE — a published third-party defense, not a proposal of ours.
# Implementation:  src/defense/cider.py
# Reference impl:  other_repos/CIDER  (code/defender.py + code/utils.py)
#
# ROLE IN THE PAPER — review 18 con 7 / Q4. Section 2 conceded CIDER was "eligible
# in principle" and left uncompared, which the reviewer turned into the objection
# that our frontier cannot speak for black-box VLM defense generally. This closes it
# with a measurement instead of a narrowed claim.
#
# PRE-REGISTERED PREDICTION (recorded BEFORE the run):
#   CIDER's signal is the cross-modal similarity shift caused by DENOISING, which
#   exists because optimization-based attacks write adversarial NOISE into the
#   image. Our image attacks are clean synthetic renders (typography, flowcharts,
#   low-contrast text, occlusion, distraction grids) with no perturbation at all.
#   => Predict CIDER's delta distribution on our attacks is indistinguishable from
#      its distribution on benign renders, so at any tau calibrated to a tolerable
#      benign false-positive rate it blocks few or no attacks: high ensemble ASR at
#      low over-refusal — the low-cost / low-coverage corner of OUR frontier, the
#      same corner ECSO occupies.
#   => FALSIFIED IF CIDER blocks representation-shifting renders at a rate that
#      moves ensemble ASR materially at a benign FPR we would accept. That would be
#      a genuine off-frontier point and the paper's scope claim would need rewriting
#      rather than defending.
#
# DENOISER — the authors' HEADLINE guided-diffusion path is now the default
# (wired 2026-08-05). It noises each image to t and takes ONE p_sample step
# keeping pred_xstart, independently at t = 50,100,...,350 — seven checkpoints,
# flagging if ANY delta dips below tau. The UNet/diffusion code is vendored at
# src/defense/vendor/guided_diffusion (OpenAI, MIT — the same copy CIDER vendors);
# the ~2GB checkpoint is not redistributable through the repo and is downloaded
# per machine (see diffusion_checkpoint below).
#   `denoiser: dncnn` selects their shipped fallback, which denoises ONCE => one
#   delta instead of seven => strictly fewer chances to trip => a LOWER BOUND on
#   CIDER's detection power, biased toward our own pre-registered expectation.
#   Only use it if the diffusion checkpoint is unavailable, and label it as such.
#
# ENCODER — CORRECTED 2026-08-05. This file previously set `clip_model` and claimed
# that calling CLIP ViT-L/14-336 directly "reproduces their primary setup" because
# LLaVA-1.5-7B's vision tower is that CLIP checkpoint. That was WRONG. The authors
# embed images through the vision tower AND the multi_modal_projector into the LLM's
# input-embedding space, and embed text with the LLM's own embedding table —
# CLIP's text encoder is never called (code/utils.py:200-281; paper §4.1, §6).
# Cosine similarity in those two spaces is not the same quantity, so tau does not
# transfer. Delta traces produced before this date are INVALID; discard them.

encoder_model: llava-hf/llava-1.5-7b-hf

# The authors' headline denoiser. Their threshold_selection.py uses
# generate_denoised_img(model="diffusion", cps=8) with step=50, i.e.
# range(50, 400, 50) => the seven checkpoints below.
denoiser: diffusion
denoise_steps: 350
denoise_every: 50

# ~2GB, NOT in the repo (too large, and not ours to redistribute). Download once
# per machine:
#   curl -L -o ~/models/cider_256x256_diffusion_uncond.pt \
#     https://openaipublic.blob.core.windows.net/diffusion/jul-2021/256x256_diffusion_uncond.pt
diffusion_checkpoint: ~/models/cider_256x256_diffusion_uncond.pt

# The authors ship these weights at code/models/DnCNN/checkpoint.pth.tar. other_repos/
# is gitignored, so the file is copied to each cluster by hand and this path points at
# the copy. A mismatched checkpoint raises rather than running a random denoiser.
dncnn_checkpoint: ~/models/cider_dncnn_checkpoint.pth.tar

# DETECTION THRESHOLD. null = CALIBRATION PASS: score every image, block nothing,
# write the deltas. Their defender.py picks tau as a percentile of the delta
# distribution measured on CLEAN images at a conservative ratio, i.e. tau is a
# benign false-positive budget:
#     tau = numpy.percentile(clean_deltas, (1 - fpr_ratio) * 100)
# TUNING PATH: `cider_threshold_calibration` — run the benign text+image channels
# with threshold: null, then src/analysis/paper_c_cider_threshold.py emits tau for
# each fpr_ratio in the sweep. Never hand-pick this number.
threshold: null
fpr_ratio: 0.95        # tolerated benign false-positive rate used to read tau off the sweep

device: cuda
batch_size: 16
# One delta trace per upstream attack/channel (deltas depend only on the
# (text, image) pair), written to its own tree — never into the shared
# prompt_transform artifact dirs that concurrent cells read.
trace_dir: outputs/autoattack_defense/cider_deltas
