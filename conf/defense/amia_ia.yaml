# AMIA — Automatic Masking and Joint Intention Analysis.
# Zhang et al., Findings of EMNLP 2025 (arXiv 2505.24519). ESTABLISHED LITERATURE
# — a published third-party defense, not a proposal of ours.
# Implementation: src/defense/amia_ia.py
# Reference impl: NONE — the authors' repo alphadl/SafeVLM_with_AMIA is still an
# empty 3 KB placeholder (re-checked 2026-08-05), so this is from-paper.
#
# THE INTENTION-ANALYSIS INSTRUCTION IS THE PAPER'S, VERBATIM — recovered
# 2026-08-05 from the arXiv source's Figure 3 (images/ia_prompt.pdf is vector
# text, extractable from the PDF content stream; the old note that it was "not
# transcribable" was never checked). It is hardcoded in the defender, not
# configurable, because editing it silently would make this a different defense.
# The earlier hand-written reconstruction primed the model for "encoded,
# obfuscated" content and told it to "decode or reconstruct" — i.e. it handed the
# defense the decode step this repo's thesis is about, and it emitted Title-Case
# tags the parser then missed on every row. Any AMIA number collected before
# 2026-08-05 is void.
#
# type_name stays `amia_ia` for continuity with existing presets; BOTH of AMIA's
# components are implemented as of 2026-08-05.

# ⛔ MASKING IS CURRENTLY BLOCKED ON THE CLUSTERS (measured 2026-08-05, AICR).
# `masking: true` below is the CORRECT setting and the code is complete, but it
# cannot run against the installed transformers. VisRAG-Ret is a trust_remote_code
# model whose vendored MiniCPM sources are frozen at their 2024 revision, and this
# repo resolves transformers to 5.13.1 (pin `>=4.51,<6`). Four incompatibilities
# surfaced in sequence; three are fixed in src/defense/amia_ia.py, the fourth is not:
#   1. FIXED  `is_torch_fx_available` deleted from transformers.utils.import_utils
#             -> _shim_transformers_for_visrag()
#   2. FIXED  transformers 5 injects a synthetic rope_scaling whose key was renamed
#             `type` -> `rope_type`  -> _denormalize_rope_scaling()
#   3. FIXED  `_tied_weights_keys` renamed to `all_tied_weights_keys` (safe here:
#             the model declares NO tied weights and loads 0 missing keys)
#             -> _shim_tied_weights_keys()
#   4. OPEN   modeling_minicpmv.py::_convert_to_tensors does
#             `torch.tensor(input_ids, dtype=torch.int32)` and gets a `property`
#             object -> TypeError. This is tokenizer SEMANTICS under transformers 5,
#             not an API rename, so it cannot be shimmed without porting openbmb's
#             tokenizer logic — which would put a hand-modified third-party baseline
#             into the paper. Deliberately NOT attempted.
#
# We cannot pin transformers back: CIDER's encoder path targets the >=4.52 LLaVA
# layout, so the two defenses would need incompatible pins in one environment.
#
# THE ROUTE OUT (filed in TODO.md, not built): masking depends ONLY on (image, text)
# — exactly like CIDER's deltas — so it can be PRECOMPUTED in an isolated venv
# holding transformers ~4.44, writing masked images once per channel for AMIA to
# consume. That keeps the published method intact instead of patching it.
#
# UNTIL THEN, if AMIA must appear in a table, it runs with `masking: false` and the
# label is "AMIA (IA-only)" in EVERY row, figure and sentence — see the note below;
# the IA path needs no VisRAG and works today.
#
# ---- Automatic masking (paper §3.1) ----
# true  = the FULL published method. Uses the verbatim Figure-3 prompt, which
#         states the image "has been partially masked" — true only in this mode.
# false = the IA-ONLY ABLATION. Permitted, but the authors' own ablation says it
#         is insufficient ("Ablation confirms both masking and intention analysis
#         are essential"), so every table row / figure / sentence reporting it
#         MUST read "AMIA (IA-only)", never "AMIA".
masking: true

# VisRAG-Ret, the encoder the paper names (following Wang et al. 2025). Loaded
# lazily on the GPU node; ~3B, so it costs a model slot on the defense side.
mask_encoder: openbmb/VisRAG-Ret

# Paper §4.1: "For simplicity and reproducibility, we set N=16 and K=3 for all
# models and settings." N must be a perfect square — the sensitivity study sweeps
# sqrt(N)=2,3,4,5,6 with K=1,2,3,5,7 to hold the masking ratio roughly fixed
# (Appendix). NOT free knobs: these are the published defaults, and changing them
# makes the run a variant rather than AMIA. If they are ever swept, that sweep is
# the tuning path and its results belong beside the number.
n_patches: 16
k_mask: 3

device: cuda

# VALIDATION TARGET before trusting any AMIA number we report: AMIA's Table 1
# gives DSR on FigStep, which is in our own attack suite — 98.8 (Llava-1.5-7B),
# 99.0 (Llava-1.5-13B), 100.0 (Qwen2-VL-7B-Instruct). A faithful reimplementation
# should land near those; a large shortfall indicts this module, not AMIA.
