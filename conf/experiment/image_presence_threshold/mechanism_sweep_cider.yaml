# Paper B (AS-2) · MECHANISM SWEEP — the CIDER arm (a SECOND image-inspecting defense).
#
# ⏸ STAGED, NOT RUN. And BLOCKED until calibration: conf/defense/cider.yaml still
# has `threshold: null`, which is the calibration mode (score everything, block
# nothing). Run cider_calib_stage1_benign.yaml -> cider_calib_stage2.yaml ->
# paper_c_cider_threshold.py, write the resulting tau into conf/defense/cider.yaml,
# and only then submit this. Submitting with a null threshold would produce cells
# that look like a defense but block nothing, i.e. silent duplicates of no_defense.
#
# WHY THIS EXISTS — it closes the design hole mechanism_sweep.yaml declared. That
# sweep tested H1 (caption-mediated defenses branch on `has_image`) against H2
# (intrinsic image-side safety in the target) by varying how much of the input a
# defense touches. Its verdict was H1 refuted / H2 supported, but the LADDER had
# only ONE image-inspecting defense in it — `ecso` — so the entire H1-positive
# side of the comparison rested on a single implementation. One defense cannot
# distinguish "image-inspecting defenses behave this way" from "ECSO behaves this
# way". CIDER is the second, and it is a good second precisely because it is
# nothing like ECSO: ECSO captions the image with the target model and reasons
# over the caption; CIDER never asks a language model anything, it denoises the
# image and measures a cross-modal cosine shift. Agreement between two mechanisms
# that different is evidence about the CLASS; disagreement localises the effect.
#
# CIDER IS A GATE, not a transform: it blocks (canned refusal) or passes the
# ORIGINAL prompt through untouched. So on the TEXT arm it is INAPPLICABLE by
# construction — there is no image to denoise, every prompt passes, and the cell
# should reproduce no_defense-text. Those text cells are included anyway, for two
# reasons: the paired text-vs-decoy McNemar contrast needs both arms measured in
# the same run, and the text arm doubles as a free correctness check (a CIDER-text
# cell that does NOT match its no_defense-text twin means the gate is firing where
# it cannot see anything, which would indict the implementation).
#
# PRE-REGISTERED PREDICTION (recorded BEFORE the run, per conf/defense/cider.yaml):
# CIDER detects optimization-based pixel perturbations — denoising strips
# adversarial noise, and that is the whole signal. Our decoy is a clean photograph
# carrying no perturbation whatsoever, so its delta should look like any benign
# image's and CIDER should pass it at any tau with a tolerable benign FPR.
#   * CIDER shows NO amplification -> consistent with the mechanism sweep's H2
#     verdict AND with CIDER's own threat model; the image-inspecting CLASS does
#     not explain the effect, which strengthens the H1 refutation.
#   * CIDER DOES show amplification -> the more interesting result: a detector
#     calibrated for perturbations is nevertheless tripped by a content-free
#     decoy, which would say the decoy shifts cross-modal representation rather
#     than merely occupying the image slot. Report it as such.
#
# DECLARED WEAKNESS to carry into any sentence reporting these numbers: our
# denoiser is the authors' headline guided-diffusion path (7 checkpoints), which
# is correct — but see conf/defense/cider.yaml for the DnCNN fallback caveat if
# the 2GB checkpoint is ever unavailable on a box.
#
# n=100 throughout, matching every other cell in the paper (breadth at constant n,
# owner ruling 2026-08-05).
#
# COST: 20 cells x 100 prompts. Targets are cluster-served (free); spend is the
# gpt-5-mini judge only, ~$0.40. Under the standing $1 bar.
#
# num_main_job_threads: 1 IS LOAD-BEARING — a separate Defense instance is built
# per task, so each concurrent task loads its own llava-1.5-7b (~14GB) plus the
# diffusion UNet. See cider_calib_stage2.yaml for the full note.
num_main_job_threads: 1
num_cluster_jobs: 7          # 1 orchestrator + up to 6 vLLM servers

# The FIXED-encoder chains (AICR 285658 / 285677), same as every other AS-2 cell.
_ca_text:  &ca_text  outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_ca_decoy: &ca_decoy outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant
_sc_text:  &sc_text  outputs/image_presence_threshold/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/llm_semantic_camo
_sc_decoy: &sc_decoy outputs/image_presence_threshold/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/ir_constant

_b: &b
  mode: defense+evaluate
  benchmark: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_mechanism_sweep_cider
  defense: cider

tasks:
  # ---------------- code_attack: 5 targets x 2 arms (10) ----------------
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *ca_text}
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *ca_decoy}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *ca_text}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *ca_decoy}
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *ca_text}
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *ca_decoy}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_text}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_decoy}
  - {<<: *b, target_model: llama3_2_11b_vision,  source_transform_subdir: *ca_text}
  - {<<: *b, target_model: llama3_2_11b_vision,  source_transform_subdir: *ca_decoy}

  # ---------------- semantic_camo: 5 targets x 2 arms (10) ----------------
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *sc_text}
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *sc_decoy}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *sc_text}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *sc_decoy}
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *sc_text}
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *sc_decoy}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_text}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_decoy}
  - {<<: *b, target_model: llama3_2_11b_vision,  source_transform_subdir: *sc_text}
  - {<<: *b, target_model: llama3_2_11b_vision,  source_transform_subdir: *sc_decoy}
