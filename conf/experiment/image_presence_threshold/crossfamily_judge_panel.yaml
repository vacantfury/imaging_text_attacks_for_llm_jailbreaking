  - {<<: *b, responses_from: outputs/image_presence_threshold/defense+evaluate/jailbreakbench_benign/gemini-2.5-flash-lite_no_defense_non_llm_baseline_20260809_020119_96792166}
  - {<<: *b, responses_from: outputs/image_presence_threshold/defense+evaluate/jailbreakbench_benign/gemini-2.5-flash-lite_no_defense_non_llm_baseline_ir_blank_20260809_020119_88087653}

