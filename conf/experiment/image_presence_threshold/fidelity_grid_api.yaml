# Paper B (AS-2) · METHOD-FIDELITY RE-COLLECTION — the API (paid) half.
#
# ✅ AUTHORISED by the owner 2026-08-05 ("go the rest also") and submitted on AICR
# (cpu partition, keys injected by `op run`). Costs real money — a RE-run still
# needs a fresh go under the standing dollar gate (≲$1 runs freely, above = WAIT).
#
# WHY: `code_attack` was not the published method (audit §1.1 — `appendleft` over a
# reversed list double-reversed the deque, so decode() rebuilt the behaviour
# BACKWARDS). Fixed in `b266892`; encodings rebuilt on the fixed encoder in AICR
# 285658 and verified (plain `append`, words reversed, 100 prompts). This preset
# re-collects the deployable ECSO grid on those fresh encodings.
#
# WHAT IT REPLACES: the same grid measured by AICR 270179 on 2026-08-04. Those
# cells carry the paper's currently-surviving result — the abstract's "significant
# in every code-based attack cell we measure". After the oracle-leak correction
# that claim rests ENTIRELY on these code_attack cells (the only other significant
# cell is claude x formal_logic), so this run decides whether AS-2's primary
# result stands. Direction is UNKNOWN: the audit's guard-visibility argument was
# checked and does not hold (rendered prompts were word-order-identical to the
# reference either way), so nobody should pre-write "the effect shrinks".
#
# CLAUDE IS A PROBE, NOT A FULL ARM — deliberate, and it roughly halves the cost.
# claude x code_attack was already EXCLUDED from the amplification analysis:
# Anthropic's content filter returns empty responses for 82-93% of these prompts
# and the empty-safe judge scores them as refusals (paper.tex:337). Re-collecting
# all three claude cells would buy numbers that get excluded again. ONE cheap
# text-arm cell tells us whether the filter still fires under the fixed encoding:
#   * still fires  -> keep the documented exclusion, spend nothing more;
#   * no longer fires -> add the two remaining claude cells in a follow-up.
#
# COST: 10 cells x 100 prompts. ECSO issues ~3 target calls per prompt
# (recover/decode, self-check, answer). The three non-claude targets are cheap;
# the single claude cell dominates. Estimate ~$2-5 total, from the previous
# round's ~$0.90/cell average across a claude-heavy mix — a RANGE, not a quote.
# Judge is gpt-5-mini throughout (~$0.02/cell).
#
# NOTE ON THE TEXT ARM: ECSO short-circuits on text input (returns INITIAL
# unchanged), so an ECSO-text cell IS the no-defense text baseline. That is the
# paper's text-vs-decoy contrast, and it is why no separate no_defense-text cell
# appears here.

num_main_job_threads: 8

# Built by AICR 285658 on the FIXED encoder. Both arms share one encoding, which
# is what the paired contrast requires.
_text: &text outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_decoy: &decoy outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant

_ecso: &ecso
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read

tasks:
  # ---- ECSO text baseline (= no-defense text, via short-circuit) ----
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *text, <<: *ecso, target_model: gemini-2.5-flash,      judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *text, <<: *ecso, target_model: gemini-2.5-flash-lite, judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *text, <<: *ecso, target_model: gpt-4o-mini,           judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}

  # ---- ECSO + decoy (deployable arm) ----
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, <<: *ecso, target_model: gemini-2.5-flash,      judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, <<: *ecso, target_model: gemini-2.5-flash-lite, judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, <<: *ecso, target_model: gpt-4o-mini,           judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}

  # ---- no_defense + decoy (decoy-alone control) ----
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, defense: no_defense, target_model: gemini-2.5-flash,      judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, defense: no_defense, target_model: gemini-2.5-flash-lite, judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *decoy, defense: no_defense, target_model: gpt-4o-mini,           judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid}

  # ---- claude: ONE probe cell (empty-response check), cheapest arm ----
  - {mode: defense+evaluate, benchmark: harmbench, source_transform_subdir: *text, <<: *ecso, target_model: claude-sonnet-4-6, judge_model: gpt-5-mini, campaign: paper_b_fidelity_regrid_claude_probe}
