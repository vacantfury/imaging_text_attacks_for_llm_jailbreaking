# Paper B (AS-2) · METHOD-FIDELITY RE-COLLECTION — the SAGE + no-defense-text half.
#
# WHY THIS EXISTS: the first two re-collection presets covered ECSO and the
# decoy-alone control. The paper's grid is 5 models x 2 attacks x **3 defenses**
# (no_defense, SAGE, ECSO). SAGE was never re-collected on the fixed `code_attack`
# encoder — a survey of every SAGE cell in the repo found code_attack SAGE cells
# only for OPEN-WEIGHT targets (gemma2, llama3.1, llama-3.3-70b, internvl3,
# pixtral, qwen), all quarantined, all text-arm. There is no SAGE x code_attack
# cell for AS-2's frontier targets on the fixed encoding at all. This closes that.
#
# SECOND GAP CLOSED: `no_defense` on the TEXT arm. The earlier grid inferred it
# from ECSO's text short-circuit (`if not is_multimodal: return initial`), which
# the paper also relies on. But the camo grid MEASURED both and found gaps of
# 1.0-4.0pp between ecso-text and no_defense-text where the short-circuit predicts
# 0.0. That is small but it is not nothing, so the baseline column is measured
# here rather than inferred.
#
# NO ORACLE KNOB FOR SAGE — deliberate, not an omission. SAGE builds its wrapper
# from the prompt's own text side via `build_conversation_message` (src/defense/
# sage.py::query); it never reads the unencoded request, so the oracle leak that
# forced `query_source: encoded` on ECSO cannot arise here. Adding the key would
# be silently ignored.
#
# CLAUDE IS EXCLUDED, consistently with the rest of the re-collection: the text-arm
# probe in AICR 285740 returned 55/100 empty responses (ASR 2.02 on 99 evaluated),
# confirming Anthropic's filter still saturates code-completion prompts under the
# fixed encoder. SAGE cells there would be excluded from the analysis on arrival.
#
# GEMINI-2.0-FLASH IS STILL MISSING and cannot be added here — absent from the
# pinned llm_utils v5.0.0 registry although Google still serves it (TODO item 2).
# So this preset, like the others, covers 3 of the paper's 5 frontier targets.
#
# COST: 9 cells x 100 prompts. SAGE is ONE target call per prompt (a single
# wrapped query) and no_defense is one call, so this is roughly a third of the
# per-prompt target cost of the ECSO grid, which ran ~$2-5 for 10 cells at ~3
# calls each. Estimate ~$0.5-1.5 target + ~$0.18 judge (gpt-5-mini). A RANGE,
# not a quote.

num_main_job_threads: 6

# Same fixed encoding every other re-collection cell consumed (AICR 285658).
_text:  &text  outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_decoy: &decoy outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant

_base: &base
  mode: defense+evaluate
  benchmark: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_fidelity_regrid_sage

tasks:
  # ---- SAGE, text arm ----
  - {<<: *base, defense: sage, target_model: gemini-2.5-flash,      source_transform_subdir: *text}
  - {<<: *base, defense: sage, target_model: gemini-2.5-flash-lite, source_transform_subdir: *text}
  - {<<: *base, defense: sage, target_model: gpt-4o-mini,           source_transform_subdir: *text}

  # ---- SAGE + decoy ----
  - {<<: *base, defense: sage, target_model: gemini-2.5-flash,      source_transform_subdir: *decoy}
  - {<<: *base, defense: sage, target_model: gemini-2.5-flash-lite, source_transform_subdir: *decoy}
  - {<<: *base, defense: sage, target_model: gpt-4o-mini,           source_transform_subdir: *decoy}

  # ---- no_defense, TEXT arm (measured baseline, not inferred) ----
  - {<<: *base, defense: no_defense, target_model: gemini-2.5-flash,      source_transform_subdir: *text}
  - {<<: *base, defense: no_defense, target_model: gemini-2.5-flash-lite, source_transform_subdir: *text}
  - {<<: *base, defense: no_defense, target_model: gpt-4o-mini,           source_transform_subdir: *text}
