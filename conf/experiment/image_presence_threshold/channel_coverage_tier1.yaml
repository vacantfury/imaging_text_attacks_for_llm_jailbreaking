# Paper B (AS-2) · CHANNEL COVERAGE — TIER 1. The decisive test.
#
# THE CLAIM UNDER TEST. A SEMANTICALLY REDUNDANT image breaks a text-transform
# defense. In the existing corpus, SAGE — which rewrites only the TEXT and passes
# the image through untouched — holds the formal_logic text attack on gpt-4o-mini
# to 7% ASR; attach an image rendering THE SAME payload the text already carries
# and it jumps to 43% (+36pp, p=2.8e-10). The model gained no information: the
# payload was fully present in the text in both arms. Two further cells behave the
# same way (set_theory: gemini-2.5-flash-lite +26pp, gpt-4o-mini +15pp), and under
# `no_defense` the identical image is INERT (8 cells, 6 ns, 2 slightly negative) —
# so this is not the image being a better attack channel. It only matters once a
# defense is present.
#
# THE MECHANISM THIS TESTS: CHANNEL COVERAGE. If SAGE fails because it sanitizes
# one channel and leaves the other carrying the original payload, then a defense
# that DOES inspect the image should not fail the same way. ECSO captions the image
# with the target model and reasons over the caption, so the image is inside its
# coverage. Prediction, recorded BEFORE the run:
#
#   * ECSO text ~ ECSO both (no jump), while SAGE text << SAGE both (jump)
#       -> channel coverage confirmed. The defense's failure is structural and
#          predictable from which surfaces it reads. This is the paper.
#   * ECSO ALSO jumps
#       -> coverage is the wrong explanation; something else (e.g. the image
#          perturbing the target's own compliance) drives it. The story dies here,
#          for ~$2, which is the point of running this first.
#   * Neither jumps in this run
#       -> the 2026-08-03 SAGE result did not reproduce. Given the measured
#          non-determinism below, that is a live possibility and must be reported,
#          not retried until it appears.
#
# WHY SAGE IS RE-RUN HERE RATHER THAN REUSED. AS-2's own re-collection established
# that these targets are NOT deterministic at temperature 0 — 46-99% of responses
# differ between two identical calls on 5 of 6 checked cells. Comparing fresh ECSO
# cells against the 2026-08-03 SAGE cells would therefore confound the defense
# contrast with run-to-run drift. Both defenses run in THIS job, on the same
# prompts, in the same window, so the ECSO-vs-SAGE comparison is internal.
#
# THE TWO ARMS ARE BYTE-IDENTICAL IN PAYLOAD. Both descend from the SAME May-2026
# formal_logic encoding: the text arm is that encoding's own step, the "both" arm
# is the `ir_plain` render chained off it (which KEEPS `encoded` on the text channel
# AND renders it). So the only difference between arms is the presence of a
# redundant image, and the pairing is per prompt id — a McNemar contrast is valid.
# This is NOT the image-only arm (adaptive attack C, `keep_text: false`), which
# vacates the text channel and is a different condition entirely.
#
# SCOPE, deliberately narrow. ONE encoding (formal_logic — it carries the strongest
# effect, +36pp) x 3 frontier targets x 2 defenses x 2 arms = 12 cells. set_theory
# is Tier 1b and only worth buying if this survives. claude-sonnet-4-6 is EXCLUDED
# on the documented grounds already in the matrix: its API content filter returns
# 55/100 empty responses on the text arm, so its cells measure the filter, not the
# defense.
#
# COST: 12 cells x 100 prompts on API targets; ECSO issues up to 2 target calls per
# prompt, plus the gpt-5-mini judge. Estimated ~$2. An ESTIMATE, not a quote — and
# above the standing $1 auto-run bar, so this preset was owner-approved before
# submission.
#
# SUBMIT (AICR — both source dirs verified present there 2026-08-06):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/channel_coverage_tier1'

num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# TEXT arm: the May-2026 formal_logic encoding itself (payload in text, NO image).
_fl_text: &fl_text backup_files/arr_may_submission_files/outputs/prompt_transform/harmbench/formal_logic_ir_plain_20260525_010219_56487445/llm_formal_logic
# BOTH arm: the ir_plain render chained off that same encoding — payload in text
# AND rendered into the image. Redundant by construction.
_fl_both: &fl_both outputs/image_presence_threshold/prompt_transform/harmbench/llm_formal_logic_ir_plain_20260803_031315_97481103/ir_plain

_b: &b
  mode: defense+evaluate
  benchmark: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_channel_coverage

_ecso: &ecso
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read

tasks:
  # ---- ECSO (image IS inside its coverage): should NOT jump ----
  - {<<: [*b, *ecso], target_model: gpt-4o-mini,            source_transform_subdir: *fl_text}
  - {<<: [*b, *ecso], target_model: gpt-4o-mini,            source_transform_subdir: *fl_both}
  - {<<: [*b, *ecso], target_model: gemini-2.5-flash-lite,  source_transform_subdir: *fl_text}
  - {<<: [*b, *ecso], target_model: gemini-2.5-flash-lite,  source_transform_subdir: *fl_both}
  - {<<: [*b, *ecso], target_model: gemini-2.5-flash,       source_transform_subdir: *fl_text}
  - {<<: [*b, *ecso], target_model: gemini-2.5-flash,       source_transform_subdir: *fl_both}

  # ---- SAGE (text-only transform; image UNCOVERED): expected to jump ----
  - {<<: *b, defense: sage, target_model: gpt-4o-mini,           source_transform_subdir: *fl_text}
  - {<<: *b, defense: sage, target_model: gpt-4o-mini,           source_transform_subdir: *fl_both}
  - {<<: *b, defense: sage, target_model: gemini-2.5-flash-lite, source_transform_subdir: *fl_text}
  - {<<: *b, defense: sage, target_model: gemini-2.5-flash-lite, source_transform_subdir: *fl_both}
  - {<<: *b, defense: sage, target_model: gemini-2.5-flash,      source_transform_subdir: *fl_text}
  - {<<: *b, defense: sage, target_model: gemini-2.5-flash,      source_transform_subdir: *fl_both}
