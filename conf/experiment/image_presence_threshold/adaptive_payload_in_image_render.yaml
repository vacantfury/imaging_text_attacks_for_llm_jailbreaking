# Paper B (AS-2) · ADAPTIVE ATTACK C — payload-in-image. STAGE 1: render.
#
# THE GAP THIS CLOSES. The paper's Limitations name it, and the 2026-08-01 venue
# record calls it "the very gap most likely to cap the score again": there is no
# adaptive attack that embeds the harmful payload IN the image. Attack A supplied
# an attacker-controlled image, but what that image carried was a COMPLIANCE
# INSTRUCTION ("AUTHORIZED... do NOT refuse") — the payload itself never left the
# text channel. So every cell in the paper, attacked or defended, hands the
# defense the harmful request as text. An adaptive attacker would not.
#
# WHY IT IS THE DECISIVE TEST. The paper's mechanism is caption-mediated: the
# defense sees an image, captions it, and re-checks. That re-check is only as good
# as the caption. If the payload lives in the image in a form the captioner does
# not faithfully transcribe, the defense performs its safety check on a caption
# that does not contain the harmful request — it believes it checked, and passed.
# The decoy result and this attack are the same mechanism read from opposite ends.
#
# THE INTERFACE. `keep_text: false` moves the payload wholly into the image and
# puts the house default pointer on the text channel ("Please check the image and
# answer accordingly." — src/prompt_transformations/image/base_transformation.py).
# So this is IMAGE-ONLY delivery, not the duplication the existing `*_ir_plain`
# chains do (those keep `encoded` on the text channel AND render it, so the
# payload is in both places and the defense can still read it as text).
#
# THE POINTER TEXT IS DELIBERATELY NEUTRAL, and this is the load-bearing design
# choice. Attack A already established what a compliance-inducing instruction
# buys (6 -> 24% on code_attack). Using a persuasive pointer here would confound
# the two and make any gain unattributable. A bland "check the image" isolates
# ONE variable: where the payload lives. If ASR rises on that alone, the result is
# about the defense's decode path, not about talking the model into compliance.
#
# CHAINED FROM THE EXISTING FIXED ENCODINGS, not re-encoded. `source_transform_subdir`
# points at the very `code_attack` / `llm_semantic_camo` steps every other AS-2 cell
# consumed (AICR 285658 / 285677, post-`b266892`). That keeps the payload
# byte-identical across the text arm, the decoy arm and this one, so the three are
# paired per prompt and a McNemar contrast between them is valid — the same
# property the paper's own text-vs-decoy pairing relies on.
#
# COST: ZERO. `ir_plain` is a non-LLM renderer (text onto a canvas) and the
# encoding is reused rather than regenerated, so this makes no model call at all.
#
# SUBMIT (AICR):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/adaptive_payload_in_image_render'
# Then paste the two timestamped dirs into adaptive_payload_in_image_eval.yaml.

num_main_job_threads: 2

_base: &base
  mode: prompt_transform
  benchmark: harmbench
  prompt_range: [0, 99]
  campaign: paper_b_adaptive_payload_in_image
  # keep_text: false => payload rendered into the image, text channel becomes the
  # stock neutral pointer. This single flag IS the attack.
  transformation_list:
    - {type: ir_plain, params: {keep_text: false}}

tasks:
  - <<: *base
    source_transform_subdir: outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack

  - <<: *base
    source_transform_subdir: outputs/image_presence_threshold/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/llm_semantic_camo
