# Paper B (AS-2) · IMAGE-PROPERTY ABLATION — STAGE 2: does presence survive
# varying the image's properties, and how much does magnitude move?
#
# Answers cspaper review-1 Con 2 / Q3. The paper's title claims image presence is
# the uncontrolled variable; the reviewer's charge is that we only showed "a few
# fixed images move the threshold" and never separated presence from image-level
# properties (resolution, aspect ratio, colour, OCR-ability, file encoding). The
# current draft answers by SOFTENING the wording. This round answers with data.
#
# READ-OUT, RECORDED BEFORE THE RUN (so the result cannot be narrated after):
#   * every arm inflates, magnitudes cluster
#       -> presence is the operative factor; the claim is EARNED and the title
#          stands as written.
#   * every arm inflates, magnitudes spread widely
#       -> presence is sufficient to trigger but image properties set the price.
#          That is a BETTER paper, not a worse one: an uncontrolled variable
#          whose magnitude swings on incidental encoding choices is a stronger
#          form of "mispriced" than a clean constant would be. Report the spread
#          as the result and name which property carries it.
#   * some arms are null
#       -> presence is NOT sufficient; the claim narrows to whatever the
#          non-null arms share. Rewrite the thesis sentence, do not soften it.
#
# THE KEY PAIR IS #5 vs #10 — `blank 1024x141` against `mountain` (also
# 1024x141, a caption rendered as an image). Matched dimensions, one OCR-able and
# one not. This is the paper's ONLY clean OCR-ability contrast at matched size,
# and it became necessary on 2026-08-07: the published presence control's second
# class turned out to be the rabbit, not the mountain (silently-dropped
# `image_path`, see the matrix defect note), so BOTH published presence arms
# carry no readable text and the OCR axis is currently untested at matched size.
#
# SECOND PAIR: `mountain` vs `mountain +jpeg40` — identical visual content,
# different encoding, and a degraded caption is measurably harder to OCR. If the
# OCR path mattered, this is where it shows.
#
# ⚠️ ARM IDENTITY IS IN THE CONFIG, NEVER THE PATH. Seven arms below end in a
# step called `ir_blank` and three in `ir_constant`, so the dirs differ only by
# timestamp+rand. Reading the arm from the last path component — the substring
# bug that has bitten three times in this paper — collapses them. Analysis MUST
# read `results_history[*].<leaf>.config` (width/height/bg_color/image_path/
# jpeg_quality). The anchor names below are a convenience for humans; the config
# is the truth.
#
# ALL ARMS IN ONE JOB, ONE CANONICAL TEXT. Every render chains off the SAME
# `non_llm_baseline` step the ladder and presence controls use, so the text
# channel is byte-identical and arms are paired per prompt id. These targets are
# NOT deterministic at temperature 0, so do not compare these cells against the
# ladder's or the presence controls' cells — every contrast here is internal.
#
# JUDGE PINNED TO MATCH THE LADDER — `jbb_refusal` + `gpt-5-mini` on every cell,
# same instrument as the rung-2 numbers these extend.
#
# MODEL COVERAGE IS DELIBERATELY UNEVEN. Three models take all 11 arms; claude
# takes 4. claude shows the largest effect (+54pp) but costs ~$2.20 per cell
# against $0.01-0.29 for the others, so its full row would have cost more than
# the rest of the round combined. Buying its 4 load-bearing arms (text, the
# reference canvas, and the matched-size OCR pair) preserves the key contrast on
# the strongest model while spending the budget on BETWEEN-IMAGE variance, which
# is what the reviewer actually asked to see.
#
# COST: 37 cells x 100 prompts, one target call each (no defense) + gpt-5-mini
# refusal judge. From the paper's own measured per-query no_def rates
# (App. Table tab:cost): flash-lite $0.10, gpt-4o-mini $2.04, flash $3.17,
# claude $8.78 => ~$14 target, ~$3.7 judge, ~$18 total. An ESTIMATE, not a quote.
# Owner-approved 2026-08-07 ("as you recommend", at the ~$17 tier).
#
# SUBMIT (AICR):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/image_property_ablation_stage2'

num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

