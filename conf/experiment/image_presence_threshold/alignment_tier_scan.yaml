# Paper B (AS-2) · ALIGNMENT-TIER SCAN: does the benign-refusal inflation scale
# with how heavily the checkpoint was safety-aligned?
#
# WHY THIS IS A TEST AND NOT A FISHING TRIP. The paper's biggest remaining gap is
# that it has no MECHANISM: every model showing the effect is a black-box hosted
# API, and every open-weight model we could actually inspect came back null
# (-1, +7, -2pp, none significant). So the effect has been unopenable in
# principle, not just in practice.
#
# The same-weights arm changed that. `gemma-3-12b-it` shows +7pp (p=0.039) and we
# serve it ourselves — the first checkpoint that both exhibits the effect and is
# ours to look inside. But +7pp sits right on top of the open-weight nulls (one
# of which was ALSO +7pp, merely n.s.), so promoting gemma to "the probe target"
# on that basis would be reading noise. This round asks the question properly.
#
# THE HYPOTHESIS. If the benign tax is carried by post-training alignment — which
# is what the same-weights result implies, since the serving layer was inert —
# then effect size should track alignment strength ACROSS open checkpoints. The
# registry already labels each row with an `alignment_tier`, assigned before and
# independently of any of these measurements, so the prediction is pre-committed:
#
#   strong  llama-3.2-11b-vision      -> LARGEST shift predicted
#   mid     qwen3-vl-8b, gemma-3-12b, qwen2.5-vl-7b, internvl3-8b
#   weak    pixtral-12b               -> SMALLEST (or reversed) predicted
#
# READ-OUT, RECORDED BEFORE THE RUN:
#   * shift tracks the tier ordering
#       -> alignment strength is the carrier. That is a mechanism-level finding
#          on its own AND it names the probe target (the strong-tier model), so
#          the paper stops being purely black-box.
#   * one model shows a LARGE shift, ordering otherwise messy
#       -> tier is not the variable, but we still gain an inspectable model with
#          a real effect. Report the ordering as null and take the probe target.
#   * all open checkpoints stay near-null (incl. llama-3.2-vision)
#       -> the effect may be specific to heavily-aligned PROPRIETARY checkpoints.
#          That NARROWS the paper's claim and is worth reporting as such; it also
#          means no internals probe is available and the mechanism gap is
#          structural, not a matter of effort. Do not spin this as inconclusive.
#
# ⚠️ THE TIER LABELS ARE COARSE AND NOT OURS TO TRUST BLINDLY. `alignment_tier`
# is a hand-assigned label in the llm_utils registry, not a measured quantity.
# It is usable here precisely because it was set for other purposes long before
# this question existed, but a clean ordering across SIX models with three tier
# levels is weak evidence on its own — treat a positive result as a lead to
# confirm, not as a settled dose-response curve.
#
# ALL ARMS INTERNAL, ONE JOB, ONE CANONICAL TEXT. Both arms chain off the same
# `non_llm_baseline` step used by the serving-stack round, whose text channel was
# hash-verified identical to the published AICR arm. These targets are not
# deterministic, so every contrast is model-vs-itself WITHIN this job; do NOT
# compare a cell here against tab:ow_threshold's cells from the July window.
#
# JUDGE pinned to gpt-5-mini + jbb_refusal, matching every other benign-refusal
# number in the paper, so a model that scores well here is directly reportable
# without a rejudge round.
#
# COST: 12 cells x 100 prompts. Targets are all self-served on our own GPUs =
# FREE. Only the judge costs: ~1200 gpt-5-mini refusal calls, ~$1.2. An ESTIMATE.
#
# SUBMIT (xc — AICR was saturated at 12 jobs; xc has 8 idle A100s):
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch image_presence_threshold/alignment_tier_scan'

num_main_job_threads: 6
num_cluster_jobs: 7          # orchestrator + 6 vLLM servers (xc server budget = 6).

# Reused from xc job 204 (serving-stack stage 1a). Deterministic renders, so
# reuse is safe and keeps the text channel identical to the published arm:
#   text  n=100, no images
#   blank 1024x768 (renderer default = the published presence-control arm),
#         100 images, exactly 1 distinct hash
_text:  &text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260807_223202_80871327/non_llm_baseline
_blank: &blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260807_223202_80871327/ir_blank

_b: &b
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: jailbreakbench_benign
  judge_method: jbb_refusal
  judge_model: gpt-5-mini
  campaign: paper_b_alignment_tier_scan

tasks:
  # ---- STRONG tier: the hypothesis's headline prediction --------------------
  - {<<: *b, target_model: llama3_2_11b_vision, source_transform_subdir: *text}
  - {<<: *b, target_model: llama3_2_11b_vision, source_transform_subdir: *blank}

  # ---- MID tier ------------------------------------------------------------
  - {<<: *b, target_model: google/gemma-3-12b-it, source_transform_subdir: *text}
  - {<<: *b, target_model: google/gemma-3-12b-it, source_transform_subdir: *blank}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *text}
  - {<<: *b, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *blank}
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *text}
  - {<<: *b, target_model: qwen2_5_vl_7b,        source_transform_subdir: *blank}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *text}
  - {<<: *b, target_model: internvl3_8b,         source_transform_subdir: *blank}

  # ---- WEAK tier -----------------------------------------------------------
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *text}
  - {<<: *b, target_model: pixtral_12b,          source_transform_subdir: *blank}
