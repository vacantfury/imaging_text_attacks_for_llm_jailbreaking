# Paper B (AS-2) · JUDGE ROBUSTNESS — the SECOND judge on AS-2's own cells
#
# WHY. cspaper review 2 (con 6) objects that a held-constant judge handles
# SYSTEMATIC strictness but not DIFFERENTIAL error: attaching an image may change
# a response's style -- hedging, verbosity, disclaimers, partial compliance --
# and an LLM judge can label that differently without the model's refusal
# THRESHOLD having moved. A second judge scoring the SAME stored responses is the
# direct test: if the paired contrast survives, style-driven mislabeling is not
# what produces it.
#
# WHY gpt-5-nano SPECIFICALLY. It is the already-validated second judge
# (`judge_model_issue/JUDGE_MODEL_REPORT.md` section 6: kappa=0.62, "a valid
# same-standard sensitivity check"), it applies the SAME rubric so the contrast
# stays interpretable, and it is what Paper C already carries -- this run simply
# gives AS-2 the dual-judge treatment Paper C has had since its coverage grid
# moved nano -> mini. Verified 2026-08-08: all 1178 nano-judged cells in this repo
# are `autoattack_defense`/`paper_c_*`; AS-2 had ZERO. That gap is what this closes.
#
# STATED CAVEAT, to be written into the paper rather than glossed: nano and mini
# are both OpenAI, so this bounds differential error WITHIN a family and cannot
# exclude a blind spot both share. The independent human anchor is Round R
# (kappa=0.794 binary on benign refusal, blind, repetition-robust 0.847) -- but
# Round R labeled PAPER C's response population, not hosted models under
# attachment. Both limits get stated; neither is hidden.
#
# RUBRIC IS PINNED PER CELL, NOT INHERITED. `task.py` line 574 computes
# `judge_method_provenance = task.judge_method or benchmark` -- an unset method
# silently falls back to the BENCHMARK's canonical evaluator. For the OR-Bench
# rungs that would be wrong, because those cells live under a
# `jailbreakbench_benign/` directory (the dir takes the pinned RUBRIC's name, not
# the dataset's). Every task below therefore states its source cell's own
# `judge_method` explicitly. Cells are addressed by CAMPAIGN, never by directory.
#
# SCOPE: 88 cells carrying a non-null asr/refusal_rate, across the five
# AS-2 campaigns (sensitivity_ladder, presence_controls, image_property_ablation,
# threshold_shift_openweight, symmetry_test). The `paper_b_*` prefix is legacy and
# also covers AS-7 campaigns (ecso_*, channel_coverage, stacked_defense,
# adaptive_payload_in_image, fidelity_regrid*) -- those are EXCLUDED here.
#
# READ-OUT, RECORDED BEFORE THE RUN:
#   * paired contrasts hold their sign and significance under nano
#       -> differential judge error is not driving the finding. Report as a
#          robustness row per table. The fresh human audit stays a nice-to-have.
#   * absolute rates shift but contrasts hold
#       -> expected, and exactly the Paper-C pattern (nano inflates absolute ASR
#          2-3x while direction is judge-robust). Say so explicitly.
#   * any headline contrast FLIPS or loses significance
#       -> the finding is judge-dependent. A fresh human audit on AS-2's OWN
#          responses becomes REQUIRED, not optional, and the affected claim is
#          held out of the paper until it is done.
#
# COST: 88 cells x 100 prompts = ~8800 gpt-5-nano judge calls, input-
# dominated. ~$1. Zero target cost -- no model is re-queried, no GPU needed.
#
# SUBMIT (AICR — the cells live there; API-only, no GPU):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/judge_robustness_nano'

