# Paper B (AS-2) · TOPIC-STRATIFIED BENIGN COST — STAGE 2: evaluate.
#
# Consumes `topic_stratified_stage1`. The source dir is timestamped, so it cannot
# be predicted and MUST be pasted below before submitting.
#
# See the stage-1 header for why this round exists (a two-category slice carrying
# a five-site claim about medical/legal/security/harm-reduction traffic) and for
# the read-out recorded in advance.
#
# THE THREE TARGETS ARE THE THREE THE CLAIM IS MADE ON. claude-sonnet-4-6 (+51),
# gemini-2.5-flash-lite (+34) and gpt-4o-mini (+23) are exactly the models the
# abstract and conclusion quote. gemini-2.5-flash is EXCLUDED: it is the null
# model on this rung, so it would triple nothing -- a null staying null across ten
# categories is worth having but not worth a third of the round's budget. Note it
# as untested rather than implying it was checked.
#
# ⚠️ INSTRUMENT PINNED, exactly as in `sensitivity_ladder_stage2`. `benchmark`
# and `judge_method` are BOTH set explicitly. Left to auto-inference, an
# `orbench*`-derived path routes to the ORBench evaluator while the existing
# borderline cells were scored with the JailbreakBench-refusal classifier -- two
# different rubrics, which would confound this round with the instrument and make
# the comparison to the published numbers meaningless. The rungs differ in
# PROMPTS ONLY.
#
# BOTH ARMS IN THIS JOB, deliberately. These targets are NOT deterministic at
# temperature 0 (AS-2 measured 46-99% of responses differing between two
# identical calls on 5 of 6 checked cells). A fresh blank-canvas arm against a
# text baseline collected weeks earlier would confound the modality contrast with
# run drift. Same prompts, same window, same job -- the contrast is internal and
# the McNemar pairing is valid.
#
# VALIDITY GATE, checked before interpreting anything: the no-image arm's refusal
# rate must land near the published borderline-rung baselines (claude 12%,
# gpt-4o-mini 12%, flash-lite 11% on the original slice). A stratified baseline
# far off those is a signal that the strata differ in BASE sensitivity, which is
# itself reportable -- but it means the per-category deltas, not the aggregate,
# are the quantity to read.
#
# COST: 6 cells x 300 prompts = 1800 API target calls (one each, no defense) plus
# 1800 gpt-5-mini refusal-judge calls. Anchored on the measured figure for
# `sensitivity_ladder_stage2` (16 cells x 100 = 1600 calls, ~$4-5), with
# claude-sonnet-4-6 a larger share here (1/3 vs 1/4). Estimated ~$5-6. An
# ESTIMATE, not a quote. Above the standing $1 bar -- owner-approved 2026-08-08
# before submission.
#
# SUBMIT (AICR), after pasting the stage-1 dir below:
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/topic_stratified_stage2'

num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# ⚠️ PASTE THE STAGE-1 DIRS HERE. Verify before submitting: both arms must carry
# 300 rows, IDENTICAL text per prompt id, the text arm image_encoded=None, and
# the blank arm exactly ONE distinct image md5 across all 300 (that single md5 is
# what makes "zero per-prompt information" literally true).
_text:  &text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/PASTE_ME/non_llm_baseline
_blank: &blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/PASTE_ME/ir_blank

_b: &b
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 299]
  benchmark: jailbreakbench_benign   # pinned: hold the reporting path constant
  judge_method: jbb_refusal          # pinned: hold the INSTRUMENT constant
  judge_model: gpt-5-mini
  campaign: paper_b_topic_stratified

tasks:
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *blank}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *blank}
