# Paper B (AS-2) · E5 REALISTIC IMAGES — STAGE 2: evaluate.
#
# Consumes `realistic_images_stage1` (xc job 296). See that header for why this
# round exists (cspaper review 8 con 7 / Q4: no natural image appears anywhere
# in this paper), for the stimulus provenance, and for the READ-OUT recorded in
# advance. Do not restate the read-out here; it lives in one place so it cannot
# drift between the two files.
#
# ⚠️ ARM IDENTITY IS IN THE CONFIG, NEVER THE PATH. Three arms below end in a
# step called `ir_constant` and two in `ir_blank`; those dirs differ only by
# timestamp and rand. The anchors were generated by reading
# `results_history[*].<leaf>.config` from each dir — `image_path` for the
# `ir_constant` arms, `width`/`height`/`bg_color` for the `ir_blank` arms — and
# are NOT hand-assigned. Regenerate them the same way if they ever need
# rebuilding. Reading the arm from the last path component is the substring bug
# that has bitten this paper three times.
#
# TEXT ARM. Each stage-1 task ran the chain `[non_llm_baseline, ir_X]`, so all
# six emit their own `non_llm_baseline` leaf. `non_llm_baseline` is the identity
# encoder and is deterministic, so those six leaves are byte-identical; the
# validity gate below verifies that before one of them is used as arm 1. This is
# why the text arm can be taken from a single task without privileging it.
#
# VALIDITY GATES, all checked on the cluster BEFORE this stage is submitted.
# None of them is optional; each has cost this paper a wrong number at least
# once:
#   1. 300 rows in every arm and identical id sets  -> McNemar pairing is exact
#   2. text byte-identical across all six `non_llm_baseline` leaves
#      AND across every image arm's text field    -> `keep_text` held, so the
#      arms differ ONLY in the attached image
#   3. text arm carries 0 images
#   4. each image arm carries exactly 1 DISTINCT md5 across its 300 rows, and
#      that md5 EQUALS the committed stimulus's md5:
#         photo_512.png       23f4f7403a323f68d61fae90c5c603ff
#         photo_1536.png      e6ad0fc63c6ad1ec2f09a83368ee608e
#         photo_1536_q40.jpg  4889e8980835bb35958ba7851614ad6d
#         noise_512.png       4d74492a891a52357665c3b141478e21
#      (the blank arms are generated, not committed, so they are checked for
#      single-md5 and for dimensions only). Pinning to the committed md5 is what
#      makes "the image carries zero per-prompt information" a checked fact
#      rather than an assumption, and it is the check that catches a silently
#      re-rendered or mis-routed stimulus.
#
# ✅ THE MATCHED-TOKEN PREMISE IS VERIFIED, NOT ASSUMED (2026-08-22). Read back
# from the target's OWN processor (`AutoProcessor.from_pretrained`, patch=16,
# merge=2, i.e. 32 px per visual token), the stimuli tokenise to:
#     512x512   blank / photo / noise        ->  256 visual tokens each
#     1536x1536 blank / photo / photo-q40    -> 2304 visual tokens each
# So every photo-vs-blank contrast in this round holds visual token count EXACTLY
# constant while varying content from a 1-colour uniform fill to a 45k-colour
# natural photograph. That is what makes it a test of the carrier claim rather
# than one more robustness arm, and it is checked rather than inferred because
# the whole round's meaning depends on it. (This is the same readback the paper
# names as the precondition for a cross-route comparison; the method is now
# demonstrated to work.)
#
# ⚠️ INSTRUMENT PINNED. `benchmark` and `judge_method` are BOTH set explicitly.
# Left to auto-inference, an `orbench*`-derived path routes to the ORBench
# evaluator while every published benign-refusal cell in this paper was scored
# with the JailbreakBench-refusal classifier — two different rubrics, which
# would confound this round with the instrument. The rungs differ in IMAGES ONLY.
#
# JUDGE COST, the only spend in this round. Targets are cluster-served, so they
# are free; 7 cells x 300 prompts = 2100 gpt-5-mini refusal judgments. Anchored
# on this repo's own measured figure (conf/evaluation/default.yaml records ~$0.07
# real cost per 100 judgments), that is ~$1.5. An ESTIMATE from a measured
# anchor, not a quote. `use_batch_api` stays FALSE at its default — see that same
# file for why routing judging through a provider batch API stranded four cells
# at `status=partial_judge` on 2026-08-07.
#
# SUBMIT (xc), after pasting the stage-1 dirs below:
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch image_presence_threshold/realistic_images_stage2'

num_main_job_threads: 4
num_cluster_jobs: 2          # orchestrator + 1 vLLM server (one target).

# ---- RESOLVED FROM CONFIG, NOT FROM PATHS (see header) --------------------
_text:    &text    outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260822_060457_12503843/non_llm_baseline
_b512:    &b512    outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260822_060457_42069018/ir_blank
_p512:    &p512    outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260822_060457_88827375/ir_constant
_n512:    &n512    outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260822_060457_34476345/ir_constant
_b1536:   &b1536   outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260822_060457_12503843/ir_blank
_p1536:   &p1536   outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260822_060500_89894438/ir_constant
_p1536q:  &p1536q  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260822_060513_54837628/ir_constant

_b: &b
  mode: defense+evaluate
  defense: no_defense
  target_model: qwen3_vl_8b_instruct
  prompt_range: [0, 299]
  benchmark: jailbreakbench_benign   # pinned: hold the reporting path constant
  judge_method: jbb_refusal          # pinned: hold the INSTRUMENT constant
  judge_model: gpt-5-mini
  campaign: paper_b_realistic_images

tasks:
  - {<<: *b, source_transform_subdir: *text}      # 1  no image
  - {<<: *b, source_transform_subdir: *b512}      # 2  blank  512   (256 vis tok)
  - {<<: *b, source_transform_subdir: *p512}      # 3  photo  512   MATCHED to 2
  - {<<: *b, source_transform_subdir: *n512}      # 4  noise  512   MATCHED to 2
  - {<<: *b, source_transform_subdir: *b1536}     # 5  blank  1536  (2304 vis tok)
  - {<<: *b, source_transform_subdir: *p1536}     # 6  photo  1536  MATCHED to 5
  - {<<: *b, source_transform_subdir: *p1536q}    # 7  photo  1536 q40, MATCHED to 6
