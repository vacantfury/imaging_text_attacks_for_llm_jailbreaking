# Paper B (AS-2) · SENSITIVITY LADDER — STAGE 2: evaluate.
#
# Consumes stage 1 (`sensitivity_ladder_stage1`). The two source dirs are
# timestamped, so they cannot be predicted and must be pasted below.
#
# WHAT THIS MEASURES. Benign refusal rate under {no image, blank canvas} on two
# new sensitivity rungs, so the ladder can be read against the rung already
# collected. The comparison target, from the verified 2026-08-06 grid
# (jbb_benign, no_defense, text -> blank canvas):
#
#     gemini-2.0-flash        22 -> 62   (+40)     [deprecated, not re-run here]
#     gemini-2.5-flash-lite   11 -> 45   (+34)
#     claude-sonnet-4-6        3 -> 36   (+33)
#     gpt-4o-mini              4 -> 19   (+15)
#     gemini-2.5-flash        11 -> 18   ( +7)
#
# ONE JUDGE ACROSS ALL RUNGS — the load-bearing design choice. `judge_method` is
# pinned to `jbb_refusal` on every cell. Left to auto-inference, an
# `orbench*`-derived path routes to the ORBench evaluator while the jbb rung uses
# the JailbreakBench-refusal classifier — two different rubrics, which would
# confound the ladder with the instrument and make the whole comparison
# meaningless. The rungs differ in PROMPTS ONLY. `benchmark` is likewise pinned
# so the refusal-rate reporting path is identical.
#
# gemini-2.0-flash IS EXCLUDED. Vendor-deprecated before this round (the same
# reason it is absent from the paper's detector-gated table). It carries the
# largest effect in the existing grid, which is unfortunate, but a dead endpoint
# cannot be re-run and substituting a different model silently would be worse.
#
# BOTH ARMS RUN IN THIS JOB, deliberately. AS-2's own re-collection established
# these targets are NOT deterministic at temperature 0 (46-99% of responses
# differ between two identical calls on 5 of 6 checked cells). Comparing a fresh
# blank-canvas arm against a text baseline collected weeks earlier would confound
# the modality contrast with run-to-run drift. Same prompts, same window, same
# job — so the contrast is internal and the McNemar pairing is valid.
#
# READ-OUT, recorded BEFORE the run (see stage 1 header for why each outcome is
# publishable): rung 1 inflation ~ rung 3 -> blanket caution; rung 1 << rung 3 ->
# threshold shift, and the tax lands on sensitivity-adjacent traffic; no rung 1-2
# inflation -> the headline narrows to topic-matched sets.
#
# VALIDITY GATE ON RUNG 1. If the rung-1 no-image baseline does not come back
# near 0% refusal, the neutral set is not neutral and rung 1 is void — report
# that rather than interpreting the contrast.
#
# COST: 16 cells x 100 prompts on API targets (one call each, no defense) plus
# the gpt-5-mini refusal judge. claude-sonnet-4-6 is the expensive quarter of it.
# Estimated ~$4-5 total. An ESTIMATE, not a quote — above the standing $1 bar,
# so this preset was owner-approved before submission.
#
# SUBMIT (AICR), after pasting the stage-1 dirs below:
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch image_presence_threshold/sensitivity_ladder_stage2'

num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# Stage 1 (AICR job 287521, COMPLETED 26s, exit 0:0) verified 2026-08-06:
#   * 100/100 IDENTICAL text between the two arms of each rung -> keep_text held,
#     so the arms differ ONLY in image presence and the pairing is exact.
#   * text arm carries image_encoded=None; blank arm carries one image per prompt.
#   * 100 images per rung with exactly 1 DISTINCT md5 -> every prompt gets the
#     byte-identical blank canvas, i.e. literally zero per-prompt information in
#     the image channel. This is the isolation the whole claim rests on.
_r1_text:  &r1_text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/non_llm_baseline
_r1_blank: &r1_blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/ir_blank
_r2_text:  &r2_text  outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline
_r2_blank: &r2_blank outputs/image_presence_threshold/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/ir_blank

_b: &b
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: jailbreakbench_benign   # pinned: hold the reporting path constant
  judge_method: jbb_refusal          # pinned: hold the INSTRUMENT constant across rungs
  judge_model: gpt-5-mini
  campaign: paper_b_sensitivity_ladder

tasks:
  # ================= RUNG 1 — neutral (AlpacaEval, filtered) =================
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r1_text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r1_blank}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r1_text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r1_blank}

  # ============ RUNG 2 — borderline-benign (OR-Bench hard) ============
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r2_text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *r2_blank}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r2_text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *r2_blank}
