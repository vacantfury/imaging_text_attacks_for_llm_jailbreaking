# ============================================================
# Stage 3: Evaluate — GPT-4o, all 3 encodings × 2 modalities
# ============================================================
# Usage: python main.py -e eval_gpt4o
#
# Run AFTER text_encode + imaging stages.
# Update source_dir paths to point to actual output directories.

tasks:
  # ---------- Text modality ----------
  - mode: evaluate
    model: gpt-4o
    encoding: plain
    modality: text
    source_dir: outputs/encode_plain_YYYYMMDD_HHMMSS

  - mode: evaluate
    model: gpt-4o
    encoding: math
    modality: text
    source_dir: outputs/encode_math_YYYYMMDD_HHMMSS

  - mode: evaluate
    model: gpt-4o
    encoding: classical_chinese
    modality: text
    source_dir: outputs/encode_classical_chinese_YYYYMMDD_HHMMSS

  # ---------- Image modality ----------
  - mode: evaluate
    model: gpt-4o
    encoding: plain
    modality: image
    source_dir: outputs/image_plain_YYYYMMDD_HHMMSS

  - mode: evaluate
    model: gpt-4o
    encoding: math
    modality: image
    source_dir: outputs/image_math_YYYYMMDD_HHMMSS

  - mode: evaluate
    model: gpt-4o
    encoding: classical_chinese
    modality: image
    source_dir: outputs/image_classical_chinese_YYYYMMDD_HHMMSS
