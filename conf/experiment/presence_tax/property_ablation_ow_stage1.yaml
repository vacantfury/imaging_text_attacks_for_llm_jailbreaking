# Paper B (AS-2) · IMAGE-PROPERTY ABLATION on an OPEN CHECKPOINT — STAGE 1
# (render regeneration on xc)
#
# WHY THIS PRESET EXISTS AT ALL. The 11-arm property sweep
# (image_property_ablation_stage1/2) was rendered and run on AICR, and its
# render dirs live there — `ls` on xc returns ZERO of the `20260807_0946*`
# dirs. xc is where the open-checkpoint row has to run (NURC is unwritable,
# AICR is holding the AS-3 held-out grid), so the renders must exist on xc.
#
# REGENERATING IS SAFE AND FREE, AND IT IS THE BETTER OPTION THAN COPYING.
# Every arm below is a NON-LLM renderer (`ir_blank` / `ir_constant`) driven by
# fixed params off a fixed text dir — no model call, no sampling, nothing
# nondeterministic. Regenerating therefore costs $0 and, unlike an rsync,
# leaves a checkable claim behind: after this runs, the xc image hashes are
# compared arm-by-arm against AICR's, which PROVES byte-identity rather than
# assuming a copy landed intact.
#
# THE TEXT CHANNEL IS NOT REGENERATED — IT IS REUSED.
# `non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline` already
# exists on xc (verified before writing this file) and is the SAME dir the
# hosted rows of the sweep chained off. Reusing it is what makes the open
# checkpoint's row slot into `tab:property` beside gpt-4o-mini and the two
# gemini rows instead of forming a separate island.
#
# ARM DEFINITIONS ARE COPIED VERBATIM from image_property_ablation_stage1.yaml
# — same order, same params, same comments where they carry a warning. Do not
# "clean them up": the param values ARE the experiment, and two of them
# (#9 jpeg_quality on the mountain, #2 as this sweep's own 512x512 reference
# rather than the published 1024x768 blank) encode corrections that were paid
# for once already.
#
# COST: $0. Ten non-LLM renders x 100 prompts, no target, no judge.
#
# SUBMIT (xc):
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch presence_tax/property_ablation_ow_stage1'

num_main_job_threads: 4

# Reused, NOT regenerated — the sweep's canonical text channel, already on xc.
_source: &src outputs/presence_tax/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline

_base: &base
  mode: prompt_transform
  source_transform_subdir: *src
  benchmark: jailbreakbench_benign
  prompt_range: [0, 99]
  campaign: paper_b_property_ablation_ow

tasks:
  # --- 2. reference canvas for THIS sweep -------------------------------
  #     ⚠️ NOT the published presence-control blank. The published arm passed
  #     only `keep_text`, so it rendered at BlankImageRenderer's DEFAULTS —
  #     1024x768, not 512x512. This arm is a deliberate 512x512; it anchors the
  #     resolution axis below and is paired against the text arm INSIDE the
  #     stage-2 job. Do not compare it across jobs.
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 512, height: 512, bg_color: "#FFFFFF", keep_text: true}

  # --- 3-4. RESOLUTION, colour and aspect held at the reference ---------
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 256, height: 256, bg_color: "#FFFFFF", keep_text: true}
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 1536, height: 1536, bg_color: "#FFFFFF", keep_text: true}

  # --- 5. ASPECT RATIO matched to the mountain decoy, NO readable text ---
  #     Pairs with condition 10. This is the OCR-ability contrast.
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 1024, height: 141, bg_color: "#FFFFFF", keep_text: true}

  # --- 6. transposed aspect ratio, same pixel count as #5 ---------------
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 141, height: 1024, bg_color: "#FFFFFF", keep_text: true}

  # --- 7-8. COLOUR, resolution and aspect held at the reference ---------
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 512, height: 512, bg_color: "#000000", keep_text: true}
  - <<: *base
    transformation_list:
      - type: ir_blank
        params: {width: 512, height: 512, bg_color: "#808080", keep_text: true}

  # --- 9. FILE FORMAT / compression, held against condition 10 ----------
  #     ⚠️ q40 on a UNIFORM white field is a NO-OP producing bytes identical to
  #     condition 2. The arm must sit on the mountain, which has content to
  #     degrade — this was caught once already before submission; do not
  #     "simplify" it back onto a blank.
  - <<: *base
    transformation_list:
      - type: ir_constant
        params:
          keep_text: true
          image_path: src/prompt_transformations/image/images/mountain.png
          jpeg_quality: 40

  # --- 10. OCR-ABLE: the mountain decoy (caption rendered as an image) ---
  - <<: *base
    transformation_list:
      - type: ir_constant
        params:
          keep_text: true
          image_path: src/prompt_transformations/image/images/mountain.png

  # --- 11. drawn content, non-OCR-able: the line drawing ----------------
  - <<: *base
    transformation_list:
      - type: ir_constant
        params:
          keep_text: true
          image_path: src/prompt_transformations/image/images/rabit.jpeg
