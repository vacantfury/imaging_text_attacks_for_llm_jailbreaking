# Paper B (AS-2) · MECHANISM SWEEP — which of the two hypotheses actually drives it.
#
# ✅ Inside the auto-run gate: open-weight targets on free cluster GPU; the only
# spend is the gpt-5-mini judge, 36 cells x ~$0.02 ≈ $0.72.
#
# WHY. The paper advances two hypotheses for why a content-free decoy lowers ASR:
#   H1  caption-mediated defenses branch on `has_image`, so an image — any image —
#       fires a safety re-check the text-only path never runs.
#   H2  intrinsic image-side safety in the TARGET engages once image-resident
#       content is present, independent of the defense.
# It tests them on two defenses (SAGE, ECSO) and cannot separate them. Two results
# from the 2026-08-05 re-collection say the current H1-centred framing is probably
# wrong:
#   * SAGE showed the LARGEST amplification (+35.0 flash-lite, +20.0 gpt-4o-mini,
#     both significant) — and SAGE never inspects the image. It wraps the TEXT in a
#     discrimination prompt and forwards the image untouched. It cannot branch on
#     an image it does not look at.
#   * `no_defense` + decoy is significant on two open-weight camo cells
#     (qwen +16.0 p=3.1e-05, pixtral +15.0 p=2.6e-03). With NO defense in the
#     pipeline at all, H1 has nothing to act through.
#
# THE DESIGN. Vary the defense along ONE axis — how much of the input it touches —
# holding attack, arm, target and judge fixed. The repo already encodes this ladder
# (src/defense/llm_self_defense.py docstring):
#
#   defense            sees the image?   acts on        H1 predicts amplification?
#   ---------------------------------------------------------------------------
#   no_defense         target only       nothing        NO  (no defense to branch)
#   ecso               YES (captions)    input          YES
#   sage               no (passes thru)  input          no
#   llm_self_defense   no (never)        OUTPUT         no  <- the decisive cell
#
# `llm_self_defense` is the sharpest test in the set: it screens the target's
# RESPONSE and never touches the input at all. Amplification there cannot be an
# input-side branching effect under any reading, so a significant result kills H1
# outright and leaves H2 (or a target-side effect) as the explanation.
#
# READ THE RESULT THIS WAY — decided BEFORE seeing it, so it cannot be fitted after:
#   * amplification ONLY in ecso                  -> H1 supported
#   * amplification in sage / llm_self_defense / no_defense too -> H1 refuted, H2 supported
#   * amplification nowhere on open weights       -> the effect is vendor-pipeline
#                                                    specific, and the paper must say so
#
# NOT INCLUDED, and why (neither is ready tonight; both would strengthen the test):
#   * `cider`   — needs a tau calibration sweep in the corrected embedding space;
#                 `conf/defense/cider.yaml` still has `threshold: null`.
#   * `amia_ia` — needs the VisRAG-Ret masking encoder, not in xc's HF cache.
#   * `selfdefend` — needs the released checkpoints under other_repos/selfdefend/.
# Adding cider + amia_ia would give a SECOND image-inspecting defense, which the
# design wants (right now `ecso` alone carries the H1-positive side). Follow-up.
#
# n=100 throughout, matching every other cell in the paper. Deliberate: mixing 100
# and 240 across a paper invites "why not all at 240", and the honest answer would
# be "because 100 was not significant". Breadth at constant n instead of depth at
# variable n (owner ruling 2026-08-05).
#
# NOT re-run here: no_defense/ecso x 3 targets x semantic_camo x 2 arms — already
# collected by xc 144. This preset adds the missing 36 of the 48-cell design.

num_main_job_threads: 8
num_cluster_jobs: 7          # 1 orchestrator + up to 6 servers; xc budget is 6

# Both encodings from the FIXED encoders (AICR 285658 / 285677).
_ca_text:  &ca_text  outputs/presence_tax/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_ca_decoy: &ca_decoy outputs/presence_tax/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant
_sc_text:  &sc_text  outputs/presence_tax/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/llm_semantic_camo
_sc_decoy: &sc_decoy outputs/presence_tax/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/ir_constant

_b: &b
  mode: defense+evaluate
  benchmark: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_mechanism_sweep

_ecso: &ecso
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read

tasks:
  # ================= code_attack: all 4 defenses x 3 targets x 2 arms (24) =======
  - {<<: *b, defense: no_defense,       target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: no_defense,       target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_decoy}
  - {<<: [*b, *ecso],                   target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_text}
  - {<<: [*b, *ecso],                   target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: sage,             target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: sage,             target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: llm_self_defense, target_model: qwen2_5_vl_7b, source_transform_subdir: *ca_decoy}

  - {<<: *b, defense: no_defense,       target_model: internvl3_8b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: no_defense,       target_model: internvl3_8b, source_transform_subdir: *ca_decoy}
  - {<<: [*b, *ecso],                   target_model: internvl3_8b, source_transform_subdir: *ca_text}
  - {<<: [*b, *ecso],                   target_model: internvl3_8b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: sage,             target_model: internvl3_8b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: sage,             target_model: internvl3_8b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: internvl3_8b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: llm_self_defense, target_model: internvl3_8b, source_transform_subdir: *ca_decoy}

  - {<<: *b, defense: no_defense,       target_model: pixtral_12b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: no_defense,       target_model: pixtral_12b, source_transform_subdir: *ca_decoy}
  - {<<: [*b, *ecso],                   target_model: pixtral_12b, source_transform_subdir: *ca_text}
  - {<<: [*b, *ecso],                   target_model: pixtral_12b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: sage,             target_model: pixtral_12b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: sage,             target_model: pixtral_12b, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: pixtral_12b, source_transform_subdir: *ca_text}
  - {<<: *b, defense: llm_self_defense, target_model: pixtral_12b, source_transform_subdir: *ca_decoy}

  # ===== semantic_camo: only the 2 defenses xc 144 did NOT cover (12) ===========
  - {<<: *b, defense: sage,             target_model: qwen2_5_vl_7b, source_transform_subdir: *sc_text}
  - {<<: *b, defense: sage,             target_model: qwen2_5_vl_7b, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: qwen2_5_vl_7b, source_transform_subdir: *sc_text}
  - {<<: *b, defense: llm_self_defense, target_model: qwen2_5_vl_7b, source_transform_subdir: *sc_decoy}

  - {<<: *b, defense: sage,             target_model: internvl3_8b, source_transform_subdir: *sc_text}
  - {<<: *b, defense: sage,             target_model: internvl3_8b, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: internvl3_8b, source_transform_subdir: *sc_text}
