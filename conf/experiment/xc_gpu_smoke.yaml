# ============================================================
# xc GPU-serving smoke — validate the vLLM-server-via-SLURM path ON xc.
# ============================================================
# Purpose: prove xc serves an open-weight model through the SAME
# ClusterModelServerManager path as NURC/AICR — i.e. the orchestrator submits a
# vLLM server job to partition `main` (`--gres=gpu:1`), waits for the endpoint,
# and dispatches a target query. Complements bedrock_smoke (pure-API, no GPU).
#
# SELF-CONTAINED 2-server GPU smoke: target = Qwen2.5-VL-7B, judge =
# Qwen3-VL-8B, both vLLM-SERVED on xc (2 GPUs). Deliberately uses NO Bedrock and
# NO gated models — so it validates xc's MULTI-server GPU path end-to-end with
# zero credential prerequisites (no AWS creds, no HF token, no op keys). The
# Qwen3-VL judge is an AD-HOC second served model chosen only to exercise the
# 2-server orchestration; its verdicts are not meaningful, this is an infra check.
#
# ⚠️ REAL experiments judge with WildGuard (the project's decided free judge),
# which is a GATED HuggingFace repo (allenai/wildguard). xc has NO HF token
# (shared box, kept credential-clean), so serving WildGuard/LlamaGuard/other
# GATED models needs an opt-in: add HUGGINGFACE_TOKEN to ~/.xc_env on the box
# (owner decision — puts a read-token on the shared box). Non-gated models
# (Qwen/InternVL/Nova targets, etc.) need nothing.
#
# Usage (ON xc, after `scripts/setup_env.sh xc` built the torch+vLLM layer):
#     sbatch scripts/run_experiment_xc.sbatch xc_gpu_smoke

num_main_job_threads: 1

tasks:
  - mode: defense+evaluate
    source_transform_subdir: outputs/prompt_transform/harmbench/set_theory_20260718_190108_43951839/llm_set_theory
    target_model: qwen2_5_vl_7b          # served on xc via SLURM (--gres=gpu:1, partition main)
    defense: no_defense
    judge_model: qwen3_vl_8b_instruct    # 2nd non-gated served model → exercises the 2-server path
