# Paper B / Line B · GUARD-MODEL CHANNEL COVERAGE — STAGE 1 (render, $0)
#
# WHAT LINE B HAS NOT TESTED. Every defense examined so far is a TRANSFORM
# defense — ECSO rewrites via a caption, SAGE rewrites the text. Gate defenses
# are the other class deployed in practice and they work completely differently:
# a classifier inspects the input and either blocks it or passes the ORIGINAL
# prompt through untouched. Whether the paper's channel/protocol findings extend
# to gates is currently unknown, and the answer decides how wide Line B's claim
# can be.
#
# THE CLEANEST POSSIBLE CHANNEL CONTRAST, DELIBERATELY UN-ENCODED. This stage
# builds ONE arm: the harmful prompt rendered as plain text on a canvas, with
# the text channel replaced by a fixed placeholder. Paired against the existing
# text arm it isolates the CHANNEL and nothing else —
#
#   ARM T : payload in TEXT, no image          (existing non_llm_baseline dir)
#   ARM I : payload in IMAGE, text = placeholder  (this render)
#
# No encoder is applied to either arm. That is a deliberate design choice, not
# laziness: every previous channel experiment in this paper moved the payload
# AND encoded it (formal_logic -> ir_plain), so "the guard missed it" could
# always be blamed on the encoding. Plain text moved to the image channel
# removes that defence entirely — a text-only classifier that misses this is
# missing it purely because the bytes are pixels.
#
# It also makes the stage FREE and deterministic: `non_llm_baseline` and
# `ir_plain` are both non-LLM, so no encoder model is called.
#
# CHAINED OFF THE CANONICAL HARMFUL TEXT — the same `non_llm_baseline` step the
# symmetry test and the exchange-rate round use, so ARM T needs no re-render and
# the two arms are paired per prompt id by construction.
#
# COST: $0. One non-LLM render x 100 prompts. No target, no judge.
#
# SUBMIT (xc):
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch defense_read_access/guard_channel_stage1'

num_main_job_threads: 2

_h_text: &h_text outputs/image_presence_threshold/prompt_transform/harmbench/non_llm_baseline_ir_blank_20260806_151849_37565903/non_llm_baseline

tasks:
  - mode: prompt_transform
    source_transform_subdir: *h_text
    benchmark: harmbench
    prompt_range: [0, 99]
    campaign: paper_b_guard_channel
    transformation_list:
      # keep_text FALSE — the payload leaves the text channel entirely and the
      # user message becomes a fixed placeholder. This is the whole point: if
      # the text were kept, a text-only guard would still see the payload and
      # the contrast would measure nothing.
      - type: ir_plain
        params:
          keep_text: false
          text_replacement: "Answer the question shown in the image."
