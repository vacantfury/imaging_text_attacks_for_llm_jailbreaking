# AS-7 · SAME-WINDOW INTERLEAVED PROTOCOL GRID ON HOSTED MODELS.
#
# WHY THIS EXISTS — cspaper review 5, con 3 / Q1 (2026-08-21), the one con the
# reviewer named as score-limiting:
#
#   "Within each protocol, text-versus-decoy comparisons are properly paired,
#    but the key quantity 'deployable contrast minus granted contrast' is not
#    necessarily paired across the API collection campaigns. [...] The paper
#    should report a same-window, randomized or interleaved deployable/granted
#    collection for the central hosted-model result."
#
# The criticism is CORRECT and specific to the HOSTED grid. tab:deployable's
# granted cells were collected 2026-08-02/03 and its deployable cells
# 2026-08-05/06, so the difference-of-contrasts spans two windows on
# nondeterministic vendor endpoints, and §4.14 measures 0–10 points of
# campaign-level drift. The reviewer explicitly praised Fig. 1's caption for
# disclosing this; disclosure is not the same as removing it.
#
# WHAT IS ALREADY ANSWERED, so this round does not re-buy it:
#   - The OPEN-WEIGHT ladder (tab:readladder / tab:benefit, campaign
#     `as7_protocol_grant`) is ALREADY same-window: all 32 cells collected
#     2026-08-08, both protocols present for all 12 (defense,target,encoding)
#     triples, per-prompt flags stored, so every protocol gap there is paired
#     per prompt WITHIN one campaign. The paper's mechanism claim rests on
#     that grid, not on the hosted one.
#   - It ALSO has a designed independent replicate (`as7_protocol_grant_rep2`,
#     src/analysis/as7_between_campaign.py): the four gate cells move −3, −3,
#     +0, −6 and every large gap stays large and same-signed; median |delta|
#     3 points over 12 cells.
#   This preset therefore buys exactly one missing thing: the same-window
#   design on the HOSTED side, where the reviewer's confound actually lives.
#
# DESIGN. One preset = one orchestrator run = one campaign = one window, and
# both protocol arms read the SAME upstream transform dirs, so the granted and
# deployable cells share the prompt set exactly and can be paired per prompt.
# That is the "interleaved" property the reviewer asked for; interleaving at
# the request level is not required for pairing, only same-window collection
# with a shared prompt index, which this gives.
#
# TARGETS. The two hosted cells carrying the largest published grant inflation
# in tab:deployable: gemini-2.5-flash-lite / code_attack (−63 granted vs −3
# deployable, the reviewer's own cited example) and gpt-4o-mini / code_attack
# (−53 vs −15). Both encodings are collected on both models so the round
# reports four same-window protocol gaps rather than one.
#
# API-ONLY: no served models, so no GPU is requested and no vLLM server is
# started. num_cluster_jobs = 1 is the orchestrator itself.
#
# READ-OUT, PRE-REGISTERED BEFORE THE DATA LANDS (house rule; the branch that
# fires is REPORTED, never re-run away):
#   CONFIRMS  the same-window granted−deployable gaps keep the sign and rough
#             magnitude of the two-window ones. The artifact is not a drift
#             artifact, and con 3 is answered on the hosted side too.
#   NARROWS   gaps shrink but stay same-signed and large where the paper calls
#             them large. Report the same-window numbers as the primary ones
#             and the two-window grid as superseded for that cell.
#   REFUTES   a gap the paper calls large collapses or changes sign. Then the
#             hosted grid's magnitudes were partly drift, the paper says so,
#             and the claim retreats to the open-weight ladder, which is
#             same-window and replicated and already carries the mechanism.
#
# SUBMIT (NURC; the four source dirs were rsynced up and verified 2026-08-21):
#   ssh explorer 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment.sbatch defense_read_access/protocol_grant_api_samewindow'

num_main_job_threads: 8
num_cluster_jobs: 1          # orchestrator only — every model here is an API endpoint

# Canonical chains — identical anchors to protocol_grant_internvl3.yaml and
# ecso_deployable_grid.yaml, so the prompt set matches the published grid.
_code_text:  &code_text  outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_code_decoy: &code_decoy outputs/image_presence_threshold/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant
_form_text:  &form_text  backup_files/arr_may_submission_files/outputs/prompt_transform/harmbench/formal_logic_ir_plain_20260525_010219_56487445/llm_formal_logic
_form_decoy: &form_decoy outputs/image_presence_threshold/prompt_transform/harmbench/llm_formal_logic_ir_constant_20260803_064343_72332881/ir_constant

_flash_lite: &fl
  mode: defense+evaluate
  target_model: gemini-2.5-flash-lite
  prompt_range: [0, 99]
  benchmark: harmbench
  judge_method: harmbench
  judge_model: gpt-5-mini
  campaign: as7_protocol_grant_api

_gpt4omini: &gm
  mode: defense+evaluate
  target_model: gpt-4o-mini
  prompt_range: [0, 99]
  benchmark: harmbench
  judge_method: harmbench
  judge_model: gpt-5-mini
  campaign: as7_protocol_grant_api

tasks:
  # ================= gemini-2.5-flash-lite =================
  # ---- undefended denominators (both arms, both encodings) ----
  - {<<: *fl, defense: no_defense, source_transform_subdir: *code_text}
  - {<<: *fl, defense: no_defense, source_transform_subdir: *form_text}
  - {<<: *fl, defense: no_defense, source_transform_subdir: *code_decoy}
  - {<<: *fl, defense: no_defense, source_transform_subdir: *form_decoy}
  # ---- ECSO on the decoy arm, BOTH protocols, same window ----
  - {<<: *fl, defense: ecso, defense_config: {query_source: original}, source_transform_subdir: *code_decoy}
  - {<<: *fl, defense: ecso, defense_config: {query_source: encoded},  source_transform_subdir: *code_decoy}
  - {<<: *fl, defense: ecso, defense_config: {query_source: original}, source_transform_subdir: *form_decoy}
  - {<<: *fl, defense: ecso, defense_config: {query_source: encoded},  source_transform_subdir: *form_decoy}

  # ================= gpt-4o-mini =================
  - {<<: *gm, defense: no_defense, source_transform_subdir: *code_text}
  - {<<: *gm, defense: no_defense, source_transform_subdir: *form_text}
  - {<<: *gm, defense: no_defense, source_transform_subdir: *code_decoy}
  - {<<: *gm, defense: no_defense, source_transform_subdir: *form_decoy}
  - {<<: *gm, defense: ecso, defense_config: {query_source: original}, source_transform_subdir: *code_decoy}
  - {<<: *gm, defense: ecso, defense_config: {query_source: encoded},  source_transform_subdir: *code_decoy}
  - {<<: *gm, defense: ecso, defense_config: {query_source: original}, source_transform_subdir: *form_decoy}
  - {<<: *gm, defense: ecso, defense_config: {query_source: encoded},  source_transform_subdir: *form_decoy}
