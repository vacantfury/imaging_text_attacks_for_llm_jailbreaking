# AS-7 · BENIGN CHANNEL COVERAGE — wildguard (text-only)   [chunk 1 of 3]
#
# THE QUESTION. The harmful round measured that wildguard blocks 100/100 in the
# TEXT channel and 0/100 of the same payload in the IMAGE channel. That number
# alone is a miss rate, and a miss rate is a statement about ACCURACY. This
# round asks what the guard's image-channel decision contains: if it also blocks
# 0/100 BENIGN image inputs, the decision is a CONSTANT and carries no
# information about the input at all. Accuracy can be blamed on a hard payload;
# a constant cannot.
#
# READ-OUT, RECORDED BEFORE THE RUN:
#   * benign IMAGE blocked = 0 (matching harmful IMAGE = 0)
#       -> the strongest form of the lead result: zero discrimination on the
#          uncovered channel, i.e. the guard is BLIND there rather than bad.
#   * benign IMAGE blocked > 0 while harmful IMAGE = 0
#       -> the guard does see something in the image channel and is
#          ANTI-discriminating (blocks benign, passes harmful). A stranger and
#          more alarming result; report it as measured, do not smooth it.
#   * benign IMAGE blocked ~ benign TEXT blocked
#       -> the guard is not channel-limited at all and the lead result needs
#          re-examination before anything else in the paper is trusted.
#   * benign TEXT blocked near 100 on BOTH sets
#       -> suspect a stuck-closed guard before celebrating; check raw rows.
#
# WHY BOTH BENIGN SETS. ORBench-hard is adversarially selected (benign prompts
# that already trip aligned models), so its false-positive rate is inflated BY
# CONSTRUCTION and must never be reported as a deployment rate. ORBench-1k is
# the ordinary sample. Reporting both bounds the claim from each side.
#
# ⚠️ THE no_defense CELLS (in this chunk only, they are shared) ARE NOT
# OPTIONAL. A benign prompt can go unanswered because the GUARD blocked it or
# because the TARGET refused it on its own, and those are different failures
# with different owners. The undefended pair separates them.
#
# WHY CHUNKED BY GUARD. AICR rtx-devel caps gres/gpu=2 TOTAL per user, so a
# preset may hold at most TWO vLLM servers. Here that is the target and one
# guard; the ORBench judge is the target model itself, so it costs no extra
# server. A 4-server preset does not fail loudly -- it STARVES in endpoint-wait
# and burns its wall producing nothing. The three chunks are chained with
# --dependency=afterany so they never contend.
#
# COST: $0. Target, guard and judge are all self-served on our own GPUs. No API
# judge is needed because the reported quantity -- the guard block rate -- is an
# EXACT string match on the canned block text, computed from stored rows.
#
# SUBMIT: see the chain in benign_channel_guardreasoner_vl.yaml's header.

num_main_job_threads: 4
num_cluster_jobs: 3          # orchestrator + target(=judge) + 1 guard server

_hard_t: &hard_t outputs/defense_read_access/prompt_transform/orbench_benign_hard/non_llm_baseline_ir_plain_20260808_192521_31033573/non_llm_baseline
_hard_i: &hard_i outputs/defense_read_access/prompt_transform/orbench_benign_hard/non_llm_baseline_ir_plain_20260808_192521_31033573/ir_plain
_k1_t:   &k1_t   outputs/defense_read_access/prompt_transform/orbench_benign_1k/non_llm_baseline_ir_plain_20260808_192521_50285191/non_llm_baseline
_k1_i:   &k1_i   outputs/defense_read_access/prompt_transform/orbench_benign_1k/non_llm_baseline_ir_plain_20260808_192521_50285191/ir_plain

# Judge is the TARGET model: the paper's benign number is the guard block rate
# (exact-match, judge-independent), so the ORBench refusal judge here is a
# secondary read-out and does not warrant an API call or a second server.
_hard: &hard
  mode: defense+evaluate
  target_model: internvl3_8b
  prompt_range: [0, 99]
  benchmark: orbench_benign_hard
  judge_method: orbench
  judge_model: internvl3_8b
  campaign: as7_benign_channel

_k1: &k1
  mode: defense+evaluate
  target_model: internvl3_8b
  prompt_range: [0, 99]
  benchmark: orbench_benign_1k
  judge_method: orbench
  judge_model: internvl3_8b
  campaign: as7_benign_channel

tasks:
  # ---- undefended per-channel denominator (shared by all three chunks) ------
  - {<<: *hard, defense: no_defense, source_transform_subdir: *hard_t}
  - {<<: *hard, defense: no_defense, source_transform_subdir: *hard_i}
  - {<<: *k1,   defense: no_defense, source_transform_subdir: *k1_t}
  - {<<: *k1,   defense: no_defense, source_transform_subdir: *k1_i}

  # ---- wildguard (text-only) on both channels, both benign sets -------------
  - {<<: *hard, defense: guard_baseline, defense_config: {guard_model: wildguard}, source_transform_subdir: *hard_t}
  - {<<: *hard, defense: guard_baseline, defense_config: {guard_model: wildguard}, source_transform_subdir: *hard_i}
  - {<<: *k1,   defense: guard_baseline, defense_config: {guard_model: wildguard}, source_transform_subdir: *k1_t}
  - {<<: *k1,   defense: guard_baseline, defense_config: {guard_model: wildguard}, source_transform_subdir: *k1_i}
