# bestofn_attack AS-4 — ROUND 15b: QWEN-2.5-7B, the SEPARATE-SCREENER arms.
#
# OWNER-ORDERED 2026-08-07 ("we just keep running bug-substitute experiments").
# Companion to r15a (self-screening arms). Together they rebuild qwen's mechanism panel.
#
# ── WHERE: xc, NOT NURC (rerouted 2026-08-07 20:05, checked not assumed) ───
# xc: 0 jobs, all 8 A100s free, 24h wall. All four models verified cached under
#     /home/thomas/huggingface_cache/hub (Qwen2.5-7B-Instruct, Meta-Llama-3-8B-Instruct,
#     Llama-Guard-3-8B, wildguard). xc's Bedrock-only API policy is irrelevant here: every
#     model in this round is cluster-served, including the judge.
# NURC: r15a holds all 4 GPU slots AND the model_internals_safety sibling has two jobs
#     (is_causal_sweep, is_decode_lens_real) QUEUED behind them. Running here would jump a
#     waiting session's place on a 4-GPU cap. Don't.
# AICR: 13 jobs / 11 pending against 838 cluster-wide pending. Worse than this morning.
#
# 💡 xc is also the BETTER fit, not just the free one: budget 6 with four models means
# 3+1+1+1 = 6, which is NOT > available_slots 6, so no capping fires and qwen gets THREE
# replicas. On NURC (cap 4) the same preset collapses to one replica each.
#
# ── WHY THESE TWO ARE SPLIT OUT FROM r15a, AND WHY THEY SHARE ONE PRESET ────
# Each needs its own THIRD served model:
#   selfdefend      -> shadow_model: llama3_8b_cluster   (SEPARATE, GREEDY screener)
#   guard_baseline  -> guard_model:  llama_guard_3_8b    (SEPARATE, GREEDY classifier)
# So this preset serves FOUR models: qwen + llama3_8b_cluster + llama_guard_3_8b + wildguard,
# requesting 3+1+1+1 = 6 servers. On xc (budget 6) that is NOT > available_slots, so no
# capping fires and qwen keeps all three replicas. On NURC (cap 4) the same preset would hit
# `max(available_slots // n_models, 1)` = 4//4 = 1 and collapse every model to one replica —
# which is why this round was rerouted rather than queued behind r15a.
# Keeping both defenses in ONE preset is deliberate: splitting them into two 3-model presets
# would cost a second full server startup and, on a 4-slot cluster, still cap to 1 replica
# each (4//3 = 1). One run, more replicas.
#
# ── THE PREDICTION THAT MAKES THIS PAIR WORTH RUNNING ───────────────────────
# This is the CLASS-B half of R13's dissociation, on a second target. Both screeners are
# SEPARATE from the target and GREEDY (created via LLMServiceFactory.create() with no config
# override, so both inherit conf/llm/default.yaml temperature 0.0):
#   P9.  selfdefend      ensemble ~UNCHANGED from T=1.0 to T=0.0.
#   P10. guard_baseline  ensemble ~UNCHANGED from T=1.0 to T=0.0.
# Read against r15a's sage/llm_self_defense arms, which are predicted to COLLAPSE. The
# INTERACTION across the two presets is the result: same split as llama -> the mechanism is
# target-general; everything collapses or nothing does -> R12/R13 is llama-specific and the
# paper must say so.
# ⚠️ 15a and 15b must share judge, encoder and draw count for that contrast to be legal.
# They do: same transform dir, same wildguard judge, same 10,000 draws. Never change one
# without the other.
#
# ── SIZING (the check R14a skipped) ─────────────────────────────────────────
# Both defenses cost 1 TARGET call/draw — the screening call goes to the other model — so
# the target does 4 cells x 10,000 = 40,000 calls, with 40,000 screener calls in parallel on
# other GPUs. r15a measured ~2,750/min for qwen on 3 replicas at conc 64, so this is well
# under an hour of generation against xc's 24h wall — the widest margin of any round today.
# Source transform verified PRESENT on xc (10,000 draws) before submission: a
# defense+evaluate reads source_transform_subdir from LOCAL disk, so a preset that runs on
# one cluster does not automatically run on another.
#
#   ssh xc; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment_xc.sbatch bestofn_attack/r15b_qwen_separate_screeners
#
# ── JUDGE ───────────────────────────────────────────────────────────────────
# wildguard (FREE) collects responses; NOT reportable on this code-bearing arm. gpt-5-mini
# rejudge is a separate cheap step (~$0.9 for these 4 cells) and its own ask.
num_main_job_threads: 2
num_cluster_jobs: 7          # 6 servers on xc (qwen x3 + shadow + guard + wildguard) + orchestrator

_e: &e
  mode: defense+evaluate
  source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260805_212854_26701649/code_attack
  target_model: qwen2_5_7b_instruct
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_r15_qwen_mechanism

tasks:
  # ---- SEPARATE + GREEDY shadow -> predict NULL at T=0 ----
  - {<<: *e, defense: selfdefend, target_model_config: {temperature: 1.0, max_concurrency: 64}}
  - {<<: *e, defense: selfdefend, target_model_config: {temperature: 0.0, max_concurrency: 64}}
  # ---- SEPARATE + GREEDY classifier gate -> predict NULL at T=0 ----
  - {<<: *e, defense: guard_baseline, defense_config: {guard_model: llama_guard_3_8b},
     target_model_config: {temperature: 1.0, max_concurrency: 64}}
  - {<<: *e, defense: guard_baseline, defense_config: {guard_model: llama_guard_3_8b},
     target_model_config: {temperature: 0.0, max_concurrency: 64}}
