# bestofn_attack (Paper D) — Round 1 PILOT: variance-channel BoN vs input-normalization.
# Plan: text_docs/bestofn_attack/experiments_plan.md. Proposal: text_docs/bestofn_attack/proposal.md.
#
# QUESTION: do the paraphrase / strategy channels keep ASR(N) UP under `canonicalize`
# while the surface channel collapses? (channel-depth -> defense-survival, in miniature.)
#
# ALL FREE (cheap-first): target qwen2_5_vl_7b + judge wildguard + helper vicuna_13b_cluster.
# NO API models. gpt-5-mini headline judge is RESERVED (rejudge over saved responses, owner-gated).
#
# NEW SERVING PATH: this is the FIRST cluster run of `variance_channel_bon` + `llm_paraphrase`.
# Fire the ~20-row smoke first (prompt_range [0,19], surface arm only) to validate serving,
# THEN this full pilot.
#
# TWO-PASS (pipeline doesn't auto-chain a timestamp; mirrors bestofn_defense/reproduce_bon.yaml):
#   1. Submit Stage 1 (the 3 prompt_transform arms).
#   2. Read each arm's output <ts> under outputs/bestofn_attack/prompt_transform/harmbench/<ts>/variance_channel_bon/
#      and fill CHAIN_TS_SURFACE / CHAIN_TS_PARA / CHAIN_TS_STRAT below.
#   3. Submit Stage 2 (the 6 defense+evaluate cells).
#   4. bon_asr over the 6 output dirs -> compare ASR(N) surface vs paraphrase vs strategy, no_defense vs canonicalize.
#
# LAUNCH BLOCKER (2026-07-17): cluster checkout is an rsync target (no git) -> the new code needs
# the owner's Cursor Sync-Rsync (local->remote) before this can run. See plan §BLOCKER.

num_main_job_threads: 8
num_cluster_jobs: 4          # orchestrator + 3 servers (qwen target, wildguard judge, vicuna helper)

_common: &common
  source_file: data/harmbench_bon_r4.jsonl
  prompt_range: [0, 499]     # 5 behaviors × 100 draws (pilot slice; [0,19] for the smoke)

_eval: &eval
  mode: defense+evaluate
  target_model: qwen2_5_vl_7b
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_pilot

tasks:
  # ===================== Stage 1 — three variance channels =====================
  - <<: *common
    mode: prompt_transform
    transformation_list:
      - type: variance_channel_bon
        params: {channel: surface, seed: 0}

  - <<: *common
    mode: prompt_transform
    transformation_list:
      - type: variance_channel_bon
        params:
          channel: paraphrase
          seed: 0
          model: vicuna_13b_cluster          # free, permissive paraphraser
          paraphrase: {enabled: true, type: llm_paraphrase, params: {temperature: 1.0}}

  - <<: *common
    mode: prompt_transform
    transformation_list:
      - type: variance_channel_bon
        params:
          channel: strategy
          seed: 0
          model: vicuna_13b_cluster          # helper for the LLM attacks in the bank
          # attack_bank defaults from conf/text_encoding/variance_channel.yaml
          # (set_theory / formal_logic / semantic_camo / cipher / deep_inception / code_attack)

  # ===================== Stage 2 — fill <ts> from Stage 1, then submit =========
  # surface
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_SURFACE/variance_channel_bon
    defense: no_defense
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_SURFACE/variance_channel_bon
    defense: canonicalize
  # paraphrase
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_PARA/variance_channel_bon
    defense: no_defense
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_PARA/variance_channel_bon
    defense: canonicalize
  # strategy
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_STRAT/variance_channel_bon
    defense: no_defense
  - <<: *eval
    source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/CHAIN_TS_STRAT/variance_channel_bon
    defense: canonicalize
