  target_model: qwen2_5_7b_instruct
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
_CODE: outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260805_212854_26701649/code_attack
