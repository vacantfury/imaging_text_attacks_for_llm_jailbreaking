# bestofn_attack Paper-D — REVIEW-6 RESPONSE (con 5): the probe-count continuum.
#
# OWNER-APPROVED 2026-08-01 ("both") against a stated resource report.
#
# ── WHAT THIS ANSWERS ────────────────────────────────────────────────────────
# Review 6 con 5 accepts the probe-count account as plausible but calls it
# under-operationalized:
#
#   "the analysis contrasts 100 character variants with one code prompt, while
#    these attack families also differ in semantic framing, tokenization, syntax,
#    prompt length ... Canonicalization leaving 100 distinct strings per behavior
#    is a useful negative result, but 'distinct string count' is not equivalent to
#    the number of independent probes in any statistical sense. The manuscript
#    would be substantially stronger with controlled variants that interpolate
#    between identical prompts, canonicalized variants, semantically equivalent
#    paraphrases, and deliberately diverse transformations."
#
# The PARAPHRASE arm is the missing rung. It is generated by the same
# `variance_channel_bon` transform as the surface arm (channel: paraphrase), from
# the same 2026-07-18 batch, so it is comparable by construction.
#
#   arm         distinct strings/behavior   diversity kind
#   code                 1                  none (deterministic template)
#   canon(surface)     100                  character, post-normalization
#   PARAPHRASE         100 (min 88)         SEMANTIC          <-- this preset
#   surface            100                  character
#
# ── WHY THIS IS THE SHARP TEST ───────────────────────────────────────────────
# Paraphrase and surface carry the SAME distinct-string count (median 100) but
# very different semantic diversity. If distinct-string count were what governs
# boundary-crossing, the two must behave the SAME at a gate. If semantic
# diversity governs, they must diverge. Either outcome answers the reviewer in
# his own terms, and the account only survives one of them.
#
# ── PRE-REGISTERED PREDICTION (recorded BEFORE the run) ──────────────────────
# The probe-count account claims what matters is independent probes at the
# decision boundary, NOT byte-distinctness. A guard classifier generalizes over
# surface form far better than over meaning, so:
#
#   PREDICTION: at the gates, PARAPHRASE retains MORE than surface (it varies the
#   feature the classifier actually keys on), and both retain more than code.
#   Ordering: paraphrase > surface >> code.
#
#   A result where paraphrase ~= surface would show byte-distinctness is the
#   operative quantity after all, and the "independent probes" framing is
#   rhetoric rather than mechanism -- that gets reported as a refutation.
#
# ── CELLS (4) ────────────────────────────────────────────────────────────────
# no_defense is REQUIRED, not optional: retention is normalized by each arm's own
# undefended reach, and no undefended paraphrase cell exists for llama at T=1.0.
# (The only paraphrase cells on disk are R3, on a VISION target at T=0.0 -- the
# pre-repair greedy configuration this paper discloses as defective. Unusable.)
#
# ── COMPARABILITY ────────────────────────────────────────────────────────────
# Same target, same T=1.0, same generation budget, same three defense conditions
# as the existing llama panel (p2_probe_count + p4_published_gate), so the
# paraphrase column drops straight into the existing table.
#
# ── JUDGE ────────────────────────────────────────────────────────────────────
# wildguard first pass (FREE, on-cluster) then a gpt-5-mini rejudge, the standing
# pattern. NOTHING from the wildguard pass is reportable -- it over-flags the
# code arm 41-68%. Ratios/selectivity numbers may not be recorded even as
# provisional from a wildguard pass.
#
#   sbatch scripts/run_experiment_aicr.sbatch bestofn_attack/p7_probe_paraphrase
#
# ── FOOTPRINT ────────────────────────────────────────────────────────────────
# 4 cells x 10,000 = 40,000 generations. GPU only at this stage (no API spend).
# Expected makespan ~2-4h. Follow-on gpt-5-mini rejudge ~$24-36 at the measured
# $0.00090/call -- a SEPARATE ask, not covered by this preset.
#
# ── VERIFY AFTER ─────────────────────────────────────────────────────────────
# All 4 cells: count == 10000, status success, fallback_parse_count == 0.
# Expect a LOW draw-diversity ratio on the gate cells -- blocked prompts return a
# byte-identical canned refusal. That is the documented gate exemption, not the
# variation-channel defect of Section 4.
num_main_job_threads: 4      # all 4 cells in flight
num_cluster_jobs: 5          # orchestrator + ~2 llama replicas + wildguard + llama_guard_3
_e: &e
  mode: defense+evaluate
  target_model: llama3_1_8b_cluster
  target_model_config: {temperature: 1.0}
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_p7_paraphrase
_PARA: &para outputs/bestofn_attack/prompt_transform/harmbench/variance_channel_bon_20260718_050204_64308095/variance_channel_bon
tasks:
  - {<<: *e, source_transform_subdir: *para, defense: no_defense}
  - {<<: *e, source_transform_subdir: *para, defense: canonicalize}
  - {<<: *e, source_transform_subdir: *para, defense: canonicalize_guard, defense_config: {guard_model: wildguard}}
  - {<<: *e, source_transform_subdir: *para, defense: guard_baseline, defense_config: {guard_model: llama_guard_3_8b}}
