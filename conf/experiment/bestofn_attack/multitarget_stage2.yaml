# bestofn_attack — R5 MULTI-TARGET (the #1 AAAI gap: generalize beyond qwen-7B).
# Reuses the EXISTING cluster stage-1 transforms (code_attack + surface/vanilla-BoN)
# — NO new transforms, NO code change. Adds Stage-2 cells for 2 new VLM targets.
# Attacks: code_attack (structural hero) + surface (vanilla BoN, Hughes baseline).
# Defenses: no_defense + canon->guard. In-cluster judge = wildguard (FREE); surface
# cells are clean on wildguard, code_attack cells get a gpt-5-mini EARLY-STOPPING
# rejudge afterward (judge draws until first success per behavior -> cheap QtFS).
num_main_job_threads: 8
num_cluster_jobs: 4          # orchestrator + internvl3 + pixtral + wildguard(guard+judge)

_e: &e
  mode: defense+evaluate
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_r5_multitarget

_CODE: &code outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260718_213010_40825967/code_attack
_SURF: &surf outputs/bestofn_attack/prompt_transform/harmbench/variance_channel_bon_20260718_050205_56951903/variance_channel_bon

tasks:
  # --- InternVL3-8B ---
  - {<<: *e, target_model: internvl3_8b, source_transform_subdir: *code, defense: no_defense}
  - {<<: *e, target_model: internvl3_8b, source_transform_subdir: *code, defense: canonicalize_guard, defense_config: {guard_model: wildguard}}
  - {<<: *e, target_model: internvl3_8b, source_transform_subdir: *surf, defense: no_defense}
  - {<<: *e, target_model: internvl3_8b, source_transform_subdir: *surf, defense: canonicalize_guard, defense_config: {guard_model: wildguard}}
  # --- Pixtral-12B ---
  - {<<: *e, target_model: pixtral_12b, source_transform_subdir: *code, defense: no_defense}
  - {<<: *e, target_model: pixtral_12b, source_transform_subdir: *code, defense: canonicalize_guard, defense_config: {guard_model: wildguard}}
  - {<<: *e, target_model: pixtral_12b, source_transform_subdir: *surf, defense: no_defense}
  - {<<: *e, target_model: pixtral_12b, source_transform_subdir: *surf, defense: canonicalize_guard, defense_config: {guard_model: wildguard}}
