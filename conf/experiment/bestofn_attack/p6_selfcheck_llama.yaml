# bestofn_attack Paper-D — P6 SELF-CHECK GENERALIZATION, LLAMA-3.1-8B (3 cells).
#
# ── THIS FILE CARRIES THE ROUND'S RATIONALE. The other three presets
# (p6_selfcheck_qwen / _gemma / _70b) are the same three cells against a
# different target and point back here rather than repeating it. Submit this
# one first; it is also the fastest.
#
# WHY THE ROUND IS SPLIT ONE-PRESET-PER-TARGET instead of one 12-cell preset.
# Not tidiness — the replica allocator. experiment.py::_start_cluster_servers
# caps every model to `available_slots // n_models` when the request exceeds
# budget, and that floor division is brutal: five distinct models against xc's
# 6-server budget gives per_model_cap = 6//5 = 1, so EVERY model gets a single
# replica no matter what its YAML asks for. Qwen alone would then need ~26h for
# its three cells. Split per target, the model count drops to three (target +
# shadow + judge) and the request fits under budget uncapped, so each target
# gets the replicas its YAML actually asks for:
#     llama 4 + shadow + wildguard = 6 servers (6 GPUs, exactly the budget)
#     qwen  3 + shadow + wildguard = 5
#     gemma 2 + shadow + wildguard = 4
#     70B   2x2GPU + shadow + wildguard = 6 GPUs
# Second benefit: each preset is independently restartable, so one bad target
# does not cost the whole round.
#
# WHY THIS ROUND EXISTS. Reviewers 1 and 3 both said the borrowed-strength
# account rests on a single defense (SAGE) and would score higher if it held
# for other self-check architectures. P6 adds two PUBLISHED ones chosen to
# straddle the boundary the account predicts:
#
#   defense            screener      side     mechanism   prediction
#   -----------------  ------------  -------  ----------  -----------------------
#   sage               TARGET        input    transform   VARIES by target (P5 ✓)
#   llm_self_defense   TARGET        output   gate        VARIES by target
#   selfdefend         SEPARATE      input    gate        FLAT across targets
#
# Borrowed strength says a self-check inherits its power from the TARGET's own
# disposition to refuse. Both same-model defenses should therefore track that
# disposition; the separate-model one has nothing to borrow and should not.
#
# ── THE no_defense CELLS ARE NOT PADDING ─────────────────────────────────────
# They are the reason this round is 9 cells and not 6. P5 ran at temperature
# 1.0 / seed 1337 (the E1 manipulation) but never ran an UNDEFENDED cell at
# that setting, and every stored no_defense baseline in outputs/ is
# temperature 0.0 / seed 42. Those are not interchangeable: the P6 pilot's
# selfdefend cell blocked 0/100, so its ASR is by construction the undefended
# ASR, and it came out 47% against the stored T=0 baseline's 64% on the same
# target, same encoding dir, same judge. A 17-point gap from sampling alone.
#
# Consequence: without a matched floor, "defense X leaves ASR at 47%" cannot be
# turned into a COVERAGE number, and coverage — not ASR — is what varies-vs-flat
# is a claim about. Undefended ASR differs across targets on its own, so
# comparing defended ASR across targets measures the targets, not the defenses.
# Read every cell below as coverage = (no_defense_asr - defended_asr) / no_defense_asr.
#
# ── WHAT THE PILOT ALREADY SETTLED (xc jobs 69 + 73, n=100, llama-3.1-8B) ────
# llm_self_defense: HEALTHY. blocked 13/100, well-formed verdicts, and the
#   substring trap handled correctly ("no, this is not harmful" contains
#   "harmful"). Ready to scale.
#
# selfdefend: both published prompts were run, and they disagree completely
#   while the shadow's ACTUAL JUDGMENT never changes:
#     P_direct  -> blocked 100/100. Shadow: "I cannot identify potential
#                  jailbreak intentions or violations of safety policies in the
#                  provided code." The exact-match parse scores that as a
#                  DETECTION. The verdict is inverted, not merely strict.
#     P_intent  -> blocked   0/100. Shadow: "Summary intent: ... processing a
#                  deque data structure. / Answer: No." The substring parse
#                  reads it correctly, and releases.
#   Same shadow, same input, same underlying "no violation" — opposite outputs.
#   So the parse choice was never the finding. The finding is that an untuned
#   Llama-3-8B shadow is BLIND to the code encoding: 0/100 detections, and the
#   raw verdicts show it is fooled semantically (it sees deque processing), not
#   defeated by formatting.
#
#   We run `intent` here because it is the parse that reports the shadow's
#   judgment faithfully. `direct` is NOT given a cell: its degeneracy is fully
#   demonstrated at n=100 and belongs in the paper as a footnote, not as 10,000
#   draws measuring a string comparison.
#
# ── HOW TO READ A FLAT-AT-ZERO selfdefend RESULT ─────────────────────────────
# Honestly, and NOT as strong support for the prediction. A gate that never
# fires is target-invariant trivially; "flat" is cheap when the level is zero.
# State it as what it is — SelfDefend-basic supplies no coverage against this
# encoding on any target — and let the CONTRAST carry the argument: the same
# encoding, screened on the OUTPUT side by the same-model gate, does get
# caught (13% at pilot scale), because by then the payload has been decoded
# into plain text. Input-side screening reads the encoding; output-side
# screening reads the answer.
#
# Anticipated objection: "your shadow was too weak." The existing P4
# guard_baseline cells (llama_guard_3_8b as an input gate on this same code
# arm) answer it with no new compute — a purpose-built guard is the stronger
# screener. Pull those numbers before writing the section.
#
# JUDGE: wildguard, free first pass, NOT reportable — it over-flags code arms
# by 41-68%. Every number here is provisional until the gpt-5-mini rejudge.
#
#   sbatch scripts/run_experiment_xc.sbatch bestofn_attack/p6_selfcheck_llama
#
# TARGET: Llama-3.1-8B — refusal disposition 31.8%, middle band 63.6%. The
# LEAST self-refusing of the four, so it is where borrowed strength has least
# to borrow and where the same-model defenses should look weakest.
#
# SIZING (xc, 6 free A100-80GB; GPUs 6-7 hold the box owner's non-SLURM work).
# Per-draw target calls: no_defense 1, selfdefend 1 (+1 short shadow call),
# llm_self_defense 2 (generate + screen). Calibration: the stored full-scale
# no_defense run on this target took 3.4h at 10,000 draws. Four replicas over
# ~4 cell-units of work => roughly 5h, comfortably inside the 24h server wall
# that conf/clusters/xc.yaml now sets (it was 8h until 2026-07-30, which none
# of these presets would have survived).
num_main_job_threads: 3      # all three cells in flight across the replicas
num_cluster_jobs: 7          # orchestrator + 4 llama + shadow + wildguard

_e: &e
  mode: defense+evaluate
  target_model: llama3_1_8b_cluster
  # seed 1337 / T=1.0 — MUST match P5 and the other P6 presets exactly, or the
  # wrapper results and these are measured on different samples and cannot be
  # placed in one table.
  target_model_config: {temperature: 1.0, seed: 1337}
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_p6_selfcheck

_CODE: &code outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260718_213010_40825967/code_attack

tasks:
  # Matched undefended floor at T=1.0/seed 1337 — see "THE no_defense CELLS"
  # above for why the stored T=0.0/seed 42 baselines cannot serve as this.
  - {<<: *e, source_transform_subdir: *code, defense: no_defense}
  # Same model screens its own OUTPUT (borrowed-strength condition).
  - {<<: *e, source_transform_subdir: *code, defense: llm_self_defense}
  # Fixed SEPARATE shadow screens the INPUT (the predicted boundary).
  - {<<: *e, source_transform_subdir: *code, defense: selfdefend}
