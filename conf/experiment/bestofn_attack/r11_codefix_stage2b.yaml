# bestofn_attack AS-4 — ROUND 11, Stage 2b: rebuilt code arms vs the GATE defense.
#
# OWNER-APPROVED 2026-08-05 ("go" — run the gate pair on xc).
# Stage 2a (AICR job 285964) is DONE and rejudged; this closes the 2x3 factorial.
#
# ── WHY xc, NOT AICR ────────────────────────────────────────────────────────
# The gate cells need a THIRD served model (llama_guard_3_8b): llama x4 + wildguard
# + guard = 6 servers. AICR sat at 7/12 GPU jobs for hours while the R10
# SemanticSmooth reruns (284642/284651) ran, leaving 5 free — and requesting 6 into
# 5 does NOT queue, it triggers the allocator's FLOOR DIVISION
# `available_slots // n_models` = 5//3 = 1, silently collapsing llama 4 -> 1 replica.
# xc is fully idle (0 SLURM jobs, all 8 GPUs at 0 MiB, box owner not using it), the
# weights for all three models are already in its hub cache, and the single-node PORT
# COLLISION that killed four runs on 2026-08-05 is fixed in `1317ee2`.
#
# ⚠️ DO NOT LOWER `num_cluster_jobs` TO "SAVE" GPUs. xc's profile budget is 6 servers
# (2 of the 8 GPUs are deliberately left for the box owner's non-SLURM use). 7-1 = 6
# servers requested into a 6-slot budget makes `total_requested > available_slots`
# FALSE, so NO capping happens and llama keeps its 4 replicas. Setting it to 5 would
# request 4 slots for 6 instances across 3 models -> per_model_cap = 4//3 = 1 -> llama
# collapses to a single replica and the round serialises into the wall.
#
# ── INPUTS: the SAME transform dirs stage 2a consumed ───────────────────────
# Copied AICR -> local -> xc on 2026-08-05, verified on arrival: 10,000 rows each,
# 0 rows containing `appendleft` (i.e. the `b266892` encoder fix is in these prompts).
# Reusing the finished dirs rather than regenerating keeps 2b matched to 2a
# DRAW-FOR-DRAW; the varied arm could not be regenerated here anyway, since its
# paraphrase source (variance_channel_bon_20260718_050204_64308095) lives on AICR.
#
# ── WHAT THIS SETTLES ───────────────────────────────────────────────────────
# The R8 "encoding breaks SAGE, variation breaks the gate" dissociation was FALSIFIED
# by R9 under gpt-5-mini: at FIXED variation the gate let set_theory through 75/100 on
# a single probe while code got only 13/100 — gate failure is ENCODING-dependent, not
# variation-dependent. Those code numbers came from the double-reversed encoder and
# are quarantined. These two cells are the clean replacements, and they carry the
# comparison the paper's framing now turns on.
#
#   ssh xc; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment_xc.sbatch bestofn_attack/r11_codefix_stage2b
#
# ── JUDGE: cheap-first ──────────────────────────────────────────────────────
# wildguard on-cluster first (FREE) -> separate gpt-5-mini rejudge, its own ask.
# ⚠️ NOTHING from the wildguard pass is reportable: both arms are code-bearing and
# wildguard over-flags code 41-68%. No wildguard number, not even provisional. The
# gpt-5-mini rejudge MUST run on aicr/nurc — xc's routing policy bars non-Bedrock
# API models (conf/clusters/xc.yaml), so the rejudge is a separate submission there.
#
# ── FOOTPRINT ───────────────────────────────────────────────────────────────
# 2 cells x 10,000 = 20,000 generations, each also passing the gate classifier.
# GPU only, $0 API at this stage.
num_main_job_threads: 2      # 2 cells; must stay <= llama's 4 replicas
num_cluster_jobs: 7          # 6 servers (llama x4 + wildguard + llama_guard_3_8b) + orchestrator

_e: &e
  mode: defense+evaluate
  target_model: llama3_1_8b_cluster
  target_model_config: {temperature: 1.0}
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_r11_codefix     # SAME campaign as 2a — one round, one key.
                                           # Never r8_factorial: the quarantined r8 cells
                                           # share output naming and latest-wins is unsafe
                                           # (project_cell_selection_latest_wins_is_unsafe).

_CODE_FIXED:  &code_fixed  outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260805_212854_26701649/code_attack
_CODE_VARIED: &code_varied outputs/bestofn_attack/prompt_transform/harmbench/variance_channel_bon_code_attack_20260805_212855_68111123/code_attack

tasks:
  - {<<: *e, source_transform_subdir: *code_fixed,  defense: guard_baseline, defense_config: {guard_model: llama_guard_3_8b}}
  - {<<: *e, source_transform_subdir: *code_varied, defense: guard_baseline, defense_config: {guard_model: llama_guard_3_8b}}
