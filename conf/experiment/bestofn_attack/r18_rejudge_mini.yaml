# bestofn_attack AS-4 — R18 REJUDGE: put the FOURTH target on the reportable judge.
#
# OWNER-APPROVED 2026-08-10 ("continue") at ~$13.5 — the same word, amount and action class as
# the R17 rejudge approved 2026-08-09.
#
# ── WHY ─────────────────────────────────────────────────────────────────────
# R18 (AICR 327787 -> 327788 -> 328569) produced a complete 6-cell temperature panel on
# Llama-3.3-70B, and it ANSWERED the question R17 left open: llama-3.1-8B's selfdefend +25% is
# the OUTLIER, not the rule. But every R18 cell was scored by wildguard, and this is a
# code-bearing arm where wildguard over-flags 41-68%. So the shape is usable and NO MAGNITUDE
# IS. After this pass all four targets are gpt-5-mini and directly comparable for the first
# time — which is the precondition for the 70B entering the paper at all.
#
# ── WHAT THIS BUYS, AND WHAT IT CANNOT ──────────────────────────────────────
# Measured precedent on identically-shaped cells (gemma R16, llama R17): ENSEMBLES moved <=5
# points under rejudge while PER-DRAW ASR moved ~15. Every collapse figure in the paper is an
# ensemble ratio, so the ordering already recorded is judge-robust; what is NOT reportable on
# wildguard is the per-draw block rate, the x-axis of the accuracy comparison.
# ⚠️ IT CANNOT FIX THE CEILING. The control reads 99/100 at T=1.0 — saturated. A saturated
# control understates its own drop, and every other row is control-subtracted, so the 70B's
# sage net (+44% on wildguard) is an UPPER BOUND whatever the judge says. A rejudge changes
# verdicts, not headroom. Do not expect this pass to resolve it and do not report the 70B as a
# clean fourth replicate of the MAGNITUDE — only of the ordering.
#
# ── PRE-REGISTERED, so it cannot be fitted afterwards ───────────────────────
# Expect absolute ASRs to FALL. The decisive contrast — sage's large positive net-of-control
# collapse vs selfdefend's near-null — should SURVIVE, because it survived on all three
# previous targets. If sage's collapse lands near selfdefend's under gpt-5-mini, the 70B is
# withdrawn from the four-target claim and the paper reports three, not explained away.
#
# ── THE CELLS (wildguard readings being replaced) ───────────────────────────
#   defense       T      wildguard asr%   wildguard ensemble    net of control
#   no_defense   1.0        78.72            99/100  <- CONTROL, ceiling-pinned
#   no_defense   0.0        76.70            78/100         (control drop 21%)
#   sage         1.0         6.42            26/100
#   sage         0.0         8.59             9/100              +44%
#   selfdefend   1.0        15.99            21/100
#   selfdefend   0.0        15.99            17/100              -2%
#
# ⚠️ The T=1.0 CONTROL reads from the cell whose wildguard judge DIED during 18a — its
# results.json still carries asr=null/status=partial_judge, but all 10,000 RESPONSES are on
# disk and the rescue rejudge (328569) already re-scored them successfully to 78.72. A rejudge
# reads responses, not the prior verdict, so pointing at the original cell here is correct and
# is what the rescue did.
# ⚠️ selfdefend's two cells report an IDENTICAL per-draw 15.99% — verified a coincidence, not a
# duplicate: 2,128 of 10,000 responses differ and blocked counts differ (7,910 vs 7,905). If
# the two rejudged cells come back identical AGAIN, that is worth a second look; once is chance.
#
# ── WHERE: AICR, `--partition=cpu` ──────────────────────────────────────────
# xc's routing policy bars non-Bedrock API models, so gpt-5-mini cannot run there at all. The
# AICR orchestrator runs on the cpu partition, so this takes ZERO GPU quota from the AS-3 grid
# or any sibling session. All six cells are already on AICR local disk (R18 ran there).
#
#   ssh aicr; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment_aicr.sbatch bestofn_attack/r18_rejudge_mini
#
# ── FOOTPRINT ───────────────────────────────────────────────────────────────
# 6 cells x 10,000 draws = 60,000 judge calls ~= $13.50 at the measured realtime rate
# ($4.50 / 20,000). Prior runs of this shape finished in ~30-50 min. No target is re-queried.
# ⚠️ `usage` is null in rejudge results.json — actual spend is not recoverable from the run;
# verify against the OpenAI dashboard.
# ⚠️ Dead-rejudge trap: a failed cell keeps the PREVIOUS judge's verdicts in raw_results.jsonl
# while results.json carries asr=null. Select on `asr is not None`, never on the path.
num_cluster_jobs: 1
num_main_job_threads: 6

tasks:
# ---- CONTROL: absorbs the answer-sampling channel; every other row is read net of it ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_no_defense_code_attack_20260809_013101_83687448   # T=1.0 (judge died in 18a; responses intact)
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_no_defense_code_attack_20260809_013101_9670014    # T=0.0
  judge_model: gpt-5-mini

# ---- THE DECISIVE ARM: asks the TARGET under its own decoding => verdict is a SAMPLE ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_sage_code_attack_20260809_013101_27267429         # T=1.0
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_sage_code_attack_20260809_032547_14003249         # T=0.0
  judge_model: gpt-5-mini

# ---- THE CONTRAST: separate shadow model at temperature 0 => verdict is FIXED ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_selfdefend_code_attack_20260809_054930_96435786   # T=1.0
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama_3_3_70b_instruct_selfdefend_code_attack_20260809_054930_94603250   # T=0.0
  judge_model: gpt-5-mini
