# bestofn_attack AS-4 — gpt-5-mini gap-fill rejudge, 4 cells across TWO campaigns.
#
# OWNER-APPROVED 2026-08-06 ("go", ~$9 for 4 cells).
#
# ⚠️ HAND-WRITTEN, NOT generated by scripts/build_rejudge_preset.py. The generator
# selects by CAMPAIGN, and this is a deliberate mixed subset: 2 cells from
# bestofn_attack_r11_codefix plus exactly 2 of the 6 bestofn_attack_r9_encgen cells.
# Regenerating it from a campaign list would re-judge all 6 R9 cells and waste ~$9
# on four that are already settled. Keep it hand-written; do not "regenerate".
#
# ── WHY THESE FOUR ──────────────────────────────────────────────────────────
# (a) The two R11 GATE cells (xc job 156, 2026-08-06). Their judge-free numbers are
#     already solid — LlamaGuard-3 was evaded by 9/100 behaviors at fixed variation
#     and 77/100 at varied, read straight off the canned-refusal string. What is
#     missing is ASR on the draws that got THROUGH, so the gate row can sit in the
#     same table as the SAGE row (fixed 61 / varied 76, gpt-5-mini ensembles).
#     ⚠️ Their wildguard pass is NOT usable: code-bearing arms, wildguard over-flags
#     code 41-68%. That is the whole reason these two need gpt-5-mini.
#
# (b) The two R9 cells that were never recovered. The 2026-08-05 R9 rejudge wrote
#     asr=null / status=partial_judge on all 6 (the inherited-verdict trap: the
#     PREVIOUS judge's verdicts survive in raw_results.jsonl while results.json has
#     no asr — never compute a metric without checking `asr is not None`). Four were
#     recovered for free by harvesting the completed OpenAI batches; these two were
#     no longer listed at OpenAI even searching 100 deep, so they must be re-judged.
#     Recovered:  set_theory x gate 75 | formal_logic x none 91 | set_theory x sage 86 | formal_logic x sage 85
#     Missing:    formal_logic x gate | set_theory x none        <-- these two
#
# ── CELL IDENTITIES (the dir names carry no encoding, so they are pinned here) ──
#   ..._guard_baseline__20260805_031935_80681059  = formal_logic x GATE   (R9)
#   ..._no_defense__20260805_031935_43504077      = set_theory   x none   (R9)
#   ..._guard_baseline_code_attack_...19000735    = code x FIXED  x GATE  (R11)
#   ..._guard_baseline_variance_channel_bon_...58995952 = code x VARIED x GATE (R11)
# The two R11 dirs were produced on xc and relayed xc -> local -> aicr on 2026-08-06.
#
# ── WHERE THIS RUNS ─────────────────────────────────────────────────────────
# aicr (or nurc) ONLY. xc's routing policy bars non-Bedrock API models incl. the
# gpt-5-mini judge (conf/clusters/xc.yaml). No GPU: the judge is an API model, so
# num_cluster_jobs=1 is the orchestrator alone and nothing is served.
#
#   sbatch scripts/run_experiment_aicr.sbatch bestofn_attack/r11r9_gapfill_rejudge_mini
#
# ── FOOTPRINT ───────────────────────────────────────────────────────────────
# 4 cells x 10,000 = 40,000 judge calls. Same shape as the R11 rejudge (job 286469,
# 37 min, ~$9); llm_utils v5 auto-routes a job this size to the OpenAI Batch API at
# 50% price. Budget ~$9.
num_cluster_jobs: 1
num_main_job_threads: 8
tasks:
# ---- R11 gate cells (campaign bestofn_attack_r11_codefix) -------------------
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_guard_baseline_code_attack_20260806_045750_19000735
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_guard_baseline_variance_channel_bon_code_attack_20260806_045750_58995952
  judge_model: gpt-5-mini
# ---- R9 gap-fill cells (campaign bestofn_attack_r9_encgen) ------------------
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_guard_baseline__20260805_031935_80681059
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_no_defense__20260805_031935_43504077
  judge_model: gpt-5-mini
