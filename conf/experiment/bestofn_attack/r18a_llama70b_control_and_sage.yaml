# bestofn_attack AS-4 — ROUND 18a: A FOURTH TARGET FOR THE DECISIVE PAIR (Llama-3.3-70B).
#
# OWNER-APPROVED 2026-08-09 ("yes, go"). FREE — every model is cluster-served.
#
# ── WHY: THE 70B's EXISTING CELLS CANNOT BE USED, AND DELETING THEM IS THE WORSE FIX ────
# The paper cites Llama-3.3-70B at 20+ sites ("all four targets", four tables, the wrapper
# panel). Every one of those rests on FOUR cells from 2026-07-28 — `no_defense` and `sage`
# only — which predate the 2026-08-05 method-fidelity fixes. They are not *wrong in direction*
# (the audit established that pre-fix `code_attack` renders a WEAKER attack, so fixed numbers
# rise and no claim reverses), but they are not comparable to post-fix cells sitting in the
# same table, and the 70B has NO temperature panel at all — so under the 2026-08-09 reframe it
# currently contributes nothing to the central claim.
# Re-running is the only option that turns a provenance liability into a FOURTH TARGET for the
# decisive comparison. Owner chose it over deleting or quarantining.
#
# ── SCOPE: THE DECISIVE PAIR PLUS ITS CONTROL, NOTHING ELSE ─────────────────
# The claim this round joins is sage-vs-selfdefend: two defenses that do the SAME JOB (ask a
# language model whether a request is harmful) and differ only in WHOM they ask —
#   sage        -> asks the TARGET under the target's own decoding  => verdict is a SAMPLE
#   selfdefend  -> asks a separate shadow model at temperature 0    => verdict is FIXED
# measured +63/+76/+82 vs +1/-5/+8 net of control on llama-8B / gemma / qwen.
# `llm_self_defense` and `guard_baseline` are deliberately NOT run here: they are the two rows
# whose denominators are single-digit or ceiling-limited, they are reported as counts rather
# than rates, and on a 70B each extra arm costs hours. A fourth target for the noisy rows would
# not make them less noisy.
#   18a = no_defense (CONTROL) + sage   <- THIS FILE, 4 cells
#   18b = selfdefend                    <- 2 cells, needs the extra shadow model
#
# ── SIZING: ONE REPLICA, SEQUENTIAL CELLS (revised after jobs 270/271 died) ─
# 4 cells x 10,000 draws x 1 target call = 40,000 calls on a 70B, run ONE CELL AT A TIME.
# The rate is genuinely uncertain: an 8B/7B sustains ~900 responses/min/replica on an A100 at
# concurrency 64, gemma-2-9B managed only ~49/min (architecture, not size), and the 70B config
# estimates "5-6x slower per token" than an 8B. That spread is 30-180/min => 1h to 5.5h PER
# CELL, so this 4-cell job is ~4h optimistic and ~22h pessimistic against a 20h server wall.
# ✅ That pessimistic overrun is TOLERABLE HERE, and deliberately so: with one replica and
# num_main_job_threads=1 the cells are SEQUENTIAL and each writes its results.json on
# completion, so a wall death loses only the IN-FLIGHT cell — not the round. This is the exact
# opposite of R14a (2026-08-07), where every cell was in flight simultaneously and the wall
# took all of them. Check the measured rate from the vLLM log ~15 min in and re-split if the
# projection is bad; do not wait 20h to find out.
#
# ── SERVERS: ONE REPLICA — num_instances=2 SELF-COLLIDES ON XC ─────────────
# conf/llm/llama_3_3_70b_instruct.yaml `profiles.xc` sets num_gpus=2 (tensor-parallel) because
# fp8 70B is ~70 GB and an 80 GB A100 at utilization 0.92 leaves only ~3 GB of KV cache — less
# than one 20480-token sequence needs. Do NOT "optimise" that to 1 GPU.
# 🔴 But num_instances MUST be 1 here. With 2, xc's single-node SLURM allocated the two 2-GPU
# replicas OVERLAPPING cards and the second died on startup:
#   "Free memory on device cuda:0 (35.15/79.25 GiB) ... less than desired (0.92, 72.91 GiB)"
# — 44 GiB already resident, i.e. the other replica's shard. All 8 GPUs read 0 MiB immediately
# before submit, so this was self-collision, not the box owner. SINGLE-GPU replicas isolate
# fine on xc (gemma ran x3 the same day); it is the MULTI-GPU request that does not place
# disjointly.
#   1 replica x 2 GPUs + wildguard = 2 server JOBS using 3 GPUs.
#
#   ssh xc; cd ~/projects/llm_guardrail_security
#   A=$(sbatch --parsable scripts/run_experiment_xc.sbatch bestofn_attack/r18a_llama70b_control_and_sage)
#   sbatch --dependency=afterany:$A scripts/run_experiment_xc.sbatch bestofn_attack/r18b_llama70b_selfdefend
#
# ── max_tokens IS SET EXPLICITLY AND MUST STAY ──────────────────────────────
# conf/llm/llama_3_3_70b_instruct.yaml carries `model.max_tokens: 512` — correct for its JUDGE
# role and catastrophic for a TARGET role, where it would truncate every response and make this
# panel incomparable to the 8B one (which ran 16384). The xc profile's max_model_len is 20480,
# so 16384 fits. ⚠️ vLLM 400s every request if max_tokens > max_model_len, and the run still
# reports "Successful" — that silently voided 40,000 requests on 2026-07-28 (job 227537).
#
# ── PRE-REGISTERED ──────────────────────────────────────────────────────────
# sage should show a LARGE positive net-of-control collapse (the other three gave +63/+76/+82).
# The control's own drop is the quantity to read FIRST — it was 18% on llama-8B, 24% on gemma,
# 12% on qwen, and it must be subtracted before sage's number means anything.
# If sage lands near zero net of control on a 70B, the claim is size-dependent and the paper
# must say so rather than reporting three targets and omitting the fourth.
num_main_job_threads: 1      # ONE 70B replica on xc -> cells run SEQUENTIALLY (see conf/llm/llama_3_3_70b_instruct.yaml)
num_cluster_jobs: 3          # 1 server (70B, ONE replica x 2 GPUs) + wildguard = 2 servers + orchestrator

_e: &e
  mode: defense+evaluate
  source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260805_212854_26701649/code_attack
  target_model: llama_3_3_70b_instruct
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_r18_llama70b_temperature

tasks:
  # ---- CONTROL: no verdict at all — read this before interpreting sage ----
  - {<<: *e, defense: no_defense, target_model_config: {temperature: 1.0, max_tokens: 16384, max_concurrency: 64}}
  - {<<: *e, defense: no_defense, target_model_config: {temperature: 0.0, max_tokens: 16384, max_concurrency: 64}}
  # ---- ASKS THE TARGET => sampled verdict => predict LARGE net collapse ----
  - {<<: *e, defense: sage, target_model_config: {temperature: 1.0, max_tokens: 16384, max_concurrency: 64}}
  - {<<: *e, defense: sage, target_model_config: {temperature: 0.0, max_tokens: 16384, max_concurrency: 64}}
