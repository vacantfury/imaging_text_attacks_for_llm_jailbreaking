# bestofn_attack AS-4 — R17 REJUDGE: finish llama's panel on the reportable judge.
#
# OWNER-APPROVED 2026-08-09 ("continue") at ~$13.5.
#
# ── WHY ONLY SIX CELLS ──────────────────────────────────────────────────────
# llama's complete temperature panel is 10 cells assembled from TWO campaigns:
#   r13_screener  — llm_self_defense x2, selfdefend x2  ->  ALREADY have gpt-5-mini rejudges
#   r17_llama_temperature — no_defense x2, sage x2, guard_baseline x2  ->  wildguard only
# So only r17's six need rejudging. After this the whole llama panel is gpt-5-mini, matching
# qwen (R15 rejudge) and gemma (R16 rejudge), and all three targets become directly comparable
# on the reportable judge for the first time.
#
# ── WHAT THIS DOES AND DOES NOT BUY ─────────────────────────────────────────
# It buys QUOTABLE MAGNITUDES, not a different answer. Measured precedent from the gemma
# rejudge on identical-shaped cells: ENSEMBLES moved <=5 points while PER-DRAW ASR moved ~15
# (wildguard over-flags code-bearing responses 41-68%). Since every collapse figure in the
# paper is an ensemble ratio, the shapes already reported are judge-robust; what is NOT
# reportable on wildguard is the per-draw block rate, and that is the x-axis of the
# accuracy comparison. Hence this pass.
# ⚠️ Pre-registered so it cannot be fitted afterwards: absolute ASRs should FALL, and the
# decisive contrast (sage's large positive net-of-control collapse vs selfdefend's null)
# should SURVIVE. If sage's collapse lands near selfdefend's under gpt-5-mini, the
# three-target claim does not hold and must be withdrawn, not explained.
#
# ── THE CELLS — temperature now reads straight from each source results.json ─
# No MLflow, no directory-order guessing: the provenance correction of 2026-08-08 established
# that defense+evaluate results.json carries the full target_model_config. Verified on AICR
# after transfer (6 cells, 10,000 rows each):
#
#   defense           T      wildguard asr%   wildguard ensemble
#   no_defense        1.0        65.62            99/100   <- the control
#   no_defense        0.0        70.89            81/100
#   sage              1.0         3.98            65/100
#   sage              0.0         2.10            12/100
#   guard_baseline    1.0         3.97            10/100   <- tiny denominator, see below
#   guard_baseline    0.0         3.58             6/100
#
# ⚠️ guard_baseline moves 10 -> 6 BEHAVIOURS. Its net-of-control percentage (+22% on
# wildguard) is a relative drop on a single-digit denominator and is why its sign flips
# across targets (+22 / -14 / +10) with no trend. Report it as counts. A rejudge will not
# fix that — it is a denominator problem, not a judge problem.
#
# ── WHERE: AICR, `--partition=cpu` ──────────────────────────────────────────
# All six cells were streamed xc -> AICR and verified before submission (a rejudge reads
# `responses_from` from LOCAL disk). xc's routing policy bars non-Bedrock API models, so
# gpt-5-mini cannot run there at all. The AICR orchestrator runs on the cpu partition, so this
# takes ZERO GPU quota from the AS-3 grid or any sibling session.
#
#   ssh aicr; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment_aicr.sbatch bestofn_attack/r17_rejudge_mini
#
# ── FOOTPRINT ───────────────────────────────────────────────────────────────
# 6 cells x 10,000 draws = 60,000 judge calls ≈ $13.50 at the measured realtime rate
# ($4.50 / 20,000). The two prior runs of this shape (10 cells / 100,000 calls) each finished
# in ~50 min, so budget ~30 min here. No target is re-queried.
# ⚠️ `usage` is null in rejudge results.json — actual spend is not recoverable from the run;
# verify against the OpenAI dashboard.
# ⚠️ Dead-rejudge trap: a failed cell keeps the PREVIOUS judge's verdicts in raw_results.jsonl
# while results.json carries asr=null. Select on `asr is not None`, never on the path.
num_cluster_jobs: 1
num_main_job_threads: 6

tasks:
# ---- CONTROL: absorbs the answer-sampling channel; every other row is read net of it ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_no_defense_code_attack_20260808_235108_12766186   # T=1.0
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_no_defense_code_attack_20260808_235108_56208768   # T=0.0
  judge_model: gpt-5-mini

# ---- THE DECISIVE ARM: asks the TARGET, so its verdict is a SAMPLE ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_sage_code_attack_20260808_235108_99484437         # T=1.0
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_sage_code_attack_20260809_002224_77252306         # T=0.0
  judge_model: gpt-5-mini

# ---- separate greedy classifier gate — report as COUNTS, denominator is 6-10 ----
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_guard_baseline_code_attack_20260809_004256_28866476 # T=1.0
  judge_model: gpt-5-mini
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_guard_baseline_code_attack_20260809_005304_92917415 # T=0.0
  judge_model: gpt-5-mini
