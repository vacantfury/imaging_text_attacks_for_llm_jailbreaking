# bestofn_attack AS-4 — ROUND 14b: THE CONFOUND BREAKER, RE-RUN.
#
# OWNER-APPROVED 2026-08-07 ("go", ~$12). Supersedes r14_confound_breaker_semsmooth.yaml,
# which is now HISTORICAL — keep that file for its reasoning, never submit it again.
#
# ── WHY 14a PRODUCED NOTHING (read before changing anything below) ──────────
# NURC jobs 8989121/8989165/8989164 carried TimeLimit=08:00:00 (the gpu QOS wall) against a
# round that needed ~26h. Cancelled at 09:35 with 6,900 of 25,000 target calls done.
# `defense+evaluate` writes results.json only at task end, so NOTHING survived and the ~$6
# of gemini paraphrases was lost. It was unable to finish from the moment it was submitted.
# THE LESSON IS THE CHECK, NOT THE FIX: project the round's wall-clock length and compare it
# to `scontrol show job <id> | grep TimeLimit` BEFORE submitting. Progress logs look healthy
# right up to the wall, so no amount of "is it done yet" monitoring detects this.
#
# ── THE THREE FIXES, IN ORDER OF LEVERAGE ───────────────────────────────────
# 1. GPU CLASS (~5x, the big one) — 14a's target landed on d1007 (v100-sxm2, ~900 GB/s)
#    while the IDLE wildguard judge sat on d4055 (h200, ~4.8 TB/s). Cause: wildguard.yaml
#    already carried `gpu_types_excluded` and llama3_1_8b_cluster.yaml did not. Fixed in
#    conf/llm/llama3_1_8b_cluster.yaml (same list), so the target now gets a100/h200.
#    On the V100 the KV cache was only 105,584 tokens — vLLM's own line was
#    "Maximum concurrency for 20,480 tokens per request: 5.16x". An A100-80G gives ~4x that.
# 2. REPLICAS 1 -> 3 — 14a asked 4 llama + 1 wildguard = 5 against available_slots=3, and
#    the floor-division allocator (`max(available_slots // n_models, 1)`) collapsed it to
#    ONE replica. num_instances is now 3, so 3+1=4 is NOT > NURC's cap of 4 and no capping
#    fires. Do not "helpfully" raise it back to 4: that re-triggers capping and yields 2.
# 3. max_concurrency 20 -> 64 — 14a's server ran `Running: 20, Waiting: 0, KV cache 18.9%`
#    for seven hours: the CLIENT never queued it. The 20 is an API rate-limit default in
#    conf/llm/default.yaml that wrongly applies to the cluster route. Set per-preset below;
#    task.py:483 forwards target_model_config verbatim as service kwargs and
#    TargetModelConfig's Pydantic extra='ignore' drops it from recorded provenance
#    (which is why the proper fix still belongs in config — TODO item 12).
#
# Expected: comfortably inside the 8h wall, and ZERO timeouts. 14a logged 76 (at ~10 tok/s
# a 16,384-token generation needs ~1600s against SlurmClusterService's hardcoded 600s httpx
# timeout); at 64 concurrent on an A100 per-request speed is ~4x that, so the ceiling is not
# reached. R13, on 4 replicas, logged 0 in both mj_193.err and mj_19.err.
#
# ⚠️ THE TIMEOUT FIX IS ALSO A VALIDITY FIX, NOT JUST A SPEED ONE. A timed-out call returns
# empty and scores as non-jailbreak. That lowers per-draw ASR by ~the timeout rate while
# barely moving ensemble ASR (which needs 1 success in 100), and amplification is
# ensemble/per-draw — so lost draws INFLATE amplification, preferentially in the T=0.0 arm
# (greedy decoding loops to max_tokens far more often). That manufactures exactly the
# "amplification stays high at T=0" signature P8-H1 predicts. The pre-registered check in
# text_docs/bestofn_attack/experiment_results.md STILL APPLIES: count empty/error responses
# per arm from raw_results.jsonl; <0.5pp apart -> report as measured with counts stated;
# >=0.5pp -> recompute treating timed-out draws as MISSING, not failed, and report both.
#
# ══════════════════════════════════════════════════════════════════════════════
# EVERYTHING BELOW THIS LINE IS UNCHANGED SCIENCE FROM 14a — the hypothesis, the
# cell choice, and the prompt_range are identical, so 14b is a re-measurement, not
# a redesign. Do not "improve" it; the comparison band depends on it.
# ══════════════════════════════════════════════════════════════════════════════
#
# ── THE CONFOUND ────────────────────────────────────────────────────────────
# R12+R13 established that a defense leaks to best-of-N iff its verdict is a SAMPLE. But
# every stochastic-verdict defense tested draws that sample FROM THE TARGET:
#
#   defense            screener              stochastic?
#   sage               TARGET                yes
#   llm_self_defense   TARGET                yes
#   selfdefend         separate shadow       no (greedy)
#   guard_baseline     separate classifier   no (greedy)
#
# `target-vs-separate` is PERFECTLY CONFOUNDED with `stochastic-vs-greedy`, so the data
# cannot distinguish:
#   (H1) OURS — the verdict is a SAMPLE, so resampling re-rolls it.
#   (H2) OLD BORROWED-STRENGTH — a defense that REUSES THE TARGET inherits its behaviour.
# Both predict the four numbers we have. Publishing H1 on that evidence would assert more
# than we measured.
#
# ── WHY semantic_smooth IS THE ONLY AVAILABLE CELL THAT BREAKS IT ───────────
# It is the missing quadrant: a SEPARATE screener that is STOCHASTIC.
#   - perturbation_model: gemini-2.5-flash-lite  (NOT the target)
#   - perturbation_temperature: 0.7              (its own randomness)
#   - n_copies: 5 -> 5 paraphrases + 5 target queries + 5 gpt-5-nano votes per prompt
# Its verdict is a majority vote over 5 paraphrases redrawn every call, so the verdict is a
# sample with NOTHING to do with the target's temperature.
# ⚠️ DEFAULTS DELIBERATELY NOT OVERRIDDEN. The published config is the measurement;
# overriding perturbation_model is for an appendix parity check only.
#
# ── OPPOSITE PREDICTIONS (this is the point) ────────────────────────────────
#   P8-H1 (ours):   amplification stays HIGH at target T=0 — its variance is internal, so
#                   dropping target temperature should barely touch it. Concretely: well
#                   above the 2.5-4.4x band ALL FOUR previous defenses collapse into at T=0.
#   P8-H2 (old):    amplification is LOW at BOTH temperatures, because semantic_smooth never
#                   reuses the target and so has nothing to borrow.
# One number decides it: **amplification at target T=0.0**. High -> H1, our account survives
# and the mechanism is genuinely "sampled verdict". Low -> H2, and the paper's central claim
# must be rewritten as borrowed-strength after all. Report whichever lands.
# Reference band at T=0.0: sage 4.4x, llm_self_defense 2.6x, selfdefend 2.6x,
# guard_baseline 2.5x. At T=1.0 they separate: 14.6x / 6.1x / 3.4x / 3.0x.
#
# ── WHY N=100 ON 25 BEHAVIOURS RATHER THAN N=25 ON 100 ──────────────────────
# The BoN dataset is BEHAVIOUR-MAJOR (verified: rows 0-99 = behaviour 0 draws 0-99), so
# `prompt_range: [0, 2499]` selects the FIRST 25 BEHAVIOURS AT FULL N=100. N stays identical
# to every existing cell, so amplification compares directly with no recomputation. The cost
# is a coarser ensemble denominator (25 behaviours, ±4%) — acceptable because the predicted
# contrast is large, not marginal.
# ⚠️ A contiguous prompt_range CANNOT express "first 25 draws of every behaviour" under
# behaviour-major ordering; that needs a rebuilt transform dir. Do not assume it can.
#
# ── COST ────────────────────────────────────────────────────────────────────
# 2 cells x 2,500 prompts x 5 copies = 12,500 gemini-2.5-flash-lite paraphrases + 12,500
# gpt-5-nano internal votes PER CELL. Estimated ~$11-12 total. Target queries are
# cluster-served ($0). The gpt-5-nano judge here is the DEFENSE'S OWN internal vote, part of
# the published method, not a judging shortcut.
#
# ── WHERE: NURC ─────────────────────────────────────────────────────────────
# aicr OR nurc — semantic_smooth calls gemini + OpenAI, and xc's routing policy bars
# non-Bedrock API models (conf/clusters/xc.yaml). NOT xc.
# NURC chosen 2026-08-07: AICR had 0 idle GPU nodes and 57 cluster-wide running GPU jobs —
# the same condition that deadlocked 14a's FIRST attempt there (job 312598, all 5 servers
# PENDING for 2h48). Check REAL schedulability before rerouting, not just your own quota:
#   ssh <cluster> 'sinfo -p gpu -t idle -h -o "%D %N"'
#   ssh <cluster> 'squeue -t R -h -o "%b" | grep -c gpu'
#
#   ssh explorer; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment.sbatch bestofn_attack/r14b_confound_breaker_semsmooth
#
# ── JUDGE ───────────────────────────────────────────────────────────────────
# wildguard on-cluster (FREE) for shape; ⚠️ not reportable (code-bearing arm). The statistic
# that matters — amplification — is a within-cell RATIO under the SAME judge, so wildguard
# settles H1 vs H2 on its own. gpt-5-mini rejudge (~$2) for publishable magnitudes, its own ask.
num_main_job_threads: 2
num_cluster_jobs: 5          # 4 servers (llama x3 + wildguard) + orchestrator

_e: &e
  mode: defense+evaluate
  source_transform_subdir: outputs/bestofn_attack/prompt_transform/harmbench/code_attack_20260805_212854_26701649/code_attack
  prompt_range: [0, 2499]                 # 25 behaviours x 100 draws (behaviour-major)
  target_model: llama3_1_8b_cluster
  defense: semantic_smooth
  judge_model: wildguard
  judge_method: wildguard
  benchmark: harmbench
  campaign: bestofn_attack_r14_confound

tasks:
  - {<<: *e, target_model_config: {temperature: 1.0, max_concurrency: 64}}
  - {<<: *e, target_model_config: {temperature: 0.0, max_concurrency: 64}}
