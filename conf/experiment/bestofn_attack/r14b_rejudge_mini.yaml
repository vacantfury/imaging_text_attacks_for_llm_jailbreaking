# bestofn_attack AS-4 — R14b REJUDGE: publishable magnitudes for the confound breaker.
#
# OWNER-APPROVED 2026-08-07 ("go").
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
# R14b settled H1 vs H2 on the free on-cluster wildguard judge, and that was legitimate:
# amplification is a WITHIN-CELL RATIO (ensemble / per-draw) under the SAME judge, so the
# comparison against the 2.5-4.4x reference band survives a biased judge as long as the bias
# is common to numerator and denominator. What does NOT survive is the ABSOLUTE level —
# wildguard over-flags code-bearing responses by 41-68% (memory: wildguard invalid as ASR
# judge), and this is a code_attack arm. So every number in the R14b table is shape-correct
# and magnitude-wrong. gpt-5-mini is the decided MAIN judge; these two rejudges make the
# cells quotable.
#
# ⚠️ EXPECTATION, RECORDED BEFORE THE RUN so it cannot be fitted afterwards: the ABSOLUTE
# ASRs should FALL (wildguard over-flags), and the H1 verdict should SURVIVE — amplification
# at T=0.0 should stay far above the 2.5-4.4x band. If instead T=0.0 amplification lands
# INSIDE that band, H1 does not survive the judge change and the R14b conclusion must be
# withdrawn, not explained. Report whichever lands. Note the reference band itself is a
# gpt-5-mini band, so this rejudge makes the comparison judge-matched for the first time —
# that is an improvement in the comparison, not just in the magnitudes.
#
# ── THE CELLS (temperature mapping is NOT guessable from the dir names) ─────
# ✅ CORRECTION 2026-08-08: "results.json does not persist target_model_config" was FALSE for
# defense+evaluate cells — they all carry it, temperature included, so the SOURCE cell's own
# results.json is the direct route and the MLflow lookup below was unnecessary. Only REJUDGE
# results lacked the field; now fixed. The mapping itself is correct, keep it:
#   ..._86213429  = MLflow 77f54c2f63e0494cad08ef74a679b2da  -> T=1.0
#   ..._10962111  = MLflow 27698f8d68ca41da9beed7c7b0862ffe  -> T=0.0
# Do not re-derive this from directory order or save order; the save order is FINISH order
# (the T=1.0 cell finished first only because it bound the faster replica).
#
# ── WHERE: NURC, AND ONLY NURC ──────────────────────────────────────────────
# A rejudge reads `responses_from` FROM DISK, and R14b's outputs live on NURC. Running this
# anywhere else would need the output tree synced first. Also: xc's routing policy bars
# non-Bedrock API models, so gpt-5-mini could not run there regardless.
# No GPU needed — the judge is an API model, so this does not touch the gpu QOS at all.
#
#   ssh explorer; cd ~/projects/llm_guardrail_security
#   sbatch scripts/run_experiment.sbatch bestofn_attack/r14b_rejudge_mini
#
# ── FOOTPRINT ───────────────────────────────────────────────────────────────
# 2 cells x 2,500 = 5,000 judge calls. At the measured r9 rate ($4.50 / 20,000 calls)
# that is ~$1.15 — CHEAPER than the ~$2 quoted when this was proposed; the earlier figure
# assumed 10,000-draw cells, and R14b cells are 2,500 (25 behaviours x 100 draws).
# No GPU, ~10 min.
num_cluster_jobs: 1
num_main_job_threads: 8

tasks:
# semantic_smooth x code_attack x target T=1.0   (R14b, campaign bestofn_attack_r14_confound)
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_semantic_smooth_code_attack_20260807_094413_86213429
  judge_model: gpt-5-mini

# semantic_smooth x code_attack x target T=0.0   (R14b, campaign bestofn_attack_r14_confound)
# ^ THIS is the decisive cell: its amplification is the number that separates H1 from H2.
- mode: rejudge
  responses_from: outputs/bestofn_attack/defense+evaluate/harmbench/llama3_1_8b_cluster_semantic_smooth_code_attack_20260807_094413_10962111
  judge_model: gpt-5-mini
