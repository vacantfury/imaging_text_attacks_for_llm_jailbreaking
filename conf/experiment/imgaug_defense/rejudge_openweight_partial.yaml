# Paper B (AS-2) · REJUDGE the open-weight cells the judge abandoned.
#
# WHY. Four cells of the threshold-shift open-weight round finished with all
# 100 target responses stored and healthy (0 empty) but ZERO judged:
# `status=partial_judge`, rate=None. Cause was not the target and not the key —
# llm_utils v5 auto-routes a job to the provider's native batch API when its
# WORST-CASE cost estimate clears $1, and that estimate scales with the judge's
# `max_tokens: 16384`, so a 100-prompt judge job estimates ~$3 and batches.
# The batch then has to land inside `batch_timeout` (3600s); these did not, and
# the judge was abandoned:
#   WARNING src.experiment.judging - Judge failed for
#   JailbreakBenchRefusalEvaluator: OpenAI batch batch_6a759b90... not done
#   after 3600s
# The pipeline flagged the cells rather than writing a fabricated 0.0, which is
# the correct behavior and the only reason this was caught.
#
# THE UNDERLYING FIX is already in: conf/evaluation/default.yaml now pins
# `use_batch_api: false` for judging, so judge jobs always run realtime
# (~1 min at max_concurrency=20, cents). This preset only recovers the four
# cells that were already lost.
#
# NO TARGET COST. `rejudge` re-scores stored responses from `responses_from`;
# the target model is never queried, so no vLLM server is needed and the
# open-weight models do not have to be re-served. Judge-only spend, ~$0.30 total
# for 400 prompts of gpt-5-mini.
#
# JUDGE PINNED IDENTICAL to the cells these must be comparable with —
# gpt-5-mini, and the same judge_method each cell originally used
# (`harmbench` for the harmful rung, `jbb_refusal` for the benign rungs).
# Changing the instrument here would make the recovered cells incomparable with
# the arms they pair against.
#
# SPLIT ACROSS CLUSTERS because the stored responses live where they were
# collected: three cells on AICR, one on xc. Submit each side on its own box.
#
# SUBMIT (AICR — the three AICR cells):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch imgaug_defense/rejudge_openweight_partial'
# SUBMIT (xc — the qwen cell; comment out the AICR tasks first, or run the
# xc-only twin preset):
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch imgaug_defense/rejudge_openweight_partial_xc'

num_main_job_threads: 3
num_cluster_jobs: 1          # judge is an API model — no vLLM server needed.

_j: &j
  mode: rejudge
  judge_model: gpt-5-mini
  campaign: paper_b_threshold_shift_openweight

tasks:
  # --- internvl3_8b / harmful / text arm ---
  - <<: *j
    responses_from: outputs/imgaug_defense/defense+evaluate/harmbench/internvl3_8b_no_defense_non_llm_baseline_20260807_043819_77802907
    benchmark: harmbench
    judge_method: harmbench

  # --- pixtral_12b / harmful / blank arm ---
  - <<: *j
    responses_from: outputs/imgaug_defense/defense+evaluate/harmbench/pixtral_12b_no_defense_non_llm_baseline_ir_blank_20260807_043819_60229939
    benchmark: harmbench
    judge_method: harmbench

  # --- internvl3_8b / benign rung A / text arm ---
  - <<: *j
    responses_from: outputs/imgaug_defense/defense+evaluate/jailbreakbench_benign/internvl3_8b_no_defense_non_llm_baseline_20260807_043819_87100406
    benchmark: jailbreakbench_benign
    judge_method: jbb_refusal
