# Paper B (AS-2) · SYMMETRY TEST — STAGE 2: evaluate.
#
# Consumes stage 1 (`symmetry_test_stage1`, AICR job 292257). The source dir is
# timestamped and must be pasted below.
#
# WHAT THIS DECIDES. The benign side is measured (AICR 287575): a blank canvas
# raises refusal on borderline-benign OR-Bench prompts by +51pp (claude), +34pp
# (gpt-4o-mini), +23pp (flash-lite), and does ~nothing on neutral prompts. This
# preset measures the SAME intervention on OR-Bench's matched HARMFUL set. The
# contrast is the paper's thesis:
#
#     benign_hard  text -> blank :  +23 to +51pp MORE refusal   [measured]
#     harmful      text -> blank :  ???                          [this preset]
#
# Flat harmful ASR alongside that benign cost = the shift is ASYMMETRIC: caution
# that fires on benign traffic without protecting against harmful. Falling ASR =
# an ordinary safety-utility trade-off, and the thesis narrows sharply.
#
# JUDGE IS THE HARM RUBRIC, pinned. `judge_method: harmbench` forces the
# HarmBench classifier so these cells report attack_success_rate. Left to
# auto-inference an `orbench*` path routes to the ORBench evaluator, which
# reports a refusal rate — the wrong quantity entirely for this test. The benign
# ladder pins `jbb_refusal` for the same reason: the instrument is held constant
# WITHIN each side, and the two sides deliberately use different rubrics because
# they measure different things (benign refusal vs. response harm).
#
# BOTH ARMS IN THIS JOB — same reason as the ladder. These targets are not
# deterministic at temperature 0 (46-99% of responses differ between identical
# calls on 5 of 6 checked cells), so a fresh blank arm against an older text
# baseline would confound modality with run drift.
#
# TWO CELLS THAT MAY BE UNINFORMATIVE, predicted before the run so a null is not
# over-read:
#   * claude-sonnet-4-6 — plain-harmful ASR sits ~4% in the archive AND that arm
#     carried 17% EMPTY responses (Anthropic filter) auto-scored as refusals. If
#     empties recur above 10%, EXCLUDE the cell; do not quote it.
#   * gpt-4o-mini — also low-baseline on unencoded harmful text.
# A model already near 0% cannot show a drop, so flatness there is NO EVIDENCE
# either way. The gemini pair (archive: flash 27%, flash-lite 18%) carries the
# headroom and therefore carries the test. Report accordingly.
#
# COST: 8 cells x 100 prompts, one target call each (no defense), plus the
# gpt-5-mini harm judge. Estimated ~$1-2. An ESTIMATE, not a quote — owner
# approved at this size.
#
# SUBMIT (AICR), after pasting the stage-1 dir:
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch imgaug_defense/symmetry_test_stage2'

num_main_job_threads: 4
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# <<< PASTE stage 1's timestamped parent. It holds BOTH step subdirs:
#       .../non_llm_baseline_ir_blank_<TS>_<RAND>/non_llm_baseline   (text arm)
#       .../non_llm_baseline_ir_blank_<TS>_<RAND>/ir_blank           (blank arm)
_text:  &text  PASTE/non_llm_baseline
_blank: &blank PASTE/ir_blank

_b: &b
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: harmbench
  judge_method: harmbench      # pinned: harm rubric -> ASR, NOT ORBench refusal
  judge_model: gpt-5-mini
  campaign: paper_b_symmetry_test

tasks:
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *text}
  - {<<: *b, target_model: gemini-2.5-flash,      source_transform_subdir: *blank}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *blank}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *blank}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *text}
  - {<<: *b, target_model: claude-sonnet-4-6,     source_transform_subdir: *blank}
