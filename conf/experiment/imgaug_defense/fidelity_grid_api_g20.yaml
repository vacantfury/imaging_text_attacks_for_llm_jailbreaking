# Paper B (AS-2) · METHOD-FIDELITY RE-COLLECTION — gemini-2.0-flash top-up.
#
# ⛔ BLOCKED — CANNOT RUN AS-IS. `gemini-2.0-flash` is NOT in the pinned
# `llm_utils` registry (v5.0.0): `LLMModel.from_string('gemini-2.0-flash')`
# raises "Unknown model". Only gemini-2.5-flash / -flash-lite / -pro and the
# gemini-3.x family are registered.
#
# It is NOT a dead model. Verified against the live Google endpoint 2026-08-05
# (`v1beta/models`): gemini-2.0-flash, -flash-001, -flash-lite and -flash-lite-001
# are all still served. The paper's original cells were collected when an earlier
# llm_utils still carried the row; a later version dropped it.
#
# THE FIX is a dependency change, not a preset change: add the gemini-2.0-flash
# row back to `llm_utils/llm_model.py`, cut a SemVer tag, and bump the pin in this
# repo's pyproject. That is a cross-repo change to an infrastructure package other
# projects consume, so it is NOT inside an experiment-run authorization — it needs
# its own decision. Filed in TODO.md.
#
# COST once unblocked: 3 cells on the grid's cheapest target + gpt-5-mini judge
# ≈ $0.3-0.6, under the $1 auto-run bar.
#
# WHY THIS EXISTS: `fidelity_grid_api.yaml` re-collected the code_attack grid on
# FOUR targets — gemini-2.5-flash, gemini-2.5-flash-lite, gpt-4o-mini, and a
# claude probe. The paper evaluates FIVE (paper.tex "Models:"):
#   gemini-2.0-flash, gemini-2.5-flash, gemini-2.5-flash-lite, gpt-4o-mini,
#   claude-sonnet-4-6
# gemini-2.0-flash was omitted by mistake, not by design. Its code_attack cells
# were built by the same broken encoder as the rest, so leaving it out would
# leave the paper's 5-model claim resting on 4 re-collected models and 1 stale
# one. This preset closes that.
#
# Same three-cell structure as the main preset, same fixed encoding, same judge,
# same deployable arm (`query_source: encoded`).

num_main_job_threads: 3

# Same encoding the rest of the grid consumed (AICR 285658, fixed encoder).
_text:  &text  outputs/imgaug_defense/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_decoy: &decoy outputs/imgaug_defense/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant

_base: &base
  mode: defense+evaluate
  benchmark: harmbench
  target_model: gemini-2.0-flash
  judge_model: gpt-5-mini
  campaign: paper_b_fidelity_regrid

_ecso: &ecso
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read

tasks:
  - {<<: [*base, *ecso], source_transform_subdir: *text}    # ECSO-text (= no-defense text, short-circuit)
  - {<<: [*base, *ecso], source_transform_subdir: *decoy}   # ECSO + decoy (deployable arm)
  - {<<: *base, defense: no_defense, source_transform_subdir: *decoy}   # decoy-alone control
