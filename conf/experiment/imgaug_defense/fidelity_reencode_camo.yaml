# Paper B (AS-2) · METHOD-FIDELITY RE-ENCODE — semantic-camo half ONLY.
#
# Split out from `fidelity_reencode.yaml` after AICR 285658, where the
# code_attack task SUCCEEDED and only this one failed ("model is required":
# conf/text_encoding/default.yaml's `model` does not reach the encoder when the
# step is chained into an image transform). Running the combined preset again
# would rebuild the code_attack encoding into a SECOND timestamped dir, and two
# indistinguishable dirs for the same encoding is exactly the ambiguity behind
# the recorded "latest-wins cell selection is unsafe" hazard. So this preset
# rebuilds only what is missing.
#
# CANONICAL code_attack encoding (already built, do not rebuild):
#   outputs/imgaug_defense/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031
#     code_attack/  -> TEXT arm      (verified: plain `append`, words reversed,
#                                     no `appendleft`, 100 prompts)
#     ir_constant/  -> DECOY arm     (mountain.png)
#
# COST: ~200 helper calls (component extraction + step-1 features) on
# gpt-4.1-mini ≈ $0.15. No GPU. `model` is pinned explicitly because the default
# does not reach a chained step, and gpt-4.1-mini is what the paper's original
# camo run recorded in its results_history — this preserves comparability.

num_main_job_threads: 2

tasks:
  - mode: prompt_transform
    benchmark: harmbench
    source_file: data/harmbench_prompts.jsonl
    prompt_range: [0, 99]
    campaign: paper_b_fidelity_reencode
    transformation_list:
      - {type: llm_semantic_camo, params: {model: gpt-4.1-mini}}
      - {type: ir_constant,
         params: {image_path: src/prompt_transformations/image/images/mountain.png}}
