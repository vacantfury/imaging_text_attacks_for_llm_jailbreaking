# Paper B (AS-2) · ECSO CONTENT DEPENDENCE — STAGE 2: evaluate the three arms.
#
# THE QUESTION, stated as a falsifiable contrast. ECSO captions the attached image
# and re-checks. If its protection came from READING the image, it should protect
# MORE when the image carries the harmful payload and LESS when the image is
# blank. The paper's spine predicts the opposite: the defense fires on image
# PRESENCE, so a blank canvas triggers the full re-check while a payload-bearing
# image triggers the same branch and simply feeds it content the caption step
# cannot neutralize.
#
#   text      encoded payload in text, NO image           -> ECSO inert (baseline)
#   decoy     encoded payload in text + BLANK image       -> ??? (presence fires)
#   ir_plain  encoded payload in text + payload RENDERED  -> ??? (content present)
#
# READ-OUT, recorded BEFORE the run:
#   * decoy << text  AND  ir_plain ~ text
#       -> protection comes from PRESENCE, not from reading the image. The
#          bracketed intro sentence ("triggered by a blank image but not a harmful
#          one") is earned and goes in.
#   * decoy ~ ir_plain, both << text
#       -> ECSO protects whenever an image is present regardless of content. Still
#          supports the presence claim, but KILLS the sharper "blank yes, harmful
#          no" phrasing. Delete the sentence; do not soften it into survival.
#   * ir_plain << decoy
#       -> ECSO genuinely reads the image and the content-independence reading is
#          wrong for this encoding. Report it against our own thesis.
#   * neither drops
#       -> ECSO does not protect on formal_logic at all on these models, and the
#          63pp figure is code_attack-specific. That materially narrows surface (1)
#          and must be said in the results, not buried.
#
# ALL THREE ARMS IN THIS ONE JOB. Non-negotiable: these targets are not
# deterministic at temperature 0 (46-99% of responses differ between two identical
# calls on 5 of 6 checked cells), and the whole point of this preset is to fix the
# cross-job, cross-encoding comparison that made the claim unsafe in the first
# place. Reusing the stacked run's text/ir_plain cells would reintroduce exactly
# the defect being repaired.
#
# ONE CANONICAL ENCODING BEHIND ALL THREE ARMS. Every arm descends from the SAME
# May-2026 formal_logic encoding: the text arm IS that encoding's step, and both
# image arms are renders chained off it with `keep_text` true, so the text channel
# is byte-identical across all three and only the image channel varies. Stage 1
# (AICR 301676) verified the blank arm: 100 images, exactly 1 distinct md5, 100
# prompts, status success.
#
# TWO MODELS, deliberately: gpt-4o-mini and gemini-2.5-flash-lite — the two that
# carry the SAGE coverage failure and therefore the two the stacked run measured.
# Keeping the model set identical across the two new defense experiments means
# they can be read together without a model-set confound.
#
# COST: 6 cells x 100 prompts on two cheap API targets; ECSO issues up to 2 target
# calls per prompt, plus the gpt-5-mini judge on all 600. Estimated ~$1.50 (I
# quoted ~$1 for 4 cells before realising the within-job requirement forces 6).
#
# SUBMIT (AICR):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch imgaug_defense/ecso_content_dependence_stage2'

num_main_job_threads: 6
num_cluster_jobs: 1          # API targets + API judge — no vLLM server needed.

# TEXT arm — the May-2026 formal_logic encoding itself. No image.
_text:  &text  backup_files/arr_may_submission_files/outputs/prompt_transform/harmbench/formal_logic_ir_plain_20260525_010219_56487445/llm_formal_logic
# DECOY arm — blank canvas chained off that encoding (AICR 301676, verified).
_decoy: &decoy outputs/imgaug_defense/prompt_transform/harmbench/llm_formal_logic_ir_blank_20260806_185554_4036328/ir_blank
# PAYLOAD-IMAGE arm — the same encoding rendered into the image.
_plain: &plain outputs/imgaug_defense/prompt_transform/harmbench/llm_formal_logic_ir_plain_20260803_031315_97481103/ir_plain

_b: &b
  mode: defense+evaluate
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read
  benchmark: harmbench
  judge_method: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_ecso_content_dependence

tasks:
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *text}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *decoy}
  - {<<: *b, target_model: gpt-4o-mini,           source_transform_subdir: *plain}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *text}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *decoy}
  - {<<: *b, target_model: gemini-2.5-flash-lite, source_transform_subdir: *plain}
