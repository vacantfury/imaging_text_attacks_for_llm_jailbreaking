# Paper B (AS-2) · IMAGE-PROPERTY ABLATION on an OPEN CHECKPOINT — STAGE 2
#
# WHAT THIS ROUND IS FOR. `qwen3-vl-8b-instruct` is the first OPEN checkpoint
# that shows the benign threshold shift at hosted scale: +32pp on the borderline
# rung (51% -> 83%), 32/0 discordant pairs, exact McNemar p < 1e-4 (xc job 215,
# 2026-08-07). Every model that previously showed the effect was a black-box
# hosted API, so the effect was unopenable in principle. This one is ours: we
# hold the weights, we serve it, and we can vary the input and eventually look
# inside. This round is the first half of that — vary the image's properties and
# ask WHICH property carries the shift, on a model where the answer can later be
# checked against internals rather than inferred from behaviour alone.
#
# THE ROW SLOTS INTO THE EXISTING TABLE. The eleven arms are the same eleven the
# hosted models took in `image_property_ablation_stage2`, off the same canonical
# text dir, and the ten renders were regenerated on xc and verified
# BYTE-IDENTICAL to AICR's originals (all 10 sha256 match; n=100 and exactly 1
# distinct hash per arm; see property_ablation_ow_stage1.yaml for why
# regenerating beat copying). So `qwen3-vl-8b` is directly comparable to
# gpt-4o-mini and the two gemini rows in tab:property, not a separate island.
#
# READ-OUT, RECORDED BEFORE THE RUN:
#   * every arm inflates, magnitudes cluster tightly (gpt-4o-mini's pattern)
#       -> presence alone carries it on an open checkpoint too. That is the
#          cleanest possible result: the property-invariance the paper reports
#          on one hosted model is not a quirk of that vendor, and the mechanism
#          question narrows to "what does attaching ANY image do to this
#          model's threshold" — a question internals can answer.
#   * magnitudes spread with a readable gradient (size / colour / OCR)
#       -> the image's properties set the price here as they do on the other
#          hosted models. Name the carrying axis; that axis becomes the probe's
#          independent variable.
#   * arms disagree in SIGN
#       -> presence is not one phenomenon on this model. Report it as such;
#          do not average the arms into a single number.
#   * the +32pp does not reappear on the 512x512 reference
#       -> ⚠️ STOP. The tier scan used the 1024x768 published blank, not this
#          sweep's 512x512 reference, so a null here would mean the effect is
#          size-gated rather than presence-gated. That is a real finding, but it
#          also invalidates using this model as a general probe target, so it
#          must be resolved before any internals work is planned on it.
#
# ⚠️ ARM IDENTITY IS IN THE CONFIG, NEVER THE PATH. Seven anchors below end in a
# step called `ir_blank` and three in `ir_constant`; the dirs differ only by
# timestamp+rand. These anchors were generated by reading
# `results_history[*].<leaf>.config` from each dir and are NOT hand-assigned —
# regenerate them the same way if they ever need rebuilding. Reading the arm
# from the last path component is the substring bug that has bitten this paper
# three times.
#
# NOT COMPARABLE ACROSS JOBS. The target is nondeterministic, so the text arm is
# re-run HERE and every contrast is model-vs-itself inside this job. Do not pair
# these cells against the tier scan's qwen3-vl cells.
#
# JUDGE pinned to gpt-5-mini + jbb_refusal — the same instrument as every other
# benign-refusal number in the paper, so the row is reportable without a rejudge.
#
# COST: 11 cells x 100 prompts. The target is self-served on our own GPUs = FREE.
# Only the judge costs: ~1100 gpt-5-mini refusal calls, ~$1.1. An ESTIMATE.
#
# SUBMIT (xc):
#   ssh xc 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_xc.sbatch imgaug_defense/property_ablation_ow_stage2'

num_main_job_threads: 4
num_cluster_jobs: 2          # orchestrator + 1 vLLM server (one target).

# Text channel: the sweep's canonical baseline, shared with the hosted rows.
_text:   &text   outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline

# --- resolution axis (colour + aspect held at the reference) ---------------
_b512:   &b512   outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024745_46952977/ir_blank
_b256:   &b256   outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024745_58574532/ir_blank
_b1536:  &b1536  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024745_86212350/ir_blank
# --- aspect-ratio axis (1024x141 is matched to the mountain decoy) ---------
_bWide:  &bWide  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024745_97466327/ir_blank
_bTall:  &bTall  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024746_27351476/ir_blank
# --- colour axis ----------------------------------------------------------
_bBlack: &bBlack outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024746_13337026/ir_blank
_bGrey:  &bGrey  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260808_024746_53429202/ir_blank
# --- content / OCR-ability axis -------------------------------------------
_mtnQ40: &mtnQ40 outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260808_024746_39094265/ir_constant
_mtn:    &mtn    outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260808_024747_80505435/ir_constant
_rabbit: &rabbit outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_constant_20260808_024747_83022186/ir_constant

_b: &b
  mode: defense+evaluate
  defense: no_defense
  target_model: qwen3_vl_8b_instruct
  prompt_range: [0, 99]
  benchmark: jailbreakbench_benign
  judge_method: jbb_refusal
  judge_model: gpt-5-mini
  campaign: paper_b_property_ablation_ow

tasks:
  - {<<: *b, source_transform_subdir: *text}
  - {<<: *b, source_transform_subdir: *b512}
  - {<<: *b, source_transform_subdir: *b256}
  - {<<: *b, source_transform_subdir: *b1536}
  - {<<: *b, source_transform_subdir: *bWide}
  - {<<: *b, source_transform_subdir: *bTall}
  - {<<: *b, source_transform_subdir: *bBlack}
  - {<<: *b, source_transform_subdir: *bGrey}
  - {<<: *b, source_transform_subdir: *mtnQ40}
  - {<<: *b, source_transform_subdir: *mtn}
  - {<<: *b, source_transform_subdir: *rabbit}
