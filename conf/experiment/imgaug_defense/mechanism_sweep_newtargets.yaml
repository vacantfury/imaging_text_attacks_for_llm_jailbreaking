# Paper B (AS-2) · MECHANISM SWEEP — two ADDITIONAL open-weight targets.
#
# ⏸ STAGED, NOT RUN (owner instruction 2026-08-05). Submit command at the bottom.
#
# WHY MORE TARGETS. The mechanism sweep's headline finding is not a single number
# but a SIGN INVERSION: SAGE amplified strongly on the frontier API models
# (+35.0 gemini-2.5-flash-lite, +20.0 gpt-4o-mini) and inverted on all three
# open-weight targets (-11.0, -12.0, ...), every contrast significant. A claim of
# the form "the effect depends on model class" is only as strong as the number of
# models on each side, and three-vs-two is thin. These two targets take the
# open-weight side from 3 to 5 without touching anything else — same prompts, same
# n, same encoders, same judge — so the comparison stays clean.
#
# WHY THESE TWO SPECIFICALLY. Both are already cached on all three clusters
# (verified 2026-08-05), so they cost only judge dollars and no download; and both
# are genuinely different lineages from the existing three, which matters when the
# claim is about a CLASS rather than a checkpoint:
#   Qwen3-VL-8B-Instruct        — a newer generation than the Qwen2.5-VL-7B
#                                 already in the set, so it separates "Qwen"
#                                 from "this Qwen vintage".
#   Llama-3.2-11B-Vision-Instr. — Meta's vision line, absent from the sweep
#                                 entirely; the existing three are Qwen, InternVL
#                                 and Mistral/Pixtral.
#
# WHAT IS NOT HERE, deliberately: this preset covers the four defenses whose
# ladder positions the sweep already established (no_defense / ecso / sage /
# llm_self_defense). The image-inspecting gate is in mechanism_sweep_cider.yaml
# instead, because it loads a 7B encoder in-process and therefore has to run
# single-threaded on a GPU orchestrator — mixing it in here would force this
# whole 32-cell preset to run serially for no reason.
#
# THE DEFENSE LADDER, unchanged from mechanism_sweep.yaml (that file carries the
# full rationale and the pre-registered read-out rule):
#   no_defense        target only      nothing   — no defense to branch on
#   ecso              sees the image   input     — the H1-positive case
#   sage              does NOT         input     — where the inversion showed up
#   llm_self_defense  never            OUTPUT    — the decisive cell
#
# n=100 throughout, matching every other cell in the paper. Mixing 100 and 240
# across a paper invites "why not all at 240" (owner ruling 2026-08-05); breadth
# at constant n instead of depth at variable n.
#
# COST: 32 cells x 100 prompts. Both targets are cluster-served (free GPU); the
# only spend is the gpt-5-mini judge, ~$0.64. Under the standing $1 bar, but it is
# an ESTIMATE, not a quote.
#
# SUBMIT (AICR first per the routing order; both models are cached there):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch imgaug_defense/mechanism_sweep_newtargets'

num_main_job_threads: 8
num_cluster_jobs: 5          # 1 orchestrator + 2 target servers (+ headroom);
                             # only 2 distinct models here, so the replica
                             # allocator's floor division is not a hazard.

# The FIXED-encoder chains (AICR 285658 / 285677), identical to every other AS-2 cell.
_ca_text:  &ca_text  outputs/imgaug_defense/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/code_attack
_ca_decoy: &ca_decoy outputs/imgaug_defense/prompt_transform/harmbench/code_attack_ir_constant_20260805_213025_3168031/ir_constant
_sc_text:  &sc_text  outputs/imgaug_defense/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/llm_semantic_camo
_sc_decoy: &sc_decoy outputs/imgaug_defense/prompt_transform/harmbench/llm_semantic_camo_ir_constant_20260805_213349_39577158/ir_constant

_b: &b
  mode: defense+evaluate
  benchmark: harmbench
  prompt_range: [0, 99]
  judge_model: gpt-5-mini
  campaign: paper_b_mechanism_sweep_newtargets

_ecso: &ecso
  defense: ecso
  defense_config: {query_source: encoded}   # deployable arm — no oracle read

tasks:
  # ============ Qwen3-VL-8B-Instruct: 4 defenses x 2 attacks x 2 arms (16) ============
  - {<<: *b, defense: no_defense,       target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_text}
  - {<<: *b, defense: no_defense,       target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_decoy}
  - {<<: [*b, *ecso],                   target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_text}
  - {<<: [*b, *ecso],                   target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: sage,             target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_text}
  - {<<: *b, defense: sage,             target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_text}
  - {<<: *b, defense: llm_self_defense, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *ca_decoy}

  - {<<: *b, defense: no_defense,       target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_text}
  - {<<: *b, defense: no_defense,       target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_decoy}
  - {<<: [*b, *ecso],                   target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_text}
  - {<<: [*b, *ecso],                   target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: sage,             target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_text}
  - {<<: *b, defense: sage,             target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_text}
  - {<<: *b, defense: llm_self_defense, target_model: qwen3_vl_8b_instruct, source_transform_subdir: *sc_decoy}

  # ========= Llama-3.2-11B-Vision-Instruct: 4 defenses x 2 attacks x 2 arms (16) =========
  - {<<: *b, defense: no_defense,       target_model: llama3_2_11b_vision, source_transform_subdir: *ca_text}
  - {<<: *b, defense: no_defense,       target_model: llama3_2_11b_vision, source_transform_subdir: *ca_decoy}
  - {<<: [*b, *ecso],                   target_model: llama3_2_11b_vision, source_transform_subdir: *ca_text}
  - {<<: [*b, *ecso],                   target_model: llama3_2_11b_vision, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: sage,             target_model: llama3_2_11b_vision, source_transform_subdir: *ca_text}
  - {<<: *b, defense: sage,             target_model: llama3_2_11b_vision, source_transform_subdir: *ca_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: llama3_2_11b_vision, source_transform_subdir: *ca_text}
  - {<<: *b, defense: llm_self_defense, target_model: llama3_2_11b_vision, source_transform_subdir: *ca_decoy}

  - {<<: *b, defense: no_defense,       target_model: llama3_2_11b_vision, source_transform_subdir: *sc_text}
  - {<<: *b, defense: no_defense,       target_model: llama3_2_11b_vision, source_transform_subdir: *sc_decoy}
  - {<<: [*b, *ecso],                   target_model: llama3_2_11b_vision, source_transform_subdir: *sc_text}
  - {<<: [*b, *ecso],                   target_model: llama3_2_11b_vision, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: sage,             target_model: llama3_2_11b_vision, source_transform_subdir: *sc_text}
  - {<<: *b, defense: sage,             target_model: llama3_2_11b_vision, source_transform_subdir: *sc_decoy}
  - {<<: *b, defense: llm_self_defense, target_model: llama3_2_11b_vision, source_transform_subdir: *sc_text}
  - {<<: *b, defense: llm_self_defense, target_model: llama3_2_11b_vision, source_transform_subdir: *sc_decoy}
