# Paper B (AS-2) · THRESHOLD SHIFT — OPEN-WEIGHT, pixtral_12b ONLY.
#
# SPLIT FROM `threshold_shift_openweight.yaml` after AICR 298792 stalled:
# the orchestrator dispatched all 18 tasks but only 1 of its 3 vLLM servers
# was ever scheduled, so it sat silent for >5h having finished 2 cells. One
# preset per target means each model proceeds the moment ITS server lands
# instead of every model waiting on the slowest. Same 18 cells overall, same
# sources, same pinned judges — only the job partitioning differs.
#
# WHAT THIS CLOSES. The image-presence threshold shift is currently measured on
# FOUR COMMERCIAL APIs only (AICR 287575 benign, 292343 harmful, both 2026-08-06):
#
#     benign  orbench_hard  text -> blank :  claude +51, gpt-4o-mini +34,
#                                            flash-lite +23, flash -3 (ns)
#     benign  neutral       text -> blank :  ~0 on 3 of 4  (=> threshold shift,
#                                            NOT blanket caution)
#     harmful orbench       text -> blank :  claude -18, flash-lite -6,
#                                            gpt-4o-mini -5 (ns), flash -1 (ns)
#
# Every one of those endpoints may apply undisclosed server-side moderation. The
# paper already concedes this objection is live — it is exactly why the existing
# amplification result carries a moderation-free open-weight control
# (Tab. `openweight`). The NEW core claim has no such control yet, so a reviewer
# can attribute the whole effect to a vendor filter that trips on image inputs.
# This preset removes that reading, or shows it was right.
#
# READ-OUT, recorded BEFORE the run:
#   * effect reproduces on open weights
#       -> the shift is a property of the MODEL, not of a vendor moderation
#          layer. The abstract may say "frontier VLMs, replicated moderation-
#          free". This is the outcome the restructure is written for.
#   * effect vanishes on open weights
#       -> the shift lives in the commercial serving stack. Still publishable and
#          still interesting, but the claim narrows to "hosted VLM deployments"
#          and the abstract must say so. Report it; do not retry until it appears.
#   * effect reproduces on the benign axis but not the harmful axis
#       -> the exchange-rate framing STRENGTHENS (cost with no purchase at all on
#          these models). Note that the harmful-axis headroom is small even on the
#          APIs, so a null there is weak evidence either way.
#
# SAME THREE MODELS AS THE EXISTING CONTROL TABLE, deliberately — qwen2.5-vl-7b,
# internvl3-8b, pixtral-12b. Reusing the paper's established open-weight trio
# means this slots into the existing control section instead of opening a new
# model axis a reviewer would ask us to justify.
#
# NO NEW STAGE 1. The source dirs below are the EXACT renders the commercial arm
# consumed — `prompt_transform` is model-independent (identity encoder + blank
# canvas, no model call), so the open-weight arm and the API arm see BYTE-
# IDENTICAL inputs. That is strictly better than re-rendering: it removes render
# drift as an explanation for any difference between the two arms.
#
# JUDGE PINNED TO MATCH THE API ARM EXACTLY. `gpt-5-mini` on every cell;
# `jbb_refusal` on the two benign rungs and `harmbench` on the harmful set, the
# same split the API arm used. Substituting a free cluster judge here would make
# the open-weight numbers incomparable with the numbers they exist to corroborate
# — which would waste the entire run. The judge is the only paid component.
#
# COST: target calls are FREE (local vLLM on cluster GPU). The judge is
# 18 cells x 100 = 1800 gpt-5-mini calls on short responses. Estimated ~$2-3.
# An ESTIMATE, not a quote — owner-approved at this size 2026-08-06.
#
# SUBMIT (AICR — all three source dirs verified present there 2026-08-06):
#   ssh aicr 'cd ~/projects/llm_guardrail_security && \
#     sbatch scripts/run_experiment_aicr.sbatch imgaug_defense/threshold_shift_openweight'

num_main_job_threads: 6
num_cluster_jobs: 2          # orchestrator + 3 vLLM servers (1 replica each;
                             # the per-model cap is floor(slots/n_models) and
                             # never promotes above the YAML request, which is 1)

# ---- rung 1: genuinely neutral (AlpacaEval, sensitivity-filtered) ----
_r1_text:  &r1_text  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/non_llm_baseline
_r1_blank: &r1_blank outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_6183277/ir_blank
# ---- rung 2: borderline-benign (OR-Bench hard) ----
_r2_text:  &r2_text  outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/non_llm_baseline
_r2_blank: &r2_blank outputs/imgaug_defense/prompt_transform/jailbreakbench_benign/non_llm_baseline_ir_blank_20260806_055851_77202176/ir_blank
# ---- harmful counterpart (OR-Bench harmful — constructed sibling of rung 2) ----
_h_text:   &h_text   outputs/imgaug_defense/prompt_transform/harmbench/non_llm_baseline_ir_blank_20260806_151849_37565903/non_llm_baseline
_h_blank:  &h_blank  outputs/imgaug_defense/prompt_transform/harmbench/non_llm_baseline_ir_blank_20260806_151849_37565903/ir_blank

# Benign base: refusal-rate reporting path, JBB-refusal rubric.
_ben: &ben
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: jailbreakbench_benign
  judge_method: jbb_refusal
  judge_model: gpt-5-mini
  campaign: paper_b_threshold_shift_openweight

# Harmful base: ASR reporting path, HarmBench rubric. Left to auto-inference an
# `orbench*` path would route to the ORBench evaluator and report a refusal rate
# — the wrong quantity entirely.
_harm: &harm
  mode: defense+evaluate
  defense: no_defense
  prompt_range: [0, 99]
  benchmark: harmbench
  judge_method: harmbench
  judge_model: gpt-5-mini
  campaign: paper_b_threshold_shift_openweight

tasks:
  - {<<: *ben, target_model: pixtral_12b,   source_transform_subdir: *r1_text}
  - {<<: *ben, target_model: pixtral_12b,   source_transform_subdir: *r1_blank}
  - {<<: *ben, target_model: pixtral_12b,   source_transform_subdir: *r2_text}
  - {<<: *ben, target_model: pixtral_12b,   source_transform_subdir: *r2_blank}
  - {<<: *harm, target_model: pixtral_12b,   source_transform_subdir: *h_text}
  - {<<: *harm, target_model: pixtral_12b,   source_transform_subdir: *h_blank}
