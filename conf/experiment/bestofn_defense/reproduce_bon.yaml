# Paper D (bestofn_defense) — reproduce Best-of-N's TEXT attack in our pipeline,
# judged with BoN's OWN judge (gpt-4o running the HarmBench rubric prompt).
# Posture: we BELIEVE BoN is a real threat and reproduce it faithfully — this is
# a reproduction check, NOT a judge-doubt study (that would be Paper §9).
#
# PREREQUISITE — build the expanded variant dataset first (pilot scale):
#   python3 scripts/expand_bon_dataset.py --src data/harmbench_prompts.jsonl \
#       --out data/harmbench_bon_pilot.jsonl --n-variants 200 --n-behaviors 40
# Then run stage 1, read its output timestamp, fill CHAIN_TIMESTAMP below, run stage 2.
# Full N (up to 10k) needs an on-the-fly variant loop — deferred until this pilot lands.

num_main_job_threads: 8

tasks:
  # Stage 1 — apply the BoN text augmentation to each variant row.
  - mode: prompt_transform
    source_file: data/harmbench_bon_pilot.jsonl
    transformation_list:
      - type: non_llm_best_of_n
        params: {sigma: 0.4, seed: 0}

  # Stage 2 — query the target, judge each variant with gpt-4o + HarmBench rubric.
  # no_defense = raw BoN ASR. Success per behavior = ANY __bonK variant flagged
  # (computed downstream by OR-reducing on the base id).
  - mode: defense+evaluate
    source_transform_subdir: outputs/bestofn_defense/prompt_transform/harmbench/CHAIN_TIMESTAMP/non_llm_best_of_n
    target_model: qwen2_5_vl_7b      # served open target; swap per run (BoN tested frontier models)
    defense: no_defense
    judge_model: gpt-4o              # BoN's judge: LLM-as-judge with the HarmBench rubric
    benchmark: harmbench
