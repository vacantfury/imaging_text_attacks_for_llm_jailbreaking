# Paper D (bestofn_defense) — reproduce Best-of-N's TEXT attack in our pipeline
# and measure the canonicalization defense's effect on ASR(N).
#
# JUDGES (shared Round-J resolution — text_docs/shared/judge_validation_sample.md):
#   intermediate/pilot = wildguard  (free, 7B, cluster-served, judge_method: wildguard) — set below.
#   final/headline     = gpt-5-mini (API, validated) — RESERVED for the final reportable run only,
#                        behind the API HARD GATE (state reason + explicit owner OK before use), or
#                        applied as a rejudge pass over saved responses (no re-query).
#   Do NOT use llama_3_3_70b (70B, multi-GPU, NOT a decided judge) or gpt-4o — superseded plan.
# Posture: we BELIEVE BoN is a real threat and reproduce+defend it — NOT a judge-doubt study (§9).
#
# NOTE (2026-07-16): the qwen pilot judged with gpt-5-mini (a cheap-first miss, now gated) and
# found canonicalization AMPLIFIES BoN rather than defending it (proposal §8); future runs use
# wildguard per cheap-first.
#
# PREREQUISITE — build the pilot variant dataset first:
#   python3 scripts/expand_bon_dataset.py --src data/harmbench_prompts.jsonl \
#       --out data/harmbench_bon_pilot.jsonl --n-variants 200 --n-behaviors 40
# Run stage 1, read its output timestamp, fill CHAIN_TIMESTAMP below, run stage 2.
# Full N (up to 10k) needs an on-the-fly variant loop — deferred until this pilot lands.

num_main_job_threads: 8

tasks:
  # Stage 1 — apply the BoN text augmentation to each variant row.
  - mode: prompt_transform
    source_file: data/harmbench_bon_pilot.jsonl
    transformation_list:
      - type: non_llm_best_of_n
        params: {sigma: 0.4, seed: 0}

  # Stage 2 — query the target, judge each variant with WildGuard (free).
  # no_defense = raw BoN ASR. Success per behavior = ANY __bonK variant flagged
  # (computed downstream by OR-reducing on the base id via src/analysis/bon_asr.py).
  - mode: defense+evaluate
    source_transform_subdir: outputs/bestofn_defense/prompt_transform/harmbench/CHAIN_TIMESTAMP/non_llm_best_of_n
    target_model: qwen2_5_vl_7b      # smallest served VLM target; swap per run
    defense: no_defense
    judge_model: wildguard           # free intermediate judge; gpt-5-mini reserved for final (API gate)
    judge_method: wildguard
    benchmark: harmbench
    campaign: bestofn_pilot

  # Stage 2b — SAME variants, canonicalization defense: the effective-N gate.
  # Run bon_asr on both output dirs and compare ASR(N): no_defense vs canonicalize.
  - mode: defense+evaluate
    source_transform_subdir: outputs/bestofn_defense/prompt_transform/harmbench/CHAIN_TIMESTAMP/non_llm_best_of_n
    target_model: qwen2_5_vl_7b
    defense: canonicalize
    judge_model: wildguard
    judge_method: wildguard
    benchmark: harmbench
    campaign: bestofn_pilot
