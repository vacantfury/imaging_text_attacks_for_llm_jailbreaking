# ============================================================
# Test experiment: one task per mode to verify pipeline
# ============================================================
# Usage: python main.py test
#
# NOTE: Stages depend on previous outputs.
# Update source_dir paths after running each stage.

tasks:
  # Stage 1: Encode harmbench prompts with plain passthrough
  - mode: text_encode
    encoding: plain
    source_file: data/harmbench_prompts.jsonl

  # Stage 2: Render images (both original and encoded)
  # source_dir → text_encode output
  - mode: imaging
    source_dir: outputs/text_encode/harmbench/plain_20260421_230005
    render: [original, encoded]

  # Stage 3: Evaluate with GPT-4o on text stages only (quick test)
  # source_dir → imaging output
  - mode: evaluate
    model: gpt-4o
    source_dir: outputs/imaging/harmbench/plain_plain_20260422_065802
    prompt_stages: [text_original, text_encoded]
