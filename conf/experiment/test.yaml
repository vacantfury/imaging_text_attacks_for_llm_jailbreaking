# ============================================================
# Smoke test: full pipeline on 2 prompts (text_encode → imaging → evaluate)
# ============================================================
# Usage: python main.py test
#
# Validates:
#   - text_encode: timing, LLM usage tracking, encoder resolution
#   - imaging: _load_and_slice_prompts, renderer pipeline, timing
#   - evaluate: _build_conversations_for_stage, usage/timing in results.json
#
# Cost: ~$0.01 (2 prompts × gpt-4.1-nano)

num_main_job_threads: 1

tasks:
  # ── Step 1: Text encode (LLM encoder — validates usage tracking) ──
  - mode: text_encode
    encoding: set_theory
    source_file: data/harmbench_prompts.jsonl
    prompt_range: [0, 1]

  # ── Step 2: Text encode (classical language — validates resolver fix) ──
  - mode: text_encode
    encoding: latin_literary
    source_file: data/harmbench_prompts.jsonl
    prompt_range: [0, 1]

  # ── Step 3: Imaging (plain renderer on set_theory output) ──
  # NOTE: source_dir must be updated after step 1 creates its output.
  #       For automated test, run steps sequentially or use the output
  #       from step 1. Use an existing output if available:
  - mode: imaging
    renderer_type: plain
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    render: [original, encoded]
    prompt_range: [0, 1]

  # ── Step 4: Evaluate (cheap API model, text-only stages) ──
  # Uses existing text_encode output to avoid dependency on step ordering
  - mode: evaluate
    target_model: gpt-4.1-nano
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    prompt_stages: [text_original, text_encoded]
    prompt_range: [0, 1]
