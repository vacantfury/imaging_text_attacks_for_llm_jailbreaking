    prompt_stages: [text_original, text_encoded]
    target_model: gemini-2.5-pro
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/imaging/harmbench/classical_chinese_simplified_literary_plain_20260502_231921_80268134
    prompt_stages: [image_original, image_encoded]
    target_model: gpt-5.4
