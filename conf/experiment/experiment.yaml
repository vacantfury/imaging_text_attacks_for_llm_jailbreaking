# ============================================================
# Paper C · Round 0/1 · STAGE 1b — RE-RENDER ir_plain (paginated renderer)
# ============================================================
# Regenerates the `ir_plain` image variant for the THREE canonical encodings
# using the NEW renderer (2026-06-05): FIXED readable font, content PAGINATED
# across multiple images instead of single-image shrink-to-fit. This replaces
# the old single-image ir_plain dirs (deleted) that made long encodings
# (esp. code_attack, ~13k chars) OCR-illegible.
#
#   ir_plain (image-only): encoded attack rendered INTO image(s); text channel
#            replaced with a stock "check the image" instruction (keep_text=false).
#            Long prompts now emit MULTIPLE page images → Prompt.image_encoded is
#            a LIST of paths (e.g. <id>_encoded_p0.png, _p1.png, …).
#
# Doubles as the multi-image RENDERER test: local-only (no LLM/GPU/API), fast +
# free, runs on `short`. The full [0,99] range is kept on purpose — the long
# code_attack prompts are what exercise the new pagination / multi-page output.
# (The multi-image CALL path — sending N images to a VLM — is validated next by
#  the OCR re-probe `temporary_scripts/ocr_probe.sbatch` and Stage 2.)
#
# NOT re-rendering ir_constant (decoy): the constant renderer is unchanged by
# the pagination work, so its existing dirs stay valid — re-running would only
# create duplicate decoy dirs.
#
# Produces (new prompt_transform dirs):
#   outputs/prompt_transform/harmbench/<enc>_ir_plain_<ts>_<r>/ir_plain/
#       images/<id>_encoded.png        (short prompt → 1 page)
#       images/<id>_encoded_p0.png …   (long prompt  → N pages)
#
# Run:
#   python main.py experiment                          # local (recommended; it's free)
#   sbatch scripts/run_experiment.sbatch experiment    # or on the cluster
#
# Sanity after the run: spot-check a long code_attack dir has *_p0/_p1 images and
# its prompts.jsonl `image_encoded` is a JSON array. Then re-probe OCR fidelity.
# ============================================================

num_main_job_threads: 6

# ── Canonical encodings from Stage 1 (mj_7308777) — UNCHANGED upstream ───────
_enc_set:  &enc_set   outputs/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
_enc_fl:   &enc_fl    outputs/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_enc_code: &enc_code  outputs/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack

tasks:
  # ── ir_plain (image-only delivery), paginated fixed-font renderer ──────────
  - {mode: prompt_transform, source_transform_subdir: *enc_set,  prompt_range: [0, 99],
     transformation_list: [{type: ir_plain, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_transform_subdir: *enc_fl,   prompt_range: [0, 99],
     transformation_list: [{type: ir_plain, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_transform_subdir: *enc_code, prompt_range: [0, 99],
     transformation_list: [{type: ir_plain, params: {keep_text: false}}]}
