# ============================================================
# STAGE 2 — Decoy-diversity cross-model verification
# ============================================================
# Tests whether M4 amplification observed with the "mountain"
# text-pseudo-image decoy (cross-model evidence from mj_7027715)
# also holds with two contrasting decoys:
#   - blank.png: pure white 512x512 (M3 control)
#   - rabit.jpeg: real natural image (rabbit drawing)
#
# All Stage 1 chains used here were rendered with keep_text=True
# (the FIXED chains from mj_7028227, not the buggy mj_7027565).
# Verified: each chain's prompts.jsonl has encoded text on the
# text channel and the decoy image on the image channel.
#
# Skipping SAGE on the new decoys — SAGE × M4-mountain across
# all 5 models is already available from prior runs (the
# trivial-reject finding). The novel question is whether ECSO's
# amplification effect (currently +20–72pp across models on
# mountain) holds when the decoy changes.
#
# Cells: 5 models × {no_defense, ecso} × {ca_blank, ca_rabit,
# fl_blank, fl_rabit harmful + ben_blank, ben_rabit benign}
# = 5 × 2 × 6 = 60.
#
# Cost: ~$15-30 (claude dominates).
# Wall: ~1-1.5h with num_main_job_threads=4.
#
# Usage: sbatch scripts/run_experiment.sbatch experiment
# ============================================================

num_main_job_threads: 4

# ── Stage 1 chains (FIXED, keep_text=True) from mj_7028227 ────
_chains:
  # Harmful × code_attack
  ca_blank: &ca_blank
    outputs/prompt_transform/harmbench/code_attack_ir_constant_20260526_050639_48891494/ir_constant
  ca_rabit: &ca_rabit
    outputs/prompt_transform/harmbench/code_attack_ir_constant_20260526_050639_86604878/ir_constant

  # Harmful × formal_logic
  fl_blank: &fl_blank
    outputs/prompt_transform/harmbench/llm_formal_logic_ir_constant_20260526_050639_87823422/ir_constant
  fl_rabit: &fl_rabit
    outputs/prompt_transform/harmbench/llm_formal_logic_ir_constant_20260526_050639_91435899/ir_constant

  # Benign (raw jbb_benign + decoy)
  ben_blank: &ben_blank
    outputs/prompt_transform/jailbreakbench_benign/ir_constant_20260526_050641_90920904/ir_constant
  ben_rabit: &ben_rabit
    outputs/prompt_transform/jailbreakbench_benign/ir_constant_20260526_050641_2639747/ir_constant

# ── Per-model task templates ─────────────────────────────────
_g20:   &g20    {mode: defense+evaluate, target_model: gemini-2.0-flash,      prompt_range: [0, 99]}
_flash: &flash  {mode: defense+evaluate, target_model: gemini-2.5-flash,      prompt_range: [0, 99]}
_lite:  &lite   {mode: defense+evaluate, target_model: gemini-2.5-flash-lite, prompt_range: [0, 99]}
_gpt:   &gpt    {mode: defense+evaluate, target_model: gpt-4o-mini,           prompt_range: [0, 99]}
_clds:  &clds   {mode: defense+evaluate, target_model: claude-sonnet-4-6,     prompt_range: [0, 99]}

tasks:
  # gemini-2.0-flash × 12 (the original headline-cell decoy test, now with fixed chains)
  - {<<: *g20, defense: no_defense, source_transform_subdir: *ca_blank}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *ca_blank}
  - {<<: *g20, defense: no_defense, source_transform_subdir: *ca_rabit}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *ca_rabit}
  - {<<: *g20, defense: no_defense, source_transform_subdir: *fl_blank}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *fl_blank}
  - {<<: *g20, defense: no_defense, source_transform_subdir: *fl_rabit}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *fl_rabit}
  - {<<: *g20, defense: no_defense, source_transform_subdir: *ben_blank}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *ben_blank}
  - {<<: *g20, defense: no_defense, source_transform_subdir: *ben_rabit}
  - {<<: *g20, defense: ecso,       source_transform_subdir: *ben_rabit}

  # gemini-2.5-flash × 12
  - {<<: *flash, defense: no_defense, source_transform_subdir: *ca_blank}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *ca_blank}
  - {<<: *flash, defense: no_defense, source_transform_subdir: *ca_rabit}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *ca_rabit}
  - {<<: *flash, defense: no_defense, source_transform_subdir: *fl_blank}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *fl_blank}
  - {<<: *flash, defense: no_defense, source_transform_subdir: *fl_rabit}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *fl_rabit}
  - {<<: *flash, defense: no_defense, source_transform_subdir: *ben_blank}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *ben_blank}
  - {<<: *flash, defense: no_defense, source_transform_subdir: *ben_rabit}
  - {<<: *flash, defense: ecso,       source_transform_subdir: *ben_rabit}

  # gemini-2.5-flash-lite × 12
  - {<<: *lite, defense: no_defense, source_transform_subdir: *ca_blank}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *ca_blank}
  - {<<: *lite, defense: no_defense, source_transform_subdir: *ca_rabit}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *ca_rabit}
  - {<<: *lite, defense: no_defense, source_transform_subdir: *fl_blank}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *fl_blank}
  - {<<: *lite, defense: no_defense, source_transform_subdir: *fl_rabit}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *fl_rabit}
  - {<<: *lite, defense: no_defense, source_transform_subdir: *ben_blank}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *ben_blank}
  - {<<: *lite, defense: no_defense, source_transform_subdir: *ben_rabit}
  - {<<: *lite, defense: ecso,       source_transform_subdir: *ben_rabit}

  # gpt-4o-mini × 12
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *ca_blank}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *ca_blank}
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *ca_rabit}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *ca_rabit}
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *fl_blank}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *fl_blank}
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *fl_rabit}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *fl_rabit}
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *ben_blank}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *ben_blank}
  - {<<: *gpt, defense: no_defense, source_transform_subdir: *ben_rabit}
  - {<<: *gpt, defense: ecso,       source_transform_subdir: *ben_rabit}

  # claude-sonnet-4-6 × 12 (note: code_attack cells affected by Anthropic API filter)
  - {<<: *clds, defense: no_defense, source_transform_subdir: *ca_blank}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *ca_blank}
  - {<<: *clds, defense: no_defense, source_transform_subdir: *ca_rabit}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *ca_rabit}
  - {<<: *clds, defense: no_defense, source_transform_subdir: *fl_blank}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *fl_blank}
  - {<<: *clds, defense: no_defense, source_transform_subdir: *fl_rabit}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *fl_rabit}
  - {<<: *clds, defense: no_defense, source_transform_subdir: *ben_blank}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *ben_blank}
  - {<<: *clds, defense: no_defense, source_transform_subdir: *ben_rabit}
  - {<<: *clds, defense: ecso,       source_transform_subdir: *ben_rabit}
