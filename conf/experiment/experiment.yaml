# ============================================================
# Round: Stage 9d + 9e(encode) + 10b/10c (set_theory, formal_logic)
# 1 text_encode + 4 Gemini 3 Pro eval + 6 SAGE + 6 SemanticSmooth = 17 tasks
# ============================================================

num_main_job_threads: 6

tasks:
  # -- Stage 9e: Classical Chinese HarmBench encoding --
  - mode: text_encode
    dataset: harmbench
    encoding: classical_chinese_simplified
    strategy: literary
    prompt_range: [0, 99]

  # -- Stage 9d: Gemini 3 Pro Preview eval (set_theory + formal_logic, text + image) --
  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    prompt_stages: [text_original, text_encoded]
    target_model: gemini-3-pro-preview
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/formal_logic_20260430_174327
    prompt_stages: [text_original, text_encoded]
    target_model: gemini-3-pro-preview
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/imaging/harmbench/set_theory_plain_20260429_215144
    prompt_stages: [image_original, image_encoded]
    target_model: gemini-3-pro-preview
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/imaging/harmbench/formal_logic_plain_20260501_020623
    prompt_stages: [image_original, image_encoded]
    target_model: gemini-3-pro-preview
    judge_method: harmbench
    prompt_range: [0, 99]

  # -- Stage 10b: SAGE baseline (set_theory + formal_logic × 3 frontier models) --
  - mode: defense
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    target_model: gpt-5.4
    defense_method: sage
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: defense
