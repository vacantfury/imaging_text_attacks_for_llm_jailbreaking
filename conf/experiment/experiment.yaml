# ============================================================
# Stage 10e Round 1: SAGE + IR+SAGE on Models with HarmBench Baselines
#
# Goal: Find where SAGE fails so IR+SAGE or SAGE+IR can beat it.
# Models: GPT-5.4-nano, Gemini 2.5 Flash Lite (already have HarmBench baselines)
# Encodings: set_theory, formal_logic
# Dataset: HarmBench (100 rows)
#
# Existing baselines (already done):
#   GPT-5.4-nano: text=26/39%, image=38/37%
#   Gemini 2.5 Flash Lite: text=59/57%, image=37/48%
#
# Round 1 tasks (10 total):
#   2 imaging (SAGE+IR: render SAGE-wrapped text as images, for Round 2)
#   4 SAGE evaluate (2 models × 2 encodings)
#   4 IR+SAGE evaluate (2 models × 2 encodings)
#
# Round 2 (after imaging, fill in actual dir names):
#   4 SAGE+IR evaluate (2 models × 2 encodings)
#
# Later: GPT-5-mini + Claude Sonnet 4 (need HarmBench baselines first)
# ============================================================

num_main_job_threads: 6

tasks:
  # ============================================================
  # SAGE+IR imaging — render SAGE-wrapped text as images (for Round 2)
  # ============================================================
  - mode: imaging
    source_dir: outputs/defense_transform/harmbench/sage_set_theory_20260509_032146_84156886
    render: [encoded]

  - mode: imaging
    source_dir: outputs/defense_transform/harmbench/sage_formal_logic_20260509_032146_46271704
    render: [encoded]

  # ============================================================
  # SAGE evaluate — does self-diagnosis work on weaker models?
  # ============================================================
  - mode: evaluate
    source_dir: outputs/defense_transform/harmbench/sage_set_theory_20260509_032146_84156886
    prompt_stages: [text_encoded]
    target_model: gpt-5.4-nano
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/defense_transform/harmbench/sage_formal_logic_20260509_032146_46271704
    prompt_stages: [text_encoded]
    target_model: gpt-5.4-nano
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/defense_transform/harmbench/sage_set_theory_20260509_032146_84156886
    prompt_stages: [text_encoded]
    target_model: gemini-2.5-flash-lite
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/defense_transform/harmbench/sage_formal_logic_20260509_032146_46271704
    prompt_stages: [text_encoded]
    target_model: gemini-2.5-flash-lite
    judge_method: harmbench
    prompt_range: [0, 99]

