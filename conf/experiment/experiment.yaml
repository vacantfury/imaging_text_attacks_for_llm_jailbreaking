# ============================================================
# Round: Stage 9d + 9e + 10b(transform) + 10c(remaining) + 10d(IR+SAGE)
#
# 3 defense_transform + 4 Gemini 2.5 Pro eval + 6 CC eval
# + 5 SemanticSmooth + 6 IR+SAGE = 24 tasks
#
# NOTE: SAGE+IR hybrid (Round 2) depends on defense_transform output
# from this round. Will need a follow-up job for:
#   - imaging of SAGE-wrapped text
#   - SAGE evaluate (text, using defense_transform output)
#   - SAGE+IR evaluate (image of SAGE-wrapped text)
# ============================================================

num_main_job_threads: 6

tasks:
  # -- Stage 10b: SAGE defense_transform (ALL rows, no prompt_range) --
  # Produces prompts.jsonl with SAGE-wrapped text for downstream use
  - mode: defense_transform
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    defense_method: sage

  - mode: defense_transform
    source_dir: outputs/text_encode/harmbench/formal_logic_20260430_174327
    defense_method: sage

  - mode: defense_transform
    source_dir: outputs/text_encode/harmbench/classical_chinese_simplified_literary_20260429_183644
    defense_method: sage

  # -- Stage 9d: Gemini 2.5 Pro eval (set_theory + formal_logic, text + image) --
  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/set_theory_20260429_182521
    prompt_stages: [text_original, text_encoded]
    target_model: gemini-2.5-pro
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/formal_logic_20260430_174327
    prompt_stages: [text_original, text_encoded]
    target_model: gemini-2.5-pro
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/imaging/harmbench/set_theory_plain_20260429_215144
    prompt_stages: [image_original, image_encoded]
    target_model: gemini-2.5-pro
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/imaging/harmbench/formal_logic_plain_20260501_020623
    prompt_stages: [image_original, image_encoded]
    target_model: gemini-2.5-pro
    judge_method: harmbench
    prompt_range: [0, 99]

  # -- Stage 9e: Classical Chinese frontier eval (text + image × 3 models) --
  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/classical_chinese_simplified_literary_20260429_183644
    prompt_stages: [text_original, text_encoded]
    target_model: gpt-5.4
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
    source_dir: outputs/text_encode/harmbench/classical_chinese_simplified_literary_20260429_183644
    prompt_stages: [text_original, text_encoded]
    target_model: claude-sonnet-4-6
    judge_method: harmbench
    prompt_range: [0, 99]

  - mode: evaluate
