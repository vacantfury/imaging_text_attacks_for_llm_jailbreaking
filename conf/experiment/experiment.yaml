# ============================================================
# Paper B · ARR REBUTTAL — open-weight decoy replication (2026-07-09)
# ============================================================
# >>> Active preset: `sbatch scripts/run_experiment.sbatch experiment`
#     (or `python main.py experiment`). OVERWRITTEN per round; prior rounds
#     live in git history. <<<
#
# ONE-OFF rebuttal sweep (NOT a Paper-C round; must land by 2026-07-12 for the
# OpenReview response due 2026-07-14 AoE). Replicates the Paper-B May protocol
# on moderation-free vLLM serving to answer Reviewer Q7iE ("can you run on
# routers without API content filtering?"): does the decoy-image amplification
# of ECSO survive with NO provider-side moderation layer in the loop?
#
#   no_defense — attack baseline per channel (text vs +decoy)
#   ecso       — the caption-mediated defense whose decoy amplification is the claim
#
# Channels: TEXT (encoded text only) vs DECOY (same encoded text + the EXACT
# Paper-B mountain pseudo-image — verified: the May-31 ir_constant renders carry
# 100 identical copies of the rendered-caption mountain image). Encoders:
# code_attack + formal_logic (May-31 re-generated encodes, same encoder configs
# as Paper B — the response states this honestly). Judge: gpt-5-nano (Paper-B
# parity). HarmBench-harmful rows 0-99.
#
# 2 encoders x 2 channels x 2 defenses x 3 models = 24 cells (~2.4k queries).
# Llama-3.2-Vision excluded (Mllama vLLM bug).
#
# Watch: (a) FIRST cluster run of ecso x ir_constant — image plumbing through
# defense+evaluate against vLLM endpoints; (b) outputs/ is sync-excluded, so the
# four source dirs below must already exist ON THE CLUSTER — verify with test -e
# before submitting; if the two ir_constant dirs are absent, scp them (~1.5 MB
# each) from the local copies at the same relative paths.
# ============================================================

num_main_job_threads: 6        # in-process task concurrency (>= one per server)
num_cluster_jobs: 4            # orchestrator + 3 vLLM servers (<= MAX_SUBMIT 8)

# ── target VLMs ──────────────────────────────────────────────
_qwen:     &qwen      {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 99]}
_internvl: &internvl  {mode: defense+evaluate, target_model: internvl3_8b, prompt_range: [0, 99]}
_pixtral:  &pixtral   {mode: defense+evaluate, target_model: pixtral_12b,  prompt_range: [0, 99]}

# ── Stage-1 source subdirs (May-31 batch) ────────────────────
_fl:  &fl   outputs/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_ca:  &ca   outputs/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack
_flc: &flc  outputs/prompt_transform/harmbench/llm_formal_logic_ir_constant_20260531_061400_16547161/ir_constant
_cac: &cac  outputs/prompt_transform/harmbench/code_attack_ir_constant_20260531_061400_61010177/ir_constant

tasks:
  # ── Qwen2.5-VL-7B ──────────────────────────────────────────
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *flc}

  # ── InternVL3-8B ───────────────────────────────────────────
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *flc}

  # ── Pixtral-12B ────────────────────────────────────────────
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *flc}
