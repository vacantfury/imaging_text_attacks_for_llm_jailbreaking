# STAGE 0 -- decode-compliance smoke for the decoder-disentanglement study
# CLUSTER: NURC/Explorer (AICR rtx-batch+b200-batch were 100% GPU-allocated
# with 753 pending jobs on 2026-07-28; NURC had free H200/A100 and a 47-deep
# queue). 70B runs fp8 on ONE card here, matching NURC's 1-GPU-per-job cap.
# (review-8 Q3). Cheap-first: FREE cluster judge (wildguard); the real numbers
# come from the stage-1 preset with gpt-5-mini. n=20, 3 attacks x 2 candidate
# decoders x 1 guard = 6 cells. save_trace ON: the deliverable is the decode
# TEXT, which I read for refusals -- not the ASR.
num_main_job_threads: 3
num_cluster_jobs: 4   # orchestrator + target + wildguard + decoder
tasks:
  - {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0,19], campaign: paper_c_decoder_smoke, defense: modality_complete, judge_model: wildguard, defense_config: {guard_model: wildguard, decode_text: true, decode_style: recover, reguard_original: true, decode_model: llama_3_3_70b_instruct, save_trace: true, trace_path: outputs/decode_smoke/llama_3_3_70b_instruct_code_attack.jsonl}, source_transform_subdir: outputs/autoattack_defense/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack}
  - {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0,19], campaign: paper_c_decoder_smoke, defense: modality_complete, judge_model: wildguard, defense_config: {guard_model: wildguard, decode_text: true, decode_style: recover, reguard_original: true, decode_model: llama_3_3_70b_instruct, save_trace: true, trace_path: outputs/decode_smoke/llama_3_3_70b_instruct_ir_figstep.jsonl}, source_transform_subdir: outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260718_183457_7682501/ir_figstep}
