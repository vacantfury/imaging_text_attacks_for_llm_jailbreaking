# ============================================================
# Paper C · CAMO — Step C: gpt-5-mini REJUDGE of the free-judge collection (2026-08-01)
# ============================================================
# Re-scores the 18 cells collected by camo_eval_collect.yaml (campaign
# paper_c_camo_collect, run key-free on AICR as job 244573 while the the secret manager
# service account was dead) with the paper's headline judge gpt-5-mini.
# Reads each cell's saved raw_results.jsonl — NO target re-query, no vLLM servers.
#
# ---- WHAT THIS MEASURES ----
# CAMO's per-condition ASR on the SAME grid as Table 1 (Qwen2.5-VL-7B, HarmBench
# 0-99), so it lands as a comparable point on the frontier:
#   floor            — no_defense: does CAMO break the bare target at all?
#   gb[g]            — guard g alone on the RAW attack (no amplifier)
#   mc[g]            — recover+DECODE amplifier + guard g
#   +rg[g]           — recover+decode + guard g + reguard_original (Table-1 +rg)
#   mc-recoveronly[g]— recover WITHOUT decode = CAMO's own OCR-classifier config
#
# ---- ALREADY KNOWN FROM THE COLLECTION PASS (judge-independent) ----
# Guard BLOCK rates (canned-refusal share, n=100 each):
#   floor 0% | gb 40-66% | mc-recoveronly 42-66% | mc 45-67% | +rg 58-75%
# So CAMO does NOT slip past these guards bare, and decode moves the block rate
# only marginally (mc ~ gb ~ mc-recoveronly); +rg adds ~10pp. The open question
# the judge answers: of the UNBLOCKED responses, how many are actually harmful —
# i.e. does CAMO's puzzle reassemble into a real jailbreak at 7B scale, or does
# the target get lost in the math and never emit harmful content?
#
# ---- RESOURCES ----
# 18 cells x n=100 = 1800 gpt-5-mini judgments ~= $0.32 at the measured
# $0.018/100 rate. Under the $1 gate. No GPU: orchestrator job only.
# Guard: check fallback_parse_count == 0 and grep insufficient_quota — a dead
# judge account fakes ASR 0.00, a broken judge fakes 89-96%.
# ============================================================

