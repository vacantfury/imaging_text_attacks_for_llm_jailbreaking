# ============================================================
# Found 2026-08-22 while reading the first fix (job 302). The appendix claims the gpt-5-nano
# pass covered "every one of the 449 reported harm cells". Beyond the two chains the fidelity
# audit rebuilt, TWO ENTIRE (guard, condition) CELLS were never covered by it at all:
#   llama_guard_3_8b / +reguard      0 of 11 chains
#   thinkguard       / +reguard      0 of 11 chains
# So the reguard leg -- the ONLY contrast family that survives Bonferroni in the paper, and
# therefore the paper's single strongest corrected result -- had no second-judge check on
# two of its five guards. Job 302 supplied their 2 rebuilt chains; this fills the other 9
# each, taking the second-judge ensemble panel from 3/5 guards to 5/5.
#
# 18 cells x 100 = 1,800 judgements, roughly $0.6-1.2 at gpt-5-nano's rate on this corpus.
# ZERO target cost. Same discipline as job 302: every `responses_from` is the ORIGINAL
# `defense+evaluate` dir, never a rejudge of it, because the selector resolves campaign
# through one hop only.
#
# READ IT WITH: python3 src/analysis/paper_c_second_judge_ensemble.py
# ⚠️ Check `asr is not None` + `status == success` + zero fallback/mechanism errors on all 18
#    before computing. A timed-out rejudge leaves the PREVIOUS judge's verdicts in place.
# ============================================================

