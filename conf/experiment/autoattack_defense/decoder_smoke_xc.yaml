# STAGE 0 -- decode-compliance smoke for the decoder-disentanglement study
# CLUSTER: xc -- decoder runs on BEDROCK (us.meta.llama3-3-70b-instruct-v1:0),
# the SAME model that sat 2.5h unscheduled on NURC, but as an API endpoint so it
# needs no GPU at all. Only the target + wildguard are served locally (2 of xc's
# 8 A100s; 6 were idle at submit). AICR was 100% GPU-allocated with 731 pending.
# (review-8 Q3). Cheap-first: FREE cluster judge (wildguard); the real numbers
# come from the stage-1 preset with gpt-5-mini. n=20, 3 attacks x 2 candidate
# decoders x 1 guard = 6 cells. save_trace ON: the deliverable is the decode
# TEXT, which I read for refusals -- not the ASR.
