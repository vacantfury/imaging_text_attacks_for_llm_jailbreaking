# ============================================================
# Paper C (AS-3) - HELD-OUT TEST SET, STAGE 1: render  (2026-08-07)
# ============================================================
# cspaper reviews 1 and 2 both block on the same thing: nothing separates the data
# used to CHOOSE the design from the data used to REPORT it. This renders a genuinely
# untouched test set -- HarmBench behaviors 100-199 and OR-Bench-Hard
# 100-199, taken in FILE ORDER with no selection whatsoever.
#
# Verified before writing this preset: every AS-3 preset ever run used prompt_range
# [0,99] or narrower, and every stored cell's range is within [0,99]. The maximum
# behavior index this project has ever touched is 99, so this slice is untouched by
# construction, not by assertion. HarmBench ships 240 behaviors, OR-Bench-Hard 1319.
#
# code_attack and ir_figstep render with the POST-FIX encoders (commit b266892), so
# the held-out set carries no pre-fix/post-fix seam -- unlike the development set,
# where nine chains are pre-fix and two were rebuilt.
#
# COST: 6 of the 11 attacks call an aux construction LLM (gpt-4.1-mini) once per
# prompt -- set_theory, formal_logic, classical_language, figstep's declarative
# paraphrase, mm_typo's key-phrase extraction, distraction_grid's decomposition.
# 6 x 100 = ~600 short calls, ~$1.40. The other five attacks and both
# benign channels are deterministic and free. No target queries, no judging, no GPU.
#
# >>> STAGE 2 IS DELIBERATELY NOT CHAINED <<<
# defense+evaluate consumes a TIMESTAMPED subdir. When this lands:
#     python scripts/build_heldout_presets.py stage2
# discovers the thirteen new dirs by prompt_range and writes the anchors itself.
#
# SERVERS: none. num_cluster_jobs = orchestrator only.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 1

tasks:
  # -- 11 attacks, HarmBench held-out slice --
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: set_theory}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: formal_logic}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: classical_chinese_simplified, params: {model: gpt-4.1-mini}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: cipher, params: {cipher: base64}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: code_attack}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_figstep, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_fc_flowchart, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_low_contrast, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_occluded, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_mm_typo}]}
  - {mode: prompt_transform, source_file: data/harmbench_prompts.jsonl, prompt_range: [100, 199], transformation_list: [{type: ir_distraction_grid}]}

  # -- 2 benign channels, OR-Bench-Hard held-out slice --
  - {mode: prompt_transform, source_file: data/orbench_benign_hard_prompts.jsonl, prompt_range: [100, 199], benchmark: orbench_benign_hard, transformation_list: [{type: ir_plain, params: {keep_text: false}}]}
  - {mode: prompt_transform, source_file: data/orbench_benign_hard_prompts.jsonl, prompt_range: [100, 199], benchmark: orbench_benign_hard, transformation_list: [{type: non_llm_baseline}]}
