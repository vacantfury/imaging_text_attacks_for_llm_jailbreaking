  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *class}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gbwg,  source_transform_subdir: *cipher}
  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *cipher}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *cipher}
  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *cipher}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gbwg,  source_transform_subdir: *code}
  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *code}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *code}
  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *code}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gbwg,  source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *figstep}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *figstep}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gbwg,  source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *fcflow}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gbwg,  source_transform_subdir: *lowcon}
  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *lowcon}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *lowcon}
