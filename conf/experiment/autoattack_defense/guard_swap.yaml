  - {<<: *harm, defense: modality_complete, defense_config: *mcwg,  source_transform_subdir: *occluded}
  - {<<: *harm, defense: guard_baseline,    defense_config: *gblg3, source_transform_subdir: *occluded}
  - {<<: *harm, defense: modality_complete, defense_config: *mclg3, source_transform_subdir: *occluded}
