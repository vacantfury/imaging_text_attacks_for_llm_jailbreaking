# ============================================================
# E3 — AMIA GRID, target qwen2_5_vl_7b
# cspaper review 2 con 4/Q2 + review 3 con 6 (competitive black-box baselines)
# ============================================================
# THIS IS THE FULL PUBLISHED METHOD (Zhang et al., Findings of EMNLP 2025), NOT the
# IA-only ablation. The distinction is invisible in defense_config and lives ENTIRELY
# in which upstream each task names:
#
#   image chains -> `<step>__amiamask`  = automatic masking ALREADY APPLIED upstream,
#                                         then intention analysis here => FULL AMIA
#   text chains  -> the ordinary root   = masking is undefined without an image, so
#                                         this is the full method by construction
#
# Image tasks carry `masking_precomputed: true`, which means "masking ALREADY HAPPENED
# upstream": do not run VisRAG again, but DO use the verbatim Figure-3 prompt asserting
# the image is masked, and DO label the row full AMIA. The masking happened in the precompute
# (`src/defense/amia_precompute_mask.py`, isolated transformers 4.44.2 venv), because
# VisRAG-Ret cannot load under the transformers 5.x this repo resolves for CIDER's
# encoder path. Same algorithm, moved earlier in the pipeline; see conf/defense/amia_ia.yaml.
#
# ⚠️ NEVER label these rows "AMIA (IA-only)". That label belongs ONLY to a run whose
# image upstream is UNMASKED. Reading defense_config alone cannot distinguish them, so
# any table built from these cells must be checked against `upstream_ref.source_dir`.
#
# VALIDATION TARGET, pre-registered: AMIA's Table 1 reports DSR 98.8-100.0 on FigStep,
# which is in our suite. Our FigStep cell should land near that. A large shortfall
# indicts THIS reimplementation (the authors ship no code -- their repo is an empty
# placeholder), not AMIA, and must be reported as such rather than as AMIA failing.
#
# ONE TARGET PER PRESET: AICR rtx-devel caps 2 GPUs/user and the orchestrator holds one.
# ============================================================

num_main_job_threads: 2
num_cluster_jobs: 2

# IMAGE chains: the upstream `<step>__amiamask` already carries masked images, so
# VisRAG must NOT run again here -- but this IS the full published method, and the
# target must receive the verbatim Figure-3 prompt that ASSERTS the image is masked.
# `masking_precomputed` says exactly that. Using bare `masking: false` here would
# pair a masked image with the template that does not assert masking, producing a
# third condition that is neither the published method nor its documented ablation.
_amia_masked: &amia_masked
  masking: false
  masking_precomputed: true
  n_patches: 16           # paper's published default, not a free knob
  k_mask: 3               # paper's published default, not a free knob

# TEXT chains: there is no image, so masking is undefined and the defense selects its
# text template regardless. Both flags false is the honest record of that.
_amia_text: &amia_text
  masking: false
  masking_precomputed: false
  n_patches: 16
  k_mask: 3

tasks:

  # == llm_set_theory  (text: no image to mask) ==
  - mode: defense+evaluate
    target_model: qwen2_5_vl_7b
    prompt_range: [0, 99]
    campaign: e3_amia_grid
    defense: amia_ia
    judge_model: gpt-5-mini
    source_transform_subdir: outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
    defense_config: *amia_text

