# ============================================================
# Paper C (AS-3) - HELD-OUT TEST SET, stage 2 chunk: internvl3_8b / floor + ECSO + SemanticSmooth
# cspaper reviews 1 + 2 (2026-08-07) - development/test separation
# ============================================================
# Part of the Table-1 grid re-run on behaviors 100-199, which no design
# decision in this paper has ever seen. 39 cells x 100 prompts,
# harmful and over-refusal axes together.
#
# CHUNKED BY GUARD so the round needs at most 1 concurrent server -- see
# build_chunk()'s docstring for the measured scheduling reason (a six-server preset
# is unschedulable on AICR today; a two-server one fits rtx-devel's per-user GRES
# cap and finishes in an eighth of its 4h wall).
#
# JUDGE IS gpt-5-mini INLINE, not the usual free-WildGuard-then-rejudge two-step. The
# held-out numbers must be directly comparable to Table 1's rejudged values, and
# WildGuard is invalid as an ASR judge in this repo (it flags intent and strings
# rather than completion: 41-68% false positives). No rejudge owed afterwards.
#
# NOTHING IS TUNED HERE. Every threshold, guard, decode style and policy is copied
# from the development configuration unchanged -- that is the whole point. If a
# held-out number disappoints, it gets reported, not fixed.
#
# WALL: ~30 min projected at 4.5 min/cell median over 6 threads.
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 2

tasks:
  # == undefended floor + the two end-to-end baselines (guard-free) ==
  - {mode: defense+evaluate, target_model: internvl3_8b, prompt_range: [100,199], campaign: paper_c_heldout, defense: no_defense, judge_model: gpt-5-mini, source_transform_subdir: outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260807_103419_90788283/llm_set_theory}
