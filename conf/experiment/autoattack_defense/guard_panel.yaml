# ============================================================
# Paper C · 5-GUARD PANEL matrix @ n=100 (REPORTABLE) — the decode-gap
# generalizes across guards. Amplifier config held CONSTANT (recover + full-
# decode); ONLY the Step-4 guard varies.  (2026-07-18)
# ============================================================
# GUARDS (all cluster-served, FREE): wildguard, llama_guard_3_8b, qwen3guard_gen_8b,
#   thinkguard (both newly wired in guard_utils.py — parsers unit-tested; served-
#   output serve-smoke gates the run), guardreasoner_vl_7b (multimodal — sees the
#   image in the gb condition).
# Conditions per attack: guard-alone gb (the "gap" reference) vs amplifier mc, for
#   EACH of the 5 guards -> 10 cells/attack x 11 attacks = 110 harmful cells.
# Benign (image + text): no_defense BASELINE + the 10 guard conditions each = 22.
#   TOTAL = 132 cells @ n=100.
#
# RENDERS: all 13 anchors point at n=100 dirs — 4 text encoders (existing n=100)
#   + 6 image attacks + cipher + 2 benign (freshly rendered by render_n100.yaml,
#   job 167124, 2026-07-18). set_theory + classical re-pointed off their old n=20
#   dirs to the n=100 versions.
#
# JUDGES: in-run judges are THROWAWAY (wildguard harm / qwen refusal, both free);
#   keep only SAVED RESPONSES and gpt-5-mini REJUDGE them (HarmBench rubric for
#   harm, OR-Bench 3-class for refusal; the sole API step, gated on owner OK).
# SERVERS: qwen (target) + 5 guards = 6 -> num_cluster_jobs = 7 (fits AICR budget 7).
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 7

# ── shared range: n=100 reportable ──
_rng: &rng [0, 99]

# ── guard anchors: gb = guard alone ; mc = amplifier(recover+decode)+guard ──
_gbwg:  &gbwg  {guard_model: wildguard}
_gblg3:  &gblg3  {guard_model: llama_guard_3_8b}
_gbq3g:  &gbq3g  {guard_model: qwen3guard_gen_8b}
_gbtg:  &gbtg  {guard_model: thinkguard}
_gbgrvl:  &gbgrvl  {guard_model: guardreasoner_vl_7b}
_mcwg:  &mcwg  {guard_model: wildguard, decode_text: true, decode_style: recover}
_mclg3:  &mclg3  {guard_model: llama_guard_3_8b, decode_text: true, decode_style: recover}
_mcq3g:  &mcq3g  {guard_model: qwen3guard_gen_8b, decode_text: true, decode_style: recover}
_mctg:  &mctg  {guard_model: thinkguard, decode_text: true, decode_style: recover}
_mcgrvl:  &mcgrvl  {guard_model: guardreasoner_vl_7b, decode_text: true, decode_style: recover}

# in-run judges are THROWAWAY (gpt-5-mini rejudge the saved responses)
_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, judge_method: wildguard, judge_model: wildguard, campaign: paper_c_guard_panel}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_guard_panel}

# ── attack render dirs (11 attacks, all n=100) ──
_set: &set outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
