# ============================================================
# Paper C · NO-DECODE test — do the ESTABLISHED image attacks need the decode
# step at all, and does dropping it fix the over-refusal?  (2026-07-17)
# ============================================================
# Reframe (owner 2026-07-17): the 6 ESTABLISHED multimodal attacks all deliver
# harmful text via the IMAGE (FigStep numbered list, FC-Attack flowchart,
# MM-SafetyBench typography, Adversarial-Smuggling low-contrast/occluded render,
# CS-DJ distraction grid). semantic_camo is our HOMEMADE encoder, NOT established
# -> DROPPED here. For image-delivered attacks the RECOVER step already transcribes
# the harmful text into the guard's view, so the DECODE step should be unnecessary
# -- and DECODE is the sole cause of the over-refusal (decode-ablation +
# gated-decode both failed to fix it while decoding).
#
# Test: mc[decode_text=false] = RECOVER + wildguard guard, NO decode, head-to-head
# vs mc[decode_text=true] (full recover+decode), same render dirs, one run.
#
# Hypotheses:
#   - HARMFUL: mc[no-decode] catches the 6 established attacks about as well as
#     mc[full-decode] (recover surfaces the image text; the guard flags it) ->
#     decode adds little for image-delivered attacks.
#   - BENIGN (OR-Bench-Hard): mc[no-decode] refusal drops to the ~25% raw-guard
#     floor (no decode -> no context-stripping -> no over-refusal), vs
#     mc[full-decode]'s ~70%. THE over-refusal fix.
#   - guard_baseline[wildguard] on benign = the 25% floor reference.
#
# If this holds: the established-ensemble defense is RECOVER + guard (no decode),
# over-refusal solved. Decode (behind a deterministic surface gate) is then only
# needed for the ENCODING attacks (set theory / cipher) -- a separate follow-up.
#
# Judges (cheap-first): harmful -> wildguard; OR-Bench -> qwen (ORBench 3-class).
# Servers: qwen (target + orbench-judge) + wildguard (guard + harm-judge) = 2
#   -> num_cluster_jobs = orchestrator + 2 = 3. No API in-run.
# PILOT slice [0,19]; scale after the direction holds.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 3

_wg: &wg wildguard
_nodec: &nodec {guard_model: wildguard, decode_text: false}
_full:  &full  {guard_model: wildguard, decode_text: true, decode_style: recover}

_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 19], judge_method: wildguard, judge_model: wildguard, campaign: paper_c_no_decode}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 19], benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_no_decode}

# ── existing render dirs (6 established attacks from mj_8412009; OR-Bench from mj_8414208) ──
_figstep:  &figstep  outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260716_194159_70433849/ir_figstep
_fcflow:   &fcflow   outputs/autoattack_defense/prompt_transform/harmbench/ir_fc_flowchart_20260716_194159_69181110/ir_fc_flowchart
_lowcon:   &lowcon   outputs/autoattack_defense/prompt_transform/harmbench/ir_low_contrast_20260716_194159_9379140/ir_low_contrast
_occluded: &occluded outputs/autoattack_defense/prompt_transform/harmbench/ir_occluded_20260716_194159_10657917/ir_occluded
_mmtypo:   &mmtypo   outputs/autoattack_defense/prompt_transform/harmbench/ir_mm_typo_20260716_194203_32634422/ir_mm_typo
_distract: &distract outputs/autoattack_defense/prompt_transform/harmbench/ir_distraction_grid_20260716_194203_7625970/ir_distraction_grid
_orb_img:  &orb_img  outputs/autoattack_defense/prompt_transform/orbench_benign_hard/ir_plain_20260717_020703_54610685/ir_plain

tasks:
  # ── HARMFUL: no-decode vs full-decode on the 6 established image attacks ──
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *figstep}
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *fcflow}
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *lowcon}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *lowcon}
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *occluded}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *occluded}
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *mmtypo}
  - {<<: *harm, defense: modality_complete, defense_config: *nodec, source_transform_subdir: *distract}
  - {<<: *harm, defense: modality_complete, defense_config: *full,  source_transform_subdir: *distract}

  # ── BENIGN over-refusal: floor, isolation control, no-decode vs full-decode ──
  - {<<: *ben, defense: no_defense,                                            source_transform_subdir: *orb_img}
  - {<<: *ben, defense: guard_baseline,    defense_config: {guard_model: *wg}, source_transform_subdir: *orb_img}
  - {<<: *ben, defense: modality_complete, defense_config: *nodec,             source_transform_subdir: *orb_img}
  - {<<: *ben, defense: modality_complete, defense_config: *full,              source_transform_subdir: *orb_img}
