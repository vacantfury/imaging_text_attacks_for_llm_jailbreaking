# ============================================================
# Paper C (AS-3) -- review 6 con 4 / Q3: COMPLETE the second-judge cross-check
# ============================================================
# WHAT IS BROKEN. The appendix says we "re-scored every one of the 449 reported harm cells"
# with gpt-5-nano. That was true when written and is now STALE in one exact way: the
# implementation-fidelity audit later REBUILT two chains, CODEATTACK and IR_FIGSTEP, under
# campaign `paper_c_fidelity_rerun`, and the nano pass predates that rebuild. So for those
# two chains the second judge scored the SUPERSEDED implementations, and the set the
# sentence ranges over quietly changed underneath it.
#
# The cost is not cosmetic. Because the second-judge check is missing exactly those two
# chains, `src/analysis/paper_c_select.py` refuses to build a nano ENSEMBLE at all (9/11
# chains; a union over a subset is not the paper's metric and the selector fails loudly
# rather than return a short number). That is precisely what review 6 Q3 asks for:
#
#     "Please report the second-judge results for ensemble ASR, all reguard contrasts, and
#      the main Pareto/frontier conclusions, not merely a cell-level correlation."
#
# And it leaves the check absent on CODEATTACK, which is the single attack the reviewer
# names as hardest to grade AND the one the leave-one-attack-out table shows the corrected
# statistical verdict turning on. A second-judge check that skips it answers nothing.
#
# WHAT THIS RUNS. 32 rejudge tasks: 5 guards x 3 conditions (gb, mc, +rg) x 2 rebuilt
# chains, plus the 2 undefended floor cells, all on qwen2_5_vl_7b. Every `responses_from`
# points at the ORIGINAL `defense+evaluate` dir under `paper_c_fidelity_rerun`, never at the
# gpt-5-mini rejudge of it -- a rejudge-of-a-rejudge would leave `upstream_ref` pointing at a
# dir whose mode is `rejudge`, and the selector resolves campaign through ONE hop, so those
# cells would become invisible to every analysis script.
#
# COST. 3,200 judgements. gpt-5-mini's recorded rate on this corpus is $2-4 per 1,200, and
# nano's blended price at this token mix is 0.20x that, so $1.07-$2.13 realtime and roughly
# half again if llm_utils v5 auto-routes to the native Batch API (the job's worst-case
# estimate clears the $1 threshold, so it should). ZERO target cost: `rejudge` re-scores
# stored responses and never re-queries the target or the guard.
#
# INTERNVL3 IS DELIBERATELY NOT HERE. The same 30 cells exist on the second target and would
# double the spend; the primary target is what Figure 2 and the headline rest on, so this
# establishes whether the ensemble result is judge-invariant before paying for the rest.
#
# READ IT WITH: python3 src/analysis/paper_c_second_judge_ensemble.py
#
# TRAPS THAT HAVE FIRED BEFORE ON THIS EXACT SHAPE OF JOB:
#   * A timed-out batch rejudge writes `asr: null` while raw_results.jsonl still holds the
#     PREVIOUS judge's verdicts -- a complete, plausible, WRONG number. Check
#     `asr is not None` and `status == "success"` on all 32 before computing anything.
#     (The selector already filters on `asr is not None`; do not bypass it.)
#   * Harvest a completed-but-unread OpenAI batch the same session. Batches age off the
#     list within about a day, after which the only recovery is paying again.
# ============================================================

num_main_job_threads: 8
num_cluster_jobs: 1

