# Paper C — FILL the InternVL3 benign gaps (Table 1's "---" cells) — 2026-07-29
#
# Why: Table 1 reports InternVL3 over-refusal for only 3 of 5 guards; LlamaGuard-3
# and ThinkGuard were added to the InternVL3 panel on the harm axis only. cspaper
# review 15 con 10 names this exactly ("the benign-utility component of the claimed
# 'same frontier' is only directly measured for three of five guards on InternVL3").
#
# BLOCK B ONLY (block A lives in gen2_internvl3_benign_fill.yaml):
