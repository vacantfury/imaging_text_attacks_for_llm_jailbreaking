# ============================================================
# ARR REBUTTAL — OFFICIAL HarmBench classifier re-judge (2026-07-10)
# ============================================================
# >>> Run: `sbatch scripts/run_experiment.sbatch harmbench_judge` <<<
#
# Purpose (resolves exp C's judge-calibration question): re-run the SAME 24
# open-weight cells as the `experiment` A-run, but judged by the CANONICAL
# cais/HarmBench-Llama-2-13b-cls classifier instead of gpt-5-nano. Open-weight
# vLLM at temp-0/seed-42 is deterministic → identical target responses → a clean
# same-response comparison of official-HarmBench-classifier ASR vs gpt-5-nano ASR.
#   - If classifier ≈ gpt-5-nano  → gpt-5-nano is a faithful HarmBench proxy; the
#     chat-judge (claude/gemini) gap in exp C is the chat judges being strict.
#   - If classifier ≈ chat judges → gpt-5-nano over-counts; important for revision.
#
# REQUIRES the cluster's conf/evaluation/default.yaml to point judge at
# harmbench_llama_2_13b_cls (scp'd separately for this run; restore to gpt-5-nano
# afterward). Serves 3 target vLLM servers + 1 classifier server.
#
# 2 encoders (code_attack, formal_logic) x 2 channels (text, mountain-decoy)
# x 2 defenses (no_defense, ecso) x 3 open-weight models = 24 cells.
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 5            # orchestrator + 3 target servers + 1 classifier server (<= 8)

# ── target VLMs ──────────────────────────────────────────────
_qwen:     &qwen      {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 99]}
_internvl: &internvl  {mode: defense+evaluate, target_model: internvl3_8b, prompt_range: [0, 99]}
_pixtral:  &pixtral   {mode: defense+evaluate, target_model: pixtral_12b,  prompt_range: [0, 99]}

# ── Stage-1 source subdirs (May-31 batch; already on cluster) ──
_fl:  &fl   outputs/autoattack_defense/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_ca:  &ca   outputs/autoattack_defense/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack
_flc: &flc  outputs/autoattack_defense/prompt_transform/harmbench/llm_formal_logic_ir_constant_20260531_061400_16547161/ir_constant
_cac: &cac  outputs/autoattack_defense/prompt_transform/harmbench/code_attack_ir_constant_20260531_061400_61010177/ir_constant

tasks:
  # ── Qwen2.5-VL-7B ──
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *flc}
  # ── InternVL3-8B ──
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *flc}
  # ── Pixtral-12B ──
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *ca}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *ca}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *fl}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *fl}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *cac}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *cac}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *flc}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *flc}
