# ============================================================
# Paper C (AS-3) -- cspaper review 6, Q1: THE IDENTIFICATION FACTORIAL, guardreasoner_vl_7b / qwen2_5_vl_7b
# ============================================================
# Review 6 con 1 accepts the five-arm ladder and objects only to its SCOPE: "the five-arm
# factorial described on Page 11 is only run for WildGuard on Qwen2.5-VL and only averaged
# over six image renders." Their Q1 asks for it across all five guards and both targets, and
# states the payoff plainly: "A convincing multi-guard result would substantially increase my
# confidence in the central mechanism claim; if it does not replicate, the paper should weaken
# the causal framing." This file is one cell of that replication.
#
# THE LADDER (identical to campaign paper_c_q2_view_vs_rewrite, so the two are comparable):
#   (i)   gb          guard alone
#   (ii)  rec         transcription only
#   (iii) para        transcription + rewrite, NO decode   <- prices REWRITING
#   (iv)  dec         transcription + decode (shipped)     <- (iv)-(iii) prices COMPREHENSION
#   (v)   +rg         decode + reguard
# All five arms run in ONE campaign on the SAME upstream renders, paired on prompt id, because
# run-to-run drift is +/-8-10 points -- larger than the effect being identified.
#
# THE INSTRUMENT IS JUDGE-FREE. The reported quantity is the GUARD BLOCK RATE, read off the
# exact canned refusal string. No judge enters the identification.
#
# *** THE ASR NUMBERS IN THIS CAMPAIGN ARE VOID -- HENCE THE CAMPAIGN NAME. ***
# The harm judge here is the TARGET MODEL, chosen only to keep the server count at two
# (target + guard) so the round fits both AICR's 2-GPU and NURC's 4-job per-user caps. Target-
# as-judge is not a valid ASR instrument and nothing from `asr` in this campaign may reach the
# paper or any table. Any end-to-end number is produced by a separate gpt-5-mini rejudge over
# the stored responses, at zero target cost.
#
# ARM (iii) IS A CONTROL, NOT A PROPOSED DEFENSE. If the model decodes anyway despite being
# told not to, the contrast collapses toward the null -- the direction that favours the
# REVIEWER's normalization reading over ours, so leakage cannot manufacture our result.
# src/analysis/paper_c_paraphrase_control.py measures the leakage from the decode traces.
#
# Servers: qwen2_5_vl_7b (target + decode/recover + both judges) + guardreasoner_vl_7b (guard) = 2
#   -> num_cluster_jobs = orchestrator + 2 = 3.
# Sizing: 6 image attacks x 100 + 6 arms x 300 benign = 4,800 prompts, the same shape as the
# completed WildGuard round.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 3

tasks:
