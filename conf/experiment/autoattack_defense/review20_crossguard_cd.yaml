  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *flog}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *class}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *cipher}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *code}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *figstep}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *fcflow}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *lowcon}
  - {<<: *harm, defense_config: *grv_nodec, source_transform_subdir: *occluded}
