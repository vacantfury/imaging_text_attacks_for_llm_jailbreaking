# guards/attacks/condition/judge all identical to Table 1 -- so any movement is
# decoder capacity and nothing else. Compare against Table 1's +rg column:
#   wildguard 43 | guardreasoner_vl_7b 58   (lowest and highest residual)
# 11 harm x 2 guards + 2 benign x 2 guards = 26 cells at n=100.
