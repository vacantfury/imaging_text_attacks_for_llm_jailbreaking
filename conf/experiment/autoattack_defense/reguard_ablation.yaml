# ============================================================
# Paper C · RQ4 — MODULAR-LAYER ABLATION: does adding the reguard layer close the
# code residual, and at what over-refusal cost? (2026-07-20)
# ============================================================
# The amplifier as a MODULAR STACK of recovery layers, each targeting an attack class:
#   layer 1 recover (image->text)  ·  layer 2 decode (encoding->plain)  ·  layer 3 REGUARD
#   (guard the FULL pre-decode text too, not just the lossy decoded gist).
# The 3-layer ablation, per guard:  gb (guard alone) -> mc (recover+decode) -> mc+reguard.
#   gb + mc ALREADY EXIST validated (campaign paper_c_guard_panel) — this preset runs ONLY
#   the NEW mc+reguard layer, on the SAME renders, so the ablation joins on prompt id.
#
# WHY reguard targets the code residual: code_attack BACKFIRES under mc because decoding to
#   prose REMOVES the raw code-syntax signal the guard used (gb 41 -> mc 46 coverage). Reguard
#   puts the raw form back in the guard's view (blocks if EITHER decoded OR raw flags). General
#   mechanism, not a code-specific patch -> dodges the benchmark-overfit critique.
#
# THE COST AXIS IS THE POINT (owner 2026-07-20): re-guarding the raw form re-triggers the guard's
#   over-refusal on benign inputs (RQ3). So this is a KNOB trading over-refusal ↑ for ASR ↓.
#   The paper's central figure = coverage-vs-over-refusal ACROSS layers. Both outcomes publish:
#   coverage>cost -> "modular recovery works"; cost>coverage -> "modular recovery has a ceiling".
#
# GUARDS (3, the most informative): wildguard (common, high mc benefit) · qwen3guard_gen_8b
#   (best mc, 65% ensemble) · guardreasoner_vl_7b (reasoning guard, the code exception).
# JUDGES: in-run THROWAWAY (wildguard harm / orbench-qwen refusal, both free cluster models);
#   keep SAVED RESPONSES and gpt-5-mini REJUDGE afterward (the sole API step, gated on owner OK).
# STATS: McNemar paired (mc vs mc+reguard, same 100 behaviors) per guard — n=100 is defensible
#   for a PAIRED comparison even though the unpaired ensemble CI is wide.
# SERVERS: qwen (target) + 3 guards = 4 -> num_cluster_jobs = 5 (fits AICR budget 7).
#
# ⚠️ reguard_original has NEVER run end-to-end — SMOKE-CHECK one cell first (guard_smoke pattern
#    + reguard_original: true) before the full 39-cell run.
# ============================================================

num_main_job_threads: 4
num_cluster_jobs: 5

# ── shared range: n=100 reportable ──
_rng: &rng [0, 99]

# ── mc + REGUARD_ORIGINAL configs (layer 3) — the ONLY new condition ──
_mcwg_rg:   &mcwg_rg   {guard_model: wildguard,           decode_text: true, decode_style: recover, reguard_original: true}
_mcq3g_rg:  &mcq3g_rg  {guard_model: qwen3guard_gen_8b,   decode_text: true, decode_style: recover, reguard_original: true}
_mcgrvl_rg: &mcgrvl_rg {guard_model: guardreasoner_vl_7b, decode_text: true, decode_style: recover, reguard_original: true}

# in-run judges are THROWAWAY (gpt-5-mini rejudge the saved responses afterward)
_harm: &harm {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, judge_method: wildguard, judge_model: wildguard, campaign: paper_c_reguard_ablation}
_ben:  &ben  {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: *rng, benchmark: orbench_benign_hard, judge_method: orbench, judge_model: qwen2_5_vl_7b, campaign: paper_c_reguard_ablation}

# ── attack render dirs (11 attacks, all n=100 — identical to guard_panel.yaml) ──
_set: &set outputs/autoattack_defense/prompt_transform/harmbench/set_theory_20260531_055707_10045511/llm_set_theory
_flog: &flog outputs/autoattack_defense/prompt_transform/harmbench/formal_logic_20260531_055707_75502107/llm_formal_logic
_class: &class outputs/autoattack_defense/prompt_transform/harmbench/classical_chinese_simplified_ir_constant_20260710_002424_56524373/llm_classical_language
_cipher: &cipher outputs/autoattack_defense/prompt_transform/harmbench/non_llm_cipher_20260718_183504_42666777/non_llm_cipher
_code: &code outputs/autoattack_defense/prompt_transform/harmbench/code_attack_20260531_055707_73740181/code_attack
_figstep: &figstep outputs/autoattack_defense/prompt_transform/harmbench/ir_figstep_20260718_183457_7682501/ir_figstep
_fcflow: &fcflow outputs/autoattack_defense/prompt_transform/harmbench/ir_fc_flowchart_20260718_183457_52987863/ir_fc_flowchart
_lowcon: &lowcon outputs/autoattack_defense/prompt_transform/harmbench/ir_low_contrast_20260718_183457_77423812/ir_low_contrast
