# ============================================================
# ARR REBUTTAL — encoder generalization beyond symbolic obfuscation (2026-07-10)
# ============================================================
# >>> Run: `sbatch scripts/run_experiment.sbatch encoder_gen` <<<
#
# Answers Q7iE/KpeZ/review0 ("effect may be specific to symbolic obfuscation:
# code, formal-logic, set-theory"). Adds TWO NON-symbolic encoders:
#   - classical_chinese (linguistic/translation; freshly generated 2026-07-10,
#     text+decoy share the same canonical encoded text — clean paired compare)
#   - semantic_camo (semantic camouflage; archived May-25 encodes, verified
#     text+decoy encoded-text match 100/100 — paired)
# Channels text vs mountain-decoy, defenses no_defense vs ecso, on the 3
# open-weight moderation-free models. Judge gpt-5-nano (A-parity). 2x2x2x3 = 24.
#
# Encode dirs scp'd to the cluster (outputs/ is sync-excluded).
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 4            # orchestrator + 3 target servers (gpt-5-nano judge is API)

_qwen:     &qwen      {mode: defense+evaluate, target_model: qwen2_5_vl_7b, prompt_range: [0, 99]}
_internvl: &internvl  {mode: defense+evaluate, target_model: internvl3_8b, prompt_range: [0, 99]}
_pixtral:  &pixtral   {mode: defense+evaluate, target_model: pixtral_12b,  prompt_range: [0, 99]}

# classical_chinese (fresh 2026-07-10)
_cc:  &cc   outputs/autoattack_defense/prompt_transform/harmbench/classical_chinese_simplified_ir_constant_20260710_002424_56524373/llm_classical_language
_ccd: &ccd  outputs/autoattack_defense/prompt_transform/harmbench/classical_chinese_simplified_ir_constant_20260710_002424_56524373/ir_constant
# semantic_camo (archived May-25, scp'd to a clean rebuttal path)
_sc:  &sc   outputs/autoattack_defense/prompt_transform/harmbench/rebuttal_semantic_camo/llm_semantic_camo
_scd: &scd  outputs/autoattack_defense/prompt_transform/harmbench/rebuttal_semantic_camo_decoy/ir_constant

tasks:
  # ── Qwen2.5-VL-7B ──
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *cc}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *cc}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *ccd}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *ccd}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *sc}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *sc}
  - {<<: *qwen, defense: no_defense, source_transform_subdir: *scd}
  - {<<: *qwen, defense: ecso,       source_transform_subdir: *scd}
  # ── InternVL3-8B ──
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *cc}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *cc}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *ccd}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *ccd}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *sc}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *sc}
  - {<<: *internvl, defense: no_defense, source_transform_subdir: *scd}
  - {<<: *internvl, defense: ecso,       source_transform_subdir: *scd}
  # ── Pixtral-12B ──
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *cc}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *cc}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *ccd}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *ccd}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *sc}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *sc}
  - {<<: *pixtral, defense: no_defense, source_transform_subdir: *scd}
  - {<<: *pixtral, defense: ecso,       source_transform_subdir: *scd}
