# AND-vs-OR reguard composition (review-9 con 6, review-8 con 8).
# The reguard layer blocks if EITHER the decoded payload d OR the pre-decode
# union r is flagged. That OR is the maximally conservative choice and it is
# what buys coverage at the over-refusal cost the paper reports. Review 9:
# "the central conclusion rests on reguard's over-refusal ... establish whether
# that cost remains under plausible calibrated compositions rather than only the
# maximally conservative OR rule." This preset runs the conjunctive variant.
#
# WHY ONE RUN IS ENOUGH: AND blocks a strict SUBSET of OR, so AND queries the
# target for a SUPERSET of OR's prompts. With per-prompt verdicts persisted
# (reguard_verdicts.jsonl, added 2026-07-28), the OR result reduces post-hoc
# from these same outputs -- so this single run yields BOTH compositions and
# re-derives the published +rg numbers as an internal consistency check.
# The reverse does not work: under OR a flagged d hides r entirely.
#
# Everything else is byte-identical to decoder_r1's cell list EXCEPT that
# decode_model is dropped -- decode stays on the 7B target, so these numbers
# compare directly against Table 2's published +rg column (wildguard 43,
# guardreasoner_vl_7b 58) rather than against the 70B-decoder arm.
# 11 harm x 2 guards + 2 benign x 2 guards = 26 cells at n=100.
num_main_job_threads: 6
num_cluster_jobs: 4   # orchestrator + target + 2 guards (decoder is a Bedrock API call)
