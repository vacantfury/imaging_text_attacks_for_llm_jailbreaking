# ============================================================
# Paper C (AS-3) - HELD-OUT TEST SET, STAGE 2: the full grid on qwen2_5_vl_7b
# cspaper reviews 1 + 2 (2026-08-07) - development/test separation
# ============================================================
# The ENTIRE Table-1 grid re-run on behaviors 100-199, which no design
# decision in this paper has ever seen: undefended floor + 5 guards x
# {gb, mc, +rg} x 11 attacks + the two end-to-end baselines, on both the harmful
# and the over-refusal axis. 234 cells x 100 prompts.
#
# ONE PRESET PER TARGET, and this is not cosmetic: the replica allocator is floor
# division, so a preset naming both targets plus five guards silently caps every
# served model to a single replica (project memory: replica_allocator_floor_division).
#
# JUDGE IS gpt-5-mini INLINE, not the usual free-WildGuard-then-rejudge two-step. The
# held-out numbers have to be directly comparable to Table 1's rejudged values, and
# WildGuard is invalid as an ASR judge in this repo (it flags intent and strings
# rather than completion: 41-68% false positives). One judging pass, the reported
# judge, no rejudge step owed afterwards.
#
# NOTHING IS TUNED HERE. Every threshold, guard, decode style and policy is copied
# from the development configuration unchanged -- that is the whole point. If a
# held-out number disappoints, it gets reported, not fixed.
#
# SERVERS: 6 (qwen2_5_vl_7b + 5 guards) -> num_cluster_jobs 7,
# inside AICR's budget of 7 and the hard cap of 8.
# WALL: ~3.5h projected (median 4.5 min/cell at 6 threads, plus SemanticSmooth's 5x
# per-prompt overhead on its 13 cells) against AICR's 24h orchestrator and server
# walls -- wide margin, checked before submitting per the round-length rule.
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 7

