# ============================================================
# Paper C (AS-3) · ORACLE-LEAK RERUN — deployable arm, target qwen2_5_vl_7b
# ============================================================
# WHY. ECSO and SemanticSmooth both fed the UNENCODED dataset query into their
# own decision path (ECSO's TELL/CAP/SAFE check; SemanticSmooth's internal vote
# judge, `semantic_smooth.py:257`). A defender facing an encoded attack does not
# possess the unencoded intent, so every recorded number for those two defenses
# is ORACLE-ASSISTED. `query_source: encoded` is the threat-model-faithful arm.
# Audit + scope: TODO items 16-18; enumerator `scripts/_enumerate_oracle_scope.py`.
#
# These tasks are generated from the enumerator's own owed-cell list, so the
# source transform dirs are byte-identical to the leaked cells they replace —
# the comparison is cell-for-cell, and nothing is re-encoded.
#
# PREDICTION, WRITTEN BEFORE THE RUN (AS-3 is a BASELINE consumer of both
# defenses, so both biases ran against our own claims):
#   ECSO — ran oracle-assisted and STILL failed to defend (90/91% ensemble ASR
#     against an 89/91% undefended floor). Removing the oracle should leave it at
#     or below that, i.e. our margin over it holds or grows. A LARGE drop in
#     ECSO's ASR would be the surprise, and would mean the oracle was somehow
#     hurting it — worth checking rather than assuming.
#   SemanticSmooth — the leak is SELECTION-ONLY: stage 4 returns a response
#     matching the majority verdict and never blocks, so a plaintext-fed judge
#     identifies the harmful majority more accurately and RETURNS a harmful
#     response. Deployable SS should therefore measure LOWER ASR (look stronger).
#     If it does, check whether the amplifier's marginal value compresses.
# ============================================================

num_main_job_threads: 6
num_cluster_jobs: 2

_rng: &rng [0, 99]
_enc: &enc {query_source: encoded}

tasks:
