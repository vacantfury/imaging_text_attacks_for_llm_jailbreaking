  - {mode: defense+evaluate, target_model: internvl3_8b, prompt_range: [0,299], campaign: paper_c_benign_stratified_kt, defense: modality_complete, judge_model: gpt-5-mini, defense_config: {guard_model: llama_guard_3_8b, decode_text: true, decode_style: recover, reguard_original: true}, source_transform_subdir: outputs/autoattack_defense/prompt_transform/orbench_benign_hard/ir_plain_20260821_053159_70002875/ir_plain}
