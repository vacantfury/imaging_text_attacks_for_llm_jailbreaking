# Evaluation defaults — judge LLM configuration.
#
# All evaluators (HarmBench, JBB harmful, JBB refusal, OR-Bench) instantiate
# their judge service via LLMServiceFactory.create(model, **judge_kwargs)
# where these values are passed through. Per-task can override at the task
# YAML level (rarely needed).
#
# Evaluator selection is DERIVED from the benchmark slug in source_dir,
# not configurable here — see EvaluatorFactory.create_from_benchmark.
# This file controls WHICH MODEL judges, not WHICH EVALUATOR is used.

judge_llm_config:
  model: gpt-5-mini       # project-wide headline ASR judge (RESOLVED 2026-07-15,
                          # text_docs/autoattack_defense/experiments_plan.md §0).
                          # NOT gpt-5-nano: nano inflates absolute ASR ~2-3x
                          # (Round J); nano runs are traceability-only and must
                          # opt in per task.
  max_tokens: 16384       # room for JSON-wrapped output with "reasoning" field
  temperature: 0.0        # deterministic classification
