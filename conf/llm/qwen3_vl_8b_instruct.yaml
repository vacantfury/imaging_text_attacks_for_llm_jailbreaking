# Qwen3-VL-8B-Instruct — recency control, sibling of qwen2_5_vl_7b
# TARGET VLM (not a guard). Same family/size class as Qwen2.5-VL-7B, one
# generation newer — mirrors qwen2_5_vl_7b.yaml's serving profile.

model:
  model: Qwen/Qwen3-VL-8B-Instruct
  max_tokens: 4096

# Same VRAM class as Qwen2.5-VL-7B (~16-20GB) — exclude small/old GPUs
# (also: Qwen3-VL is bf16-native; V100/T4 lack hardware bf16 support).
cluster:
  gpu_types_excluded: ["v100-pcie", "v100-sxm2", "t4"]
  # TODO(verify at serve-test): Qwen3-VL requires vllm>=0.11.0 for native
  # Qwen3VLForConditionalGeneration support (confirmed via vLLM/Qwen docs,
  # 2026-07). We can't check the installed vLLM version in the cluster's
  # AI_security conda env from here (no SSH). If the server fails to start
  # with an "unrecognized architecture" error, `pip install -U vllm` (or
  # check `vllm --version`) in that env before re-submitting. trust_remote_code
  # should NOT be needed once vLLM has native support — the HF model card
  # itself doesn't call for it (its "build transformers from source" caveat
  # is about a transformers release lag, not a vLLM trust_remote_code need).
