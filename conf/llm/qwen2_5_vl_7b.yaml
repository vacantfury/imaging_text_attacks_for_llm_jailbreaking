# Qwen2.5-VL-7B-Instruct — open-source multimodal (vision-language)

model:
  model: Qwen/Qwen2.5-VL-7B-Instruct
  max_tokens: 4096

# Qwen2.5-VL-7B requires ~16-20GB VRAM — exclude small GPUs
cluster:
  gpu_types_excluded: ["v100-pcie", "v100-sxm2", "t4"]
  time_limit: "04:00:00"      # short → SLURM can backfill this 1-GPU job into a gap.
                              # AICR's profile default is 24h, which is unbackfillable at
                              # our fairshare: on 2026-08-07 three of these servers sat
                              # PD(Priority) for 5h at priority 171 (queue ahead: 628-833)
                              # while ~55 of 136 rtx-batch GPUs were idle. A 6-cell round
                              # on this model needs <30 min of compute.

  # `partition` names cluster-specific hardware, so it belongs here and NOT in the
  # bare `cluster:` block above — a per-model `cluster:` value wins on EVERY
  # cluster, and "rtx-devel" does not exist on xc or NURC (see the
  # _load_cluster_config docstring: this is the leak the profiles layer exists for).
  profiles:
    aicr:
      # rtx-batch made us wait 5h on 2026-08-07: priority 171 against a 628-833
      # pending wall, while ~55 of its 136 GPUs sat idle. rtx-devel had ~11 idle
      # GPUs and one blocked job, and caps at 4h — exactly the time_limit above.
      # Cap: devel enforces QOSMaxGRESPerUser=2, so the 3rd server queues behind
      # the first two rather than starting at once. Still minutes, not hours.
      partition: rtx-devel
