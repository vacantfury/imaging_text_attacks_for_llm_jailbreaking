# @package _global_
# Qwen2.5-VL-7B-Instruct — open-source multimodal (vision-language)

defaults:
  - default

model:
  model: Qwen/Qwen2.5-VL-7B-Instruct
  max_tokens: 4096

# Qwen2.5-VL-7B requires ~16-20GB VRAM — exclude small GPUs
cluster:
  gpu_types_excluded: ["v100-pcie", "v100-sxm2", "t4"]
