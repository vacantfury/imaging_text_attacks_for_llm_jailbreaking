# Llama-3.3-70B-Instruct — judge for `jailbreakbench`, `refusal`, and `orbench`
# evaluators.
#
# Note: model-request params (temperature, max_tokens, system message) are
# canonical and hard-bound per-evaluator in:
#   - src/evaluation/jailbreakbench_evaluation/constants.py
#   - src/evaluation/jailbreakbench_refusal_evaluation/constants.py
#   - src/evaluation/orbench_evaluation/constants.py
# The `model:` block below is purely informational. This file exists only to
# drive cluster job parameters consumed by ClusterModelServerManager.

model:
  model: meta-llama/Llama-3.3-70B-Instruct
  max_tokens: 512

# 70B weights ≈ 140 GB at FP16. Originally targeted 4× A100-40GB (TP=4)
# but the cluster QoS limits GRES-per-job (QOSMaxGRESPerJob) which blocks
# 4-GPU requests for this user. So we target 2× 80GB cards instead:
# 2 × 80GB = 160GB → fits weights with KV-cache headroom.
#
# `gpu_constraint: a100@80g` forces SLURM to schedule on the 80GB A100
# nodes specifically (cluster has 2 such nodes). Without this constraint
# a num_gpus=2 request could land on the a100:3 (40GB) node and OOM at
# weight loading. SLURM constraint syntax also supports `|` for OR
# (e.g., "a100@80g|h200") if you want to fall back to H200 nodes when
# 80GB A100s are contended.
cluster:
  num_gpus: 1
  quantization: fp8           # 1 GPU/job cap (gpu PartitionQOS) → fit 70B on one H200 via fp8
  time_limit: "01:00:00"      # short → SLURM can backfill this 1-GPU job into a gap
  gpu_constraint: "cascadelake"   # H200 nodes (A100-80GB nodes are drained); no OR — sbatch chokes on `|`
  mem_gb: 128
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  dtype: bfloat16
  gpu_types_excluded: ["v100-pcie", "v100-sxm2", "t4", "p100"]
