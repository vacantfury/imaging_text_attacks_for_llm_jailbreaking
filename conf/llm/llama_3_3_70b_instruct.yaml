# Llama-3.3-70B-Instruct — judge for `jailbreakbench`, `refusal`, and `orbench`
# evaluators.
#
# Note: model-request params (temperature, max_tokens, system message) are
# canonical and hard-bound per-evaluator in:
#   - src/evaluation/jailbreakbench_evaluation/constants.py
#   - src/evaluation/jailbreakbench_refusal_evaluation/constants.py
#   - src/evaluation/orbench_evaluation/constants.py
# The `model:` block below is purely informational. This file exists only to
# drive cluster job parameters consumed by ClusterModelServerManager.

model:
  model: meta-llama/Llama-3.3-70B-Instruct
  max_tokens: 512

# 70B weights ≈ 140 GB at FP16, so every cluster here runs it fp8-quantized on a
# SINGLE card (both NURC's `gpu` PartitionQOS and AICR's rtx-batch make 1 GPU/job
# the path of least resistance; fp8 ≈ 70 GB fits an H200-141G or an AICR RTX PRO
# 6000-96G with KV-cache headroom).
#
# ── WHY THE `profiles:` SPLIT ────────────────────────────────────────────────
# The keys under `cluster:` win over conf/clusters/<profile>.yaml on EVERY
# cluster, so anything naming a node feature, partition, or QoS wall must NOT
# live there. It did once: `gpu_constraint: cascadelake` (a NURC node feature)
# reached AICR's rtx-batch partition, where sbatch rejected every server with
# "Invalid feature specification" and the whole run died in 7 seconds
# (job 225250, 2026-07-28). Cluster-INVARIANT sizing stays in `cluster:`;
# cluster-SPECIFIC settings go under `profiles.<cluster>:`.
cluster:
  # --- cluster-invariant sizing ---
  num_gpus: 1
  quantization: fp8
  mem_gb: 128
  max_model_len: 8192
  gpu_memory_utilization: 0.92
  dtype: bfloat16
  gpu_types_excluded: ["v100-pcie", "v100-sxm2", "t4", "p100"]

  profiles:
    nurc:
      # H200 nodes; the A100-80GB pair is drained. No `|` OR — sbatch chokes on it.
      gpu_constraint: "cascadelake"
      # Short wall so SLURM can backfill this 1-GPU job into a gap. Safe on NURC
      # only because its own cap is 08:00:00 anyway.
      time_limit: "01:00:00"
    aicr:
      # rtx-batch is homogeneous RTX PRO 6000 (~96 GB) — no feature to constrain
      # on, and naming one is an sbatch error. null drops --constraint entirely.
      gpu_constraint: null
      # Inherit AICR's 24h wall rather than NURC's 1h backfill trick: a 70B
      # serving 40k generations needs hours, and a server that dies at 01:00:00
      # strands every cell still queued behind it.
      time_limit: "24:00:00"
