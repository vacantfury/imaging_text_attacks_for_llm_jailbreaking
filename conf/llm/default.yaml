# Shared LLM defaults — all presets inherit these

# Model request params (maps to ModelConfig)
model:
  max_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop_sequences: []
  seed: 42
  n_completions: 1
  stream: false

  # Batch processing
  max_concurrency: 20       # asyncio semaphore limit (OpenAI/vLLM)
  max_retries: 5            # retry attempts on 429 / rate-limit
  batch_poll_interval: 30   # seconds between polls (Claude/Google native batch)
  batch_timeout: 3600       # max seconds to wait for native batch completion

# Cluster/vLLM server params now live per-cluster in conf/clusters/ (item 3,
# 2026-07-14): conf/clusters/_defaults.yaml (agnostic) + nurc.yaml / nurc_uv.yaml /
# aicr.yaml (peers). Selected by CLUSTER_PROFILE (default: nurc), merged under each
# model's conf/llm/<model>.yaml::cluster block by Experiment._load_cluster_config.
