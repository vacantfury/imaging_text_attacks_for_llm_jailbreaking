# Shared LLM defaults — all presets inherit these

# Model request params (maps to ModelConfig)
model:
  max_tokens: 16384
  temperature: 0.0
  top_p: 1.0
  top_k: 0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop_sequences: []
  seed: 42
  n_completions: 1
  stream: false

  # Batch processing
  max_concurrency: 20       # asyncio semaphore limit (OpenAI/vLLM)
  max_retries: 5            # retry attempts on 429 / rate-limit
  batch_poll_interval: 30   # seconds between polls (Claude/Google native batch)
  batch_timeout: 3600       # max seconds to wait for native batch completion

# Cluster/vLLM server params (maps to ClusterServerConfig)
cluster:
  partition: gpu
  excluded_nodes: [d1027]
  gpu_types_excluded: []
  num_gpus: 1
  num_instances: 1
  cpus_per_task: 4
  mem_gb: 32
  time_limit: "08:00:00"
  port: 8000
  gpu_memory_utilization: 0.9
  max_model_len: 16384
  dtype: null
  chat_template: null
  server_start_timeout: 3600
  endpoint_wait_timeout: 30
  cluster_server_endpoint_timeout: 10000  # max seconds a task waits for a free server
  monitor_poll_interval: 10              # seconds between health-check polls
  health_check_timeout: 5                # seconds per health-check request
  slurm_cmd_timeout: 15                  # seconds for squeue/scontrol commands
  conda_env: AI_security
  cuda_module: "cuda/12.1.1"
  hf_home: /scratch/zhang.haoyu6/huggingface_cache
