[project]
name = "imaging_text_attacks_for_llm_jailbreaking"
version = "0.1.0"
description = ""
authors = [
    {name = "Haoyu Zhang",email = "zhang.haoyu6@northeastern.edu"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "datasets (>=4.5.0,<5.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "openai (>=2.16.0,<3.0.0)",
    "anthropic (>=0.76.0,<0.77.0)",
    "google-genai (>=1.60.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "json-repair (>=0.56.0,<0.57.0)",
    "mlflow (>=3.10.0,<4.0.0)",
    "transformers (>=4.51,<6)",
    "numpy (>=2.0,<2.3)",
    "graphviz (>=0.21,<0.22)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "art (>=6.5,<7.0)",
    "homoglyphs (>=2.0.4,<3.0.0)",
    "pyspellchecker (>=0.9,<1.0)",
    "boto3>=1.43.51",
]


[tool.poetry]
package-mode = false

# uv equivalent of poetry's package-mode=false: this repo is a dependency
# container run from the repo root (main.py imports src/ via cwd), not an
# installable package. Lets `uv sync` / `uv pip install` set up the env without
# trying to build the project. (Ignored by poetry/pip, so NURC's conda env is
# unaffected.) Part of the staged poetry+conda -> uv migration (AICR first).
[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
