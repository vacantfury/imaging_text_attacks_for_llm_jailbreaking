[project]
name = "ptp"
version = "0.1.0"
description = "This project is a prompt optimization algorithm."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "datasets (>=4.5.0,<5.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "colorlog (>=6.10.1,<7.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "openai (>=2.16.0,<3.0.0)",
    "anthropic (>=0.76.0,<0.77.0)",
    "google-genai (>=1.60.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "json-repair (>=0.56.0,<0.57.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "mlflow (>=3.10.0,<4.0.0)",
    "transformers (>=4.51,<5)",
    "numpy (>=2.0,<2.3)",
    "graphviz (>=0.21,<0.22)",
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
